# HCP-SPEC-001 §0.2 #8, §11.2, §13.1 — Local Docker Compose Topology
# Non-negotiable security: containers strictly bound to 127.0.0.1, pinned image tags, segregated networks.

name: hosting-panel-local

services:
  postgres:
    image: postgres:18.1-alpine
    container_name: hosting-panel-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hosting_panel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_db_password}
      POSTGRES_DB: ${POSTGRES_DB:-hosting_panel_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hosting_panel} -d ${POSTGRES_DB:-hosting_panel_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: hosting-panel-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-local_dev_redis_password}
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local_dev_redis_password}
    volumes:
      - redis_data:/data
    networks:
      - data_private
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-local_dev_redis_password} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.0
    container_name: hosting-panel-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${POSTGRES_DB:-hosting_panel_dev}
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-hosting_panel}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_db_password}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_local_dev_password}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    networks:
      - auth_private
      - data_private

networks:
  data_private:
    name: hosting-panel-data-private
    driver: bridge
  auth_private:
    name: hosting-panel-auth-private
    driver: bridge

volumes:
  postgres_data:
    name: hosting-panel-postgres-data
  redis_data:
    name: hosting-panel-redis-data
