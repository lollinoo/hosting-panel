# HCP-SPEC-003 §5.2 / §9.1 — Shared IPC & Secret tmpfs Layout
# Mode 3770: hp-executor and hp-agent (group hp-ipc) must be able to create their UDS sockets
# here; setgid makes the sockets inherit group 'hp-ipc' so hp-api (SupplementaryGroups=hp-ipc)
# can connect; sticky stops one daemon unlinking/replacing the other's socket. Shared dir
# (not per-service RuntimeDirectory=) so ownership is never clobbered.
d /run/hosting-panel 3770 root hp-ipc -
d /run/hosting-panel/secrets 0700 hp-executor hp-executor -
