# HCP-SPEC-003 §5.2 / §9.1 — Shared IPC & Secret tmpfs Layout
# Mode 2750 (setgid hp-ipc) ensures UDS sockets created by hp-executor and hp-agent
# automatically inherit group 'hp-ipc' so hp-api (SupplementaryGroups=hp-ipc) can connect,
# while preventing per-service RuntimeDirectory= from clobbering ownership.
d /run/hosting-panel 2750 root hp-ipc -
d /run/hosting-panel/secrets 0700 hp-executor hp-executor -
