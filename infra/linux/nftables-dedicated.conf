#!/usr/sbin/nft -f
# HCP-SPEC-003 — Dedicated Host Baseline Firewall Ruleset (TCP 22, 80, 443)
# Integrity-pinned static ruleset verified by SHA-256 prior to execution.
# The three sets start empty; the host agent fills them from the panel (M5d).

table inet hp_dedicated_filter
delete table inet hp_dedicated_filter

table inet hp_dedicated_filter {
  set opened_tcp_ports {
    type inet_service
  }

  set blocked_v4 {
    type ipv4_addr
    flags interval
  }

  set blocked_v6 {
    type ipv6_addr
    flags interval
  }

  chain prerouting {
    type filter hook prerouting priority raw; policy accept;

    iifname "lo" accept
    iifname "docker0" accept
    iifname "br-*" accept
    tcp dport 22 accept
    icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
    ip saddr @blocked_v4 drop
    ip6 saddr @blocked_v6 drop
  }

  chain input {
    type filter hook input priority filter; policy drop;

    iifname "lo" accept
    ct state established,related accept
    ct state invalid drop

    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept

    tcp dport { 22, 80, 443 } ct state new accept
    tcp dport @opened_tcp_ports ct state new accept
    iifname "docker0" tcp dport 3000 ct state new accept
    iifname "br-*" tcp dport 3000 ct state new accept
  }

  # A site's code never reaches the cloud metadata address (it hands out the server's credentials).
  # DNS passes: on some clouds the server's resolver lives at that same address.
  chain forward {
    type filter hook forward priority filter; policy accept;

    ip daddr 169.254.0.0/16 udp dport 53 accept
    ip daddr 169.254.0.0/16 tcp dport 53 accept
    iifname "docker0" ip daddr 169.254.0.0/16 drop
    iifname "br-*" ip daddr 169.254.0.0/16 drop
    iifname "docker0" ip6 daddr fd00:ec2::254 drop
    iifname "br-*" ip6 daddr fd00:ec2::254 drop
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
