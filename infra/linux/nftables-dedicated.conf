#!/usr/sbin/nft -f
# HCP-SPEC-003 — Dedicated Host Baseline Firewall Ruleset (TCP 22, 80, 443)
# Integrity-pinned static ruleset verified by SHA-256 prior to execution.

table inet hp_dedicated_filter
delete table inet hp_dedicated_filter

table inet hp_dedicated_filter {
  chain input {
    type filter hook input priority filter; policy drop;

    iifname "lo" accept
    ct state established,related accept
    ct state invalid drop

    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept

    tcp dport { 22, 80, 443 } ct state new accept
    iifname "docker0" tcp dport 3000 ct state new accept
    iifname "br-*" tcp dport 3000 ct state new accept
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
