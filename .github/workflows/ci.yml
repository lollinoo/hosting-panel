# HCP-SPEC-001 §11.3 — Continuous Integration Verification Workflow
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Monorepo Quality & Security Sensors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Enable Corepack package manager
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build monorepo packages and applications
        run: corepack pnpm run build

      - name: Lint codebase
        run: corepack pnpm run lint

      - name: Typecheck monorepo
        run: corepack pnpm run typecheck

      - name: Run automated test suite
        run: corepack pnpm run test
