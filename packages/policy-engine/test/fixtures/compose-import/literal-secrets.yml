# name: Forum
# category: community
#
# Written for the importer tests of this repository: passwords written in the file, in both forms of 'environment'.

services:
  app:
    image: registry.example.invalid/forum/app:3.2
    environment:
      FORUM_DB_HOST: db
      FORUM_DB_USER: forum
      FORUM_DB_PASSWORD: correct-horse-battery-staple
      FORUM_SECRET_KEY_BASE: 0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a6978
      FORUM_UPSTREAM_HEADER: Bearer abcdefghijklmnopqrstuvwxyz012345
      FORUM_MAIL_URL: smtp://mailer:relay-pass-1234@mail.example.invalid:587
    expose:
      - "3000"

  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=forum
      - POSTGRES_PASSWORD=correct-horse-battery-staple
      - POSTGRES_DB=forum
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
