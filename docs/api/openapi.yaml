        "403":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
    patch:
      tags: [Admin Mail]
      operationId: adminSaveMailRelay
      summary: Save the relay settings; applied asynchronously. Omitting password keeps the stored one
      requestBody:
