  /v1/admin/audit:
    get:
      tags: [Admin Audit]
      operationId: listAdminAudit
      summary: Query platform immutable audit events (audit.read)
      description: >-
        Newest first, ordered by `timestamp` then `id`, both descending. Paging is by keyset:
        `page.nextCursor` is the `id` of the last event on the page, and the next page holds the
        events strictly older than that event in the same order. A cursor that names no event
        gives an empty page. There is no total count. `organizationId` and `action` are exact
        matches after trimming. When both are given, `from` must be before `to`.
      parameters:
        - in: query
          name: organizationId
          schema:
            type: string
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: from
          description: Earliest event time, included (ISO 8601 with an offset)
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          description: Latest event time, excluded (ISO 8601 with an offset)
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/CursorQuery"
        - in: query
          name: limit
          description: Events per page. A value outside 1–100 is refused (`VALIDATION_ERROR`), not clamped.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: One page of audit events
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEventDto"
                  meta:
                    type: object
                    required: [cursor, requestId, timestamp]
                    properties:
                      cursor:
                        type: string
                        nullable: true
                        description: The cursor this page was read from
                      requestId:
                        type: string
                      timestamp:
                        type: string
                        format: date-time
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "400":
          description: >-
            `limit` not a whole number from 1 to 100, `from`/`to` not an ISO 8601 date-time
            with an offset, or a `from` that is not before `to` (`VALIDATION_ERROR`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

