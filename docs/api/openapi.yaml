    AuditEventDto:
      type: object
      required: [id, actorId, actorType, organizationId, action, targetType, targetId, ipAddress, userAgent, details, timestamp]
      properties:
        id:
          type: string
        actorId:
          type: string
          nullable: true
        actorType:
          type: string
          enum: [user, system, service_account]
        organizationId:
          type: string
          nullable: true
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
          nullable: true
        ipAddress:
