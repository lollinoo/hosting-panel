      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
        - in: path
          name: name
          required: true
          description: Full database username (`<prefix>_<suffix>`)
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - in: path
          name: database
          required: true
          description: Full database name (`<prefix>` or `<prefix>_<suffix>`)
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "204":
          description: Database grant revoked
        "400":
          description: "Cannot alter grants on the site's primary database user (`VALIDATION_ERROR`, `reason: protected`)"
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.databases.manage` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site, user, or database not found within site prefix (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Database metadata lock contention or concurrent change in progress (`RESOURCE_LOCKED`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Database runtime unavailable on the active backend (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: Executor or MariaDB service unavailable or outcome unclear (`DOCKER_ENGINE_UNAVAILABLE`, retryable)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/sites:
    get:
      tags: [Admin Sites]
      operationId: adminListSites
      summary: List every managed site with owner, plus the customers a site can be assigned to (server administrator only)
      responses:
        "200":
          description: Sites and assignable customers
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AdminSitesListDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Admin Sites]
      operationId: adminCreateSite
      summary: Create a site for a customer, or held by the platform-ops organization when ownerOrganizationId is null (audited as admin.site.create)
      description: >-
        Like the customer route, with the whole parameter list of the site type open to the administrator, and a
        disabled (not archived) site type allowed when `templateId` names it. Without `templateId` the
        built-in WordPress is used, and is refused when an administrator has disabled it.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateSiteInput"
      responses:
        "202":
          description: Accepted; follow the returned operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedSiteAccepted"
        "400":
          description: >-
            Invalid input, including a parameter the site type refuses (`VALIDATION_ERROR`,
            `details[].field: parameters.<key>`) or a PHP version it does not offer
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: >-
            Unknown organization, or an unknown, disabled or archived site type (`NOT_FOUND`,
            `details[0].reason: template_unavailable`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Conflict, or the owner's site limit is reached (`QUOTA_EXCEEDED`,
            `details[0].reason: site_limit_reached`); a site held by platform-ops is never limited
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/sites/{siteId}:
    delete:
      tags: [Admin Sites]
      operationId: adminDeleteSite
      summary: Delete any managed site (audited as admin.site.delete)
      parameters:
        - $ref: "#/components/parameters/SiteIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteSiteInput"
      responses:
        "202":
          description: Accepted; follow the returned operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedSiteAccepted"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/sites/{siteId}/owner:
    post:
      tags: [Admin Sites]
      operationId: adminChangeSiteOwner
      summary: Move a site to another customer or to platform-ops (null); site secrets are re-encrypted for the new owner (audited as admin.site.reassign)
      parameters:
        - $ref: "#/components/parameters/SiteIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeSiteOwnerInput"
      responses:
        "202":
          description: Accepted; follow the returned operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedSiteAccepted"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Conflict, or the new owner's site limit is reached (`QUOTA_EXCEEDED`,
            `details[0].reason: site_limit_reached`); the move is also checked again when it runs, and
            stays with the old owner if the limit is reached by then
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/organizations/{orgId}/site-limit:
    patch:
      tags: [Admin Sites]
      operationId: adminUpdateOrganizationSiteLimit
      summary: Set or remove the maximum number of sites a customer can hold (server administrator only; audited as admin.customer.site_limit)
      description: >-
        `maxSites: null` removes the limit. A limit below the sites the customer already holds keeps those
        sites and only refuses new ones, including a site moved to this customer. The platform-ops
        organization has no limit (`NOT_FOUND`).
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationSiteLimitInput"
      responses:
        "200":
          description: The limit now in force and the sites the customer holds
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/OrganizationSiteLimitDto"
        "400":
          description: Invalid limit (`VALIDATION_ERROR`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Customer not found (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/organizations/{orgId}/app-stack-limit:
    patch:
      tags: [Admin Sites]
      operationId: adminUpdateOrganizationAppStackLimit
      summary: Set or remove the maximum number of applications a customer can hold (server administrator only; audited as admin.customer.app_stack_limit)
      description: >-
        `maxAppStacks: null` removes the limit. A limit below the applications the customer already holds
        keeps them and only refuses new ones (`QUOTA_EXCEEDED`, `details[0].reason: STACK_QUOTA_EXCEEDED`).
        Deleted applications do not count. The platform-ops organization has no limit (`NOT_FOUND`).
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationAppStackLimitInput"
      responses:
        "200":
          description: The limit now in force and the applications the customer holds
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/OrganizationAppStackLimitDto"
        "400":
          description: Invalid limit (`VALIDATION_ERROR`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Customer not found (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/site-templates:
    get:
      tags: [Site Templates]
      operationId: adminListSiteTemplates
      summary: List the site templates, archived ones included, and the site types (modules) a template can be bound to (server administrator only)
      description: >-
        Each template carries its default version and the number of sites that run on it. `modules` lists the
        site types this release knows with the PHP versions each one supports.
      responses:
        "200":
          description: The templates and the modules
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AdminSiteTemplatesList"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Site Templates]
      operationId: adminCreateSiteTemplate
      summary: Create a site template with its first version (server administrator only; audited as admin.site_template.create)
      description: >-
        The source is a Compose-like YAML document checked by the policy engine for the chosen module. A
        source with problems is refused with `VALIDATION_ERROR` and up to 20 `details` (`field` is the path
        in the document or `source`, `reason` the problem code); use the validate route to see them with
        their line and column. The audit row never carries the source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteTemplateInput"
      responses:
        "201":
          description: The new template with its first version, which is the default
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AdminSiteTemplateDetail"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Another template already has this name (`ALREADY_EXISTS`, `details[0].reason: name_taken`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/site-templates/validate:
    post:
      tags: [Site Templates]
      operationId: adminValidateSiteTemplate
      summary: Check a template source without saving it (server administrator only)
      description: >-
        Always answers 200 for a well-formed request: `valid` says whether the source passes, `errors` lists
        the problems with their position, `parameters` the typed parameters it declares and `preview` the
        service it would deploy with every parameter at its default (`null` when the source is not valid).
        The preview is built from arrays only. Nothing is stored and nothing is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateSiteTemplateInput"
      responses:
        "200":
          description: The verdict
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteTemplateValidation"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/site-templates/{templateId}:
    get:
      tags: [Site Templates]
      operationId: adminGetSiteTemplate
      summary: Show a site template with its versions, newest first, without their sources (server administrator only)
      parameters:
        - $ref: "#/components/parameters/SiteTemplateIdParam"
      responses:
        "200":
          description: The template
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AdminSiteTemplateDetail"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    patch:
      tags: [Site Templates]
      operationId: adminUpdateSiteTemplate
      summary: Rename a site template, change its description, enable or disable it, or pick its default version (server administrator only; audited as admin.site_template.update)
      description: >-
        A disabled template is no longer offered to customers; sites already on it keep running. Enabling a
        template, or picking another default for an enabled one, checks the stored source of the default in effect
        against today's policy again, under the template lock (`VALIDATION_ERROR`, `details[0].field: enabled`,
        `details[0].reason: template_invalid`; nothing changes). A disabled template's default is checked when it is
        enabled. The default must be a version of this
        template (`details[0].reason: unknown_version`). At least one field is required.
      parameters:
        - $ref: "#/components/parameters/SiteTemplateIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteTemplateInput"
      responses:
        "200":
          description: The template as it is now
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AdminSiteTemplateDetail"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            The template is archived (`RESOURCE_LOCKED`, `details[0].reason: template_archived`) or another
            template already has this name (`ALREADY_EXISTS`, `details[0].reason: name_taken`)
          $ref: "#/components/responses/ErrorResponse"
    delete:
      tags: [Site Templates]
      operationId: adminArchiveSiteTemplate
      summary: Archive a site template (server administrator only; audited as admin.site_template.archive)
      description: >-
        Nothing is deleted: an archived template is no longer offered, cannot get new versions, and the sites
        that run on it keep their version. Archiving an archived template changes nothing and writes no
        second audit row. The built-in WordPress template cannot be archived
        (`RESOURCE_LOCKED`, `details[0].reason: built_in`).
      parameters:
        - $ref: "#/components/parameters/SiteTemplateIdParam"
      responses:
        "200":
          description: The archived template
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AdminSiteTemplateDetail"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            The built-in template cannot be archived (`RESOURCE_LOCKED`, `details[0].reason: built_in`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/site-templates/{templateId}/versions:
    post:
      tags: [Site Templates]
      operationId: adminAddSiteTemplateVersion
      summary: Add a version to a site template (server administrator only; audited as admin.site_template.version)
      description: >-
        Versions are immutable. A source identical to the latest version adds nothing (`created: false`).
        With `makeDefault` (the default) the new version becomes the one customers get. Sites already on the
        template keep their version until an administrator moves them. A source with problems is refused
        like on create. The audit row never carries the source.
      parameters:
        - $ref: "#/components/parameters/SiteTemplateIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSiteTemplateVersionInput"
      responses:
        "201":
          description: The version, with its source
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AdminSiteTemplateVersionCreated"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            The template is archived (`RESOURCE_LOCKED`, `details[0].reason: template_archived`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/site-templates/{templateId}/versions/{versionId}:
    get:
      tags: [Site Templates]
      operationId: adminGetSiteTemplateVersion
      summary: Show one version of a site template with its source (server administrator only)
      parameters:
        - $ref: "#/components/parameters/SiteTemplateIdParam"
        - $ref: "#/components/parameters/SiteTemplateVersionIdParam"
      responses:
        "200":
          description: The version
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AdminSiteTemplateVersion"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Unknown template, or a version that belongs to another template (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/sites/{siteId}/template-version:
    post:
      tags: [Admin Sites]
      operationId: adminChangeSiteTemplateVersion
      summary: Move a site to a newer version of its template (server administrator only; audited as admin.site.template_version)
      description: >-
        Redeploys the site with the new version's configuration; the stored parameter values are kept when
        the new version still accepts them, except that an admin-only parameter (`customer: false`) whose
        stored value equals the old version's default takes the new version's default. Only a newer version of the same template is accepted, and the
        site must not be stopped. Refusals are `VALIDATION_ERROR` with
        `details[0].reason` `stopped`, `other_template`, `already_current`, `not_newer`, or
        `parameters.<key>` (a stored value the new version refuses, or a new parameter without a default);
        nothing changes then. An unknown version is `NOT_FOUND` (`unknown_version`). The audit row is
        written with the operation and only when the operation is new.
      parameters:
        - $ref: "#/components/parameters/SiteIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeSiteTemplateVersionInput"
      responses:
        "202":
          description: Accepted; follow the returned operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedSiteAccepted"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            The target template is archived (`RESOURCE_LOCKED`, `details[0].reason: template_archived`), the
            stored source no longer passes today's policy (`details[0].reason: template_invalid`), or another
            operation holds the site
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/site-types:
    get:
      tags: [Site Templates]
      operationId: listCustomerSiteTypes
      summary: List the site types the customer can pick when creating a site (site.create)
      description: >-
        Enabled, not archived templates at their default version, the built-in WordPress first, then by name.
        The list is the same for every organization. It never carries the source, the image, the environment
        or the limits; only the PHP versions and the parameters the customer may set. A site type is chosen at
        creation with `templateId` and `parameters`.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
      responses:
        "200":
          description: The site types on offer
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CustomerSiteTypes"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/app-templates:
    get:
      tags: [App Templates]
      operationId: adminListAppTemplates
      summary: List the application templates, drafts and archived ones included (server administrator only)
      description: >-
        Each template carries its state, its default version, the applications installed from it and the figures of
        its default version. An unknown query parameter is refused (`VALIDATION_ERROR`). Returns 422 NOT_SUPPORTED
        (reason STACK_UNSUPPORTED_FEATURE) while the capability flag `applicationTemplatesAvailable` is false.
      parameters:
        - in: query
          name: state
          schema:
            $ref: "#/components/schemas/AppTemplateState"
        - in: query
          name: category
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{0,31}$"
        - $ref: "#/components/parameters/CursorQuery"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: Paginated application templates
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminAppTemplateSummaryDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: "Application templates are not available yet (`NOT_SUPPORTED`, `details[0].reason: STACK_UNSUPPORTED_FEATURE`)"
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [App Templates]
      operationId: adminCreateAppTemplate
      summary: Create an application template with its first version, as a draft (server administrator only; audited as admin.app_template.create)
      description: >-
        The source is an `HCP-STACK/v1` or `HCP-STACK/v2` document; its `x-hp-stack` header gives the name, the description and the
        category, which PATCH may change later. A source with problems is refused with `VALIDATION_ERROR`
        ("The template is not valid.") and up to 20 `details` (`field` is the path in the document or `source`,
        `reason` the problem's reason, `message` its line and column). The audit row never carries the source.
        Returns 422 NOT_SUPPORTED (reason STACK_UNSUPPORTED_FEATURE) while the capability flag
        `applicationTemplatesAvailable` is false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppTemplateInput"
      responses:
        "201":
          description: The new template with its first version, which is the default
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AdminAppTemplateDetailDto"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: "Another template already has this slug (`ALREADY_EXISTS`, `details[0].reason: slug_taken`)"
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: "Application templates are not available yet (`NOT_SUPPORTED`, `details[0].reason: STACK_UNSUPPORTED_FEATURE`)"
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/app-templates/validate:
    post:
      tags: [App Templates]
      operationId: adminValidateAppTemplate
      summary: Check an application template source without saving it (server administrator only)
      description: >-
        Always answers 200 for a well-formed request: `valid` says whether the source passes, `issues` lists the
        problems with their position, `parameters` the typed parameters it declares and `preview` what it would
        deploy with every parameter at its default (`null` when the source is not valid). Nothing is stored and
        nothing is audited. Returns 422 NOT_SUPPORTED (reason STACK_UNSUPPORTED_FEATURE) while the capability flag
        `applicationTemplatesAvailable` is false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateAppTemplateInput"
      responses:
        "200":
          description: The verdict
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AppTemplateValidationDto"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: "Application templates are not available yet (`NOT_SUPPORTED`, `details[0].reason: STACK_UNSUPPORTED_FEATURE`)"
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/app-templates/import-compose:
    post:
      tags: [App Templates]
      operationId: adminImportComposeAppTemplate
      summary: Read a Docker Compose file into a draft application template without saving it (server administrator only)
      description: >-
        Always answers 200 for a well-formed request. `report` says what the importer did with each part of the file:
        kept with a remark (`info`), `changed`, `dropped` or `refused`. With no refusal, `source` is a draft
        `HCP-STACK/v2` document and `validation` is the verdict `POST /v1/admin/app-templates/validate` gives for it;
        with one, both are `null`. The administrator reviews the draft and saves it with
        `POST /v1/admin/app-templates`, which validates again. Every image is pinned by digest: for an image the file
        names by tag, the server asks its registry for the digest (a read-only lookup, up to 8 images, which can
        take some tens of seconds); an image the registry does not know is refused in the report by name. Passwords and
        keys written in the file become secrets the platform generates at installation, and are never returned.
        Nothing is stored and nothing is audited. Returns 422 NOT_SUPPORTED (reason STACK_UNSUPPORTED_FEATURE) while
        the capability flag `applicationTemplatesAvailable` is false, or when the file names an image without a digest
        on a server that cannot run applications.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportComposeInput"
      responses:
        "200":
          description: The draft, when there is one, and the report
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ComposeImportDto"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: "Application templates are not available (`NOT_SUPPORTED`, `details[0].reason: STACK_UNSUPPORTED_FEATURE`)"
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: >-
            The images could not be looked up right now (`DOCKER_ENGINE_UNAVAILABLE`, retryable,
            "The server could not look up the images of the file right now. Try again in a few minutes.")
          $ref: "#/components/responses/ErrorResponse"

