          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminFleetItemDto"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
