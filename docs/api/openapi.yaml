      required: [hostname]
      properties:
        hostname:
          type: string
        includeWww:
          type: boolean
          default: false
        tlsVersionId:
          type: string
          pattern: "^ctv_[0-9a-f]{32}$"
          description: >-
            Create the domain directly on this imported certificate version of the same organization (a new
            address under a wildcard that is already loaded). The domain and a `site.tls.apply` operation are
            created together; the request then needs an `Idempotency-Key` header. Every new name (including the
            `www` pair) must be covered by the version.

    CertificateAlertDto:
      type: object
      required: [kind, siteId, siteName, hostname, expiresAt, problem]
      properties:
        kind:
          type: string
          enum: [expiring, not_issued, panel_expiring]
        siteId:
          type: string
          nullable: true
        siteName:
          type: string
          nullable: true
        hostname:
          type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
        problem:
          type: string
          enum: [rate_limited, port_80_blocked, not_pointing, caa_blocked, dns_provider, other]
          nullable: true

    SiteDomainDto:
      type: object
      required: [id, hostname, isPrimary, routed, challenge, dns, certificate, tls]
      properties:
        id:
          type: string
        hostname:
          type: string
        isPrimary:
          type: boolean
        routed:
          type: boolean
        challenge:
          type: string
          enum: [http-01, dns-01]
        dns:
          type: object
          required: [status, checkedAt, nextCheckAt, observedA, observedAaaa]
          properties:
            status:
              type: string
              enum: [unchecked, ok, not_found, points_elsewhere, ipv6_conflict, lookup_failed]
            checkedAt:
              type: string
              format: date-time
              nullable: true
            nextCheckAt:
              type: string
              format: date-time
            observedA:
              type: array
              items:
                type: string
            observedAaaa:
              type: array
              items:
                type: string
        certificate:
          type: object
          required: [status, problem, expiresAt, retryAt, trusted]
          properties:
            status:
              type: string
              enum: [none, requested, active, failed]
            problem:
              type: string
              enum: [rate_limited, port_80_blocked, not_pointing, caa_blocked, dns_provider, other]
              nullable: true
            expiresAt:
              type: string
              format: date-time
              nullable: true
            retryAt:
              type: string
              format: date-time
              nullable: true
            trusted:
              type: boolean
        tls:
          $ref: "#/components/schemas/SiteDomainTlsDto"

    SiteDomainTlsDto:
      type: object
      required: [mode, certificateId, versionId, state, problem]
      properties:
        mode:
          type: string
          enum: [acme, manual]
          description: "`acme` is the automatic Let's Encrypt certificate; `manual` is an imported one"
        certificateId:
          type: string
          nullable: true
          description: The imported certificate; null in `acme` mode
        versionId:
          type: string
          nullable: true
          description: >-
            The certificate version assigned to the domain; null in `acme` mode. While `state` is `applying`
            this is the version being applied, not yet the one served.
        state:
          type: string
          enum: [applying, active, failed]
          nullable: true
          description: Whether the imported certificate is being put in place, is served, or could not be applied; null in `acme` mode
        problem:
          type: string
          enum: [apply_failed, sni_mismatch, interrupted, acme_eviction_required, manual_overlap, captures_host]
          nullable: true
          description: >-
            The `last_error_code` of the assigned version, in any state (for example an `active` domain can show
            a problem that was recorded on the version); null when the version has none. It belongs to the version,
            so every domain using that version shows the same value; null in `acme` mode

    ImportTlsCertificateRequest:
      type: object
      additionalProperties: false
      required: [name, format, leafPem, privateKeyPem]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        format:
          type: string
          enum: [pem]
        leafPem:
          writeOnly: true
          type: string
          maxLength: 524288
          description: Exactly one `CERTIFICATE` block
        chainPem:
          writeOnly: true
          type: string
          maxLength: 524288
          default: ""
          description: Up to 20 intermediate `CERTIFICATE` blocks; may be empty when the leaf chains to a trusted root directly
        privateKeyPem:
          writeOnly: true
          type: string
          maxLength: 524288
          description: One unencrypted `PRIVATE KEY`, `RSA PRIVATE KEY` or `EC PRIVATE KEY` block. Never returned by any route
      description: >-
        The three PEM texts together may not exceed 512 KiB (UTF-8), the whole body 1 MiB
        (`CERTIFICATE_UPLOAD_TOO_LARGE`, 413).

    CreateTlsCertificateVersionRequest:
      type: object
      additionalProperties: false
      required: [format, leafPem, privateKeyPem]
      properties:
        format:
          type: string
          enum: [pem]
        leafPem:
          writeOnly: true
          type: string
          maxLength: 524288
        chainPem:
          writeOnly: true
          type: string
          maxLength: 524288
          default: ""
        privateKeyPem:
          writeOnly: true
          type: string
          maxLength: 524288

    SetDomainTlsRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode:
              type: string
              enum: [acme]
        - type: object
          additionalProperties: false
          required: [mode, versionId]
          properties:
            mode:
              type: string
              enum: [manual]
            versionId:
              type: string
              pattern: "^ctv_[0-9a-f]{32}$"

    AdminSetDomainTlsRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode:
              type: string
              enum: [acme]
            challenge:
              type: string
              enum: [http-01, dns-01]
              description: How the automatic certificate is obtained once the domain returns to ACME
        - type: object
          additionalProperties: false
          required: [mode, versionId]
          properties:
            mode:
              type: string
              enum: [manual]
            versionId:
              type: string
              pattern: "^ctv_[0-9a-f]{32}$"
            evictAcme:
              type: boolean
              enum: [true]
              description: >-
                Allow the cold removal of a Let's Encrypt entry that ties with this certificate (the proxy is
                stopped for a moment, `acme.json` is backed up). Goes with `confirmHostname`; at most one run per
                15 minutes per server
            confirmHostname:
              type: string
              description: The exact hostname of the domain, typed by the administrator

    ActivateTlsVersionRequest:
      type: object
      additionalProperties: false
      properties:
        domainIds:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: string
          description: The domains to set, of any site of the organization; absent = every domain of the organization on another version of this certificate

    TlsMovedDomain:
      type: object
      required: [domainId, siteId, hostname]
      properties:
        domainId:
          type: string
        siteId:
          type: string
        hostname:
          type: string

    AdminActivateTlsVersionRequest:
      type: object
      additionalProperties: false
      properties:
        domainIds:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: string
          description: The domains to set, of any site of the organization; absent = every domain of the organization on another version of this certificate
        evictAcme:
          type: boolean
          enum: [true]
        confirmHostname:
          type: string

    TlsCertificateVersionDto:
      type: object
      required: [id, versionNumber, status, subject, issuer, sanDns, wildcard, notBefore, notAfter, serialNumber, fingerprintSha256, keyType, keyBits, createdAt, activatedAt, problem]
      properties:
        id:
          type: string
        versionNumber:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [pending, applying, active, inactive, failed]
        subject:
          type: string
        issuer:
          type: string
        sanDns:
          type: array
          items:
            type: string
        wildcard:
          type: boolean
        notBefore:
          type: string
          format: date-time
        notAfter:
          type: string
          format: date-time
        serialNumber:
          type: string
        fingerprintSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        keyType:
          type: string
          enum: [rsa, ec]
        keyBits:
          type: integer
        createdAt:
          type: string
          format: date-time
        activatedAt:
          type: string
          format: date-time
          nullable: true
        problem:
          type: string
          enum: [apply_failed, sni_mismatch, interrupted, acme_eviction_required, manual_overlap, captures_host]
          nullable: true
          description: >-
            The last apply problem recorded on this version: `apply_failed` (the proxy did not serve it),
            `sni_mismatch` (it serves another certificate for the name), `interrupted` (the apply did not finish),
            `acme_eviction_required` (a Let's Encrypt entry ties with the imported certificate; an administrator can
            confirm `evictAcme`), `manual_overlap` (another imported certificate ties), `captures_host` (a wildcard
            would capture a name of another tenant)

    TlsCertificateDto:
      type: object
      required: [id, name, source, createdForSiteId, activeVersionId, versions, coveredDomains, assignedDomains, expiry, warnings, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        source:
          type: string
          enum: [manual]
        createdForSiteId:
          type: string
          nullable: true
        activeVersionId:
          type: string
          nullable: true
        versions:
          type: array
          description: Oldest first. Never carries the certificate text or the key
          items:
            $ref: "#/components/schemas/TlsCertificateVersionDto"
        coveredDomains:
          type: array
          description: Domains of the organization whose hostname some version of this certificate covers
          items:
            type: object
            required: [domainId, hostname, assigned, versionId]
            properties:
              domainId:
                type: string
              hostname:
                type: string
              assigned:
                type: boolean
              versionId:
                type: string
                nullable: true
        assignedDomains:
          type: array
          description: Domains (any site of the organization) that serve a version of this certificate
          items:
            type: object
            required: [domainId, siteId, siteName, hostname, versionId]
            properties:
              domainId:
                type: string
              siteId:
                type: string
              siteName:
                type: string
              hostname:
                type: string
              versionId:
                type: string
        expiry:
          type: object
          nullable: true
          required: [tier, daysLeft]
          properties:
            tier:
              type: string
              enum: [ok, notice, warning, critical, expired]
            daysLeft:
              type: integer
        warnings:
          type: array
          items:
            type: string
            enum: [expiring, expired, covers_unassigned_domains]
        updatedAt:
          type: string
          format: date-time

    AdminTlsInventoryItemDto:
      type: object
      required: [source, certificateId, name, organizationId, organizationName, siteId, siteName, hostnames, issuer, wildcard, notAfter, status, tier]
      properties:
        source:
          type: string
          enum: [manual, acme]
        certificateId:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        organizationId:
          type: string
        organizationName:
          type: string
        siteId:
          type: string
          nullable: true
        siteName:
          type: string
          nullable: true
        hostnames:
          type: array
          items:
            type: string
        issuer:
          type: string
          nullable: true
        wildcard:
          type: boolean
        notAfter:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [pending, applying, active, inactive, failed, none, requested]
        tier:
          type: string
          nullable: true
          enum: [ok, notice, warning, critical, expired]

    TlsCertificateAlertDto:
      type: object
      required: [certificateId, certificateName, versionId, organizationId, siteId, siteName, hostnames, notAfter, tier, daysLeft]
      properties:
        certificateId:
          type: string
        certificateName:
          type: string
        versionId:
          type: string
        organizationId:
          type: string
        siteId:
          type: string
          nullable: true
        siteName:
          type: string
          nullable: true
        hostnames:
          type: array
          items:
            type: string
        notAfter:
          type: string
          format: date-time
        tier:
          type: string
          enum: [warning, critical, expired]
        daysLeft:
          type: integer

    MailRelaySettingsInput:
      type: object
      required: [host, port, username, senderDomain]
      properties:
        host:
          type: string
          description: Provider hostname (an IP address is refused; TLS is verified)
        port:
          type: integer
          enum: [25, 465, 587, 2525]
        username:
          type: string
          maxLength: 256
        password:
          type: string
          minLength: 1
          maxLength: 256
          description: Write-only; omit to keep the stored password
        senderDomain:
          type: string

    MailFailureDto:
      type: object
      required: [at, recipient, status, problem, detail]
      properties:
        at:
          type: string
          format: date-time
        recipient:
          type: string
        status:
          type: string
          enum: [deferred, bounced]
        problem:
          type: string
          enum: [auth_failed, unreachable, tls_failed, rejected, credentials_missing, other]
        detail:
          type: string

    MailRelaySettingsDto:
      type: object
      required: [configured, host, port, username, senderDomain, passwordSet, updatedAt, applied, relayRunning, sentLast24h, failures]
      properties:
        configured:
          type: boolean
        host:
          type: string
          nullable: true
        port:
          type: integer
          nullable: true
        username:
          type: string
          nullable: true
        senderDomain:
          type: string
          nullable: true
        passwordSet:
          type: boolean
        updatedAt:
          type: string
          nullable: true
        applied:
          type: boolean
        relayRunning:
          type: boolean
          nullable: true
        sentLast24h:
          type: integer
          nullable: true
        failures:
          type: array
          items:
            $ref: "#/components/schemas/MailFailureDto"

    DnsProviderSettingsInput:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [cloudflare, digitalocean, gandiv5, hetzner, httpreq, ionos, ovh]
        credentials:
          type: object
          additionalProperties:
            type: string
          description: Write-only. Keys are the lego variable names of the provider (e.g. CLOUDFLARE_DNS_API_TOKEN)

    DnsProviderSettingsDto:
      type: object
      required: [provider, fieldsSet, updatedAt, applied, ready]
      properties:
        provider:
          type: string
          enum: [cloudflare, digitalocean, gandiv5, hetzner, httpreq, ionos, ovh]
          nullable: true
        fieldsSet:
          type: array
          description: Names of the stored fields, never their values
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
          nullable: true
        applied:
          type: boolean
        ready:
          type: boolean
          nullable: true
          description: The proxy has the le-dns resolver; false without an ACME email; null when the executor does not answer

    SiteDomainChallengeInput:
      type: object
      required: [challenge]
      properties:
        challenge:
          type: string
          enum: [http-01, dns-01]

    MailTestResult:
      type: object
      required: [outcome, problem, detail]
      properties:
        outcome:
          type: string
          enum: [sent, deferred, bounced, pending]
        problem:
          type: string
          enum: [auth_failed, unreachable, tls_failed, rejected, credentials_missing, other]
          nullable: true
        detail:
          type: string
          nullable: true

    BackupProblem:
      type: string
      enum:
        - unreachable
        - tls_failed
        - wrong_region
        - auth_failed
        - bucket_missing
        - write_denied
        - wrong_key
        - key_file_missing
        - tool_unavailable
        - no_space
        - database_dump_failed
        - files_unreadable
        - repository_locked
        - timeout
        - interrupted
        - other
        - restore_prepare_failed
        - switch_undone
        - undo_incomplete
        - definer_missing
        - panel_dump_missing
        - site_busy
        - address_not_updated
        - panel_dump_failed
        - panel_dump_tool_missing
        - site_not_started
        - invalid_recipient
        - local_target_unmounted
        - local_target_readonly
        - local_target_unsafe
        - backup_copy_missing

    BackupSettingsInput:
      type: object
      additionalProperties: false
      required: [endpoint, region, bucket, accessKeyId]
      properties:
        endpoint:
          type: string
          pattern: "^https?:\\/\\/[A-Za-z0-9.-]+(:\\d{1,5})?$"
        region:
          type: string
          pattern: "^[a-z0-9-]{1,64}$"
        bucket:
          type: string
          pattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
        prefix:
          type: string
          default: ""
          pattern: "^$|^[A-Za-z0-9_-][A-Za-z0-9._-]{0,63}(\\/[A-Za-z0-9_-][A-Za-z0-9._-]{0,63}){0,7}$"
        accessKeyId:
          type: string
          minLength: 1
          maxLength: 256
        secretAccessKey:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: Write-only S3 secret access key (required on initial setup; omit to keep stored secret)
        scheduleHourUtc:
          type: integer
          minimum: 0
          maximum: 23
          default: 2
        retentionDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 14

    BackupTestResult:
      type: object
      required: [outcome, problem]
      properties:
        outcome:
          type: string
          enum: [ok, failed]
        problem:
          $ref: "#/components/schemas/BackupProblem"
          nullable: true

    BackupSettings:
      type: object
      required:
        - available
        - configured
        - endpoint
        - region
        - bucket
        - prefix
        - accessKeyId
        - secretAccessKeySet
        - scheduleHourUtc
        - retentionDays
        - lastNightlyRunOn
        - lastTest
        - lastPanelBackup
        - newestBackupsTotalBytes
        - updatedAt
      properties:
        available:
          type: boolean
        configured:
          type: boolean
        endpoint:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        bucket:
          type: string
          nullable: true
        prefix:
          type: string
        accessKeyId:
          type: string
          nullable: true
        secretAccessKeySet:
          type: boolean
        scheduleHourUtc:
          type: integer
        retentionDays:
          type: integer
        lastNightlyRunOn:
          type: string
          format: date
          nullable: true
        lastTest:
          type: object
          nullable: true
          required: [outcome, problem, at]
          properties:
            outcome:
              type: string
              enum: [ok, failed]
            problem:
              $ref: "#/components/schemas/BackupProblem"
              nullable: true
            at:
              type: string
              format: date-time
        lastPanelBackup:
          $ref: "#/components/schemas/PanelBackupLine"
          nullable: true
        newestBackupsTotalBytes:
          type: integer
          minimum: 0
          description: Sum of the sizes of each site's newest succeeded copy
        updatedAt:
          type: string
          format: date-time
          nullable: true

    PanelBackupLine:
      type: object
      additionalProperties: false
      required: [at, status, problem]
      properties:
        at:
          type: string
          format: date-time
        status:
          type: string
          enum: [succeeded, failed]
        problem:
          $ref: "#/components/schemas/BackupProblem"
          nullable: true

    RestoreBackupInput:
      type: object
      additionalProperties: false
      required: [confirmName]
      properties:
        confirmName:
          type: string
          maxLength: 255
        targetId:
          $ref: "#/components/schemas/BackupTargetId"
          description: The destination to restore from; it must hold a succeeded copy of the backup (default is the best available copy)

    AdminRestoreBackupInput:
      type: object
      additionalProperties: false
      required: [confirmName]
      properties:
        backupId:
          type: string
          pattern: "^bkp_[0-9a-f]{32}$"
          description: The copy to put back; when absent, the newest succeeded copy of the site
        confirmName:
          type: string
          maxLength: 255
        targetId:
          $ref: "#/components/schemas/BackupTargetId"
          description: The destination to restore from; it must hold a succeeded copy of the backup (default is the best available copy)

    BackupTargetId:
      type: string
      pattern: "^bkt_[0-9a-f]{32}$"
      description: Identifier of a backup destination

    BackupTargetKind:
      type: string
      enum: [s3, local]

    BackupCopyStatus:
      type: string
      enum: [running, succeeded, failed, missing, unknown]

    CreateBackupTargetInput:
      description: >-
        An S3-compatible destination (location, access key and write-only secret) or the local destination.
        A local destination has no path: the root is fixed by the server configuration.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, name, endpoint, region, bucket, accessKeyId, secretAccessKey]
          properties:
            kind:
              type: string
              const: s3
            name:
              type: string
              minLength: 1
              maxLength: 128
            enabled:
              type: boolean
              default: true
            customerSelectable:
              type: boolean
              default: false
            endpoint:
              type: string
              pattern: "^https?:\\/\\/[A-Za-z0-9.-]+(:\\d{1,5})?$"
            region:
              type: string
              pattern: "^[a-z0-9-]{1,64}$"
            bucket:
              type: string
              pattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
            prefix:
              type: string
              default: ""
            accessKeyId:
              type: string
              minLength: 1
              maxLength: 256
            secretAccessKey:
              type: string
              minLength: 1
              maxLength: 256
              writeOnly: true
        - type: object
          additionalProperties: false
          required: [kind, name]
          properties:
            kind:
              type: string
              const: local
            name:
              type: string
              minLength: 1
              maxLength: 128
            enabled:
              type: boolean
              default: true
            customerSelectable:
              type: boolean
              default: false

    UpdateBackupTargetInput:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        At least one property. The legacy destination accepts only `name`, `enabled`, `customerSelectable` and
        `archived`; a local destination never takes a location. Changing `endpoint`, `bucket` or `prefix` of an S3
        destination creates a new destination and archives this one.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
        customerSelectable:
          type: boolean
        retentionDays:
          type: integer
          minimum: 1
          maximum: 365
          nullable: true
          description: "`null` inherits the policy retention"
        archived:
          type: boolean
          const: true
        endpoint:
          type: string
        region:
          type: string
        bucket:
          type: string
        prefix:
          type: string
        accessKeyId:
          type: string
        secretAccessKey:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true

    AdminBackupTarget:
      type: object
      required: [id, kind, name, enabled, customerSelectable, legacy, archivedAt, retentionDays, s3, local, lastTest, usage, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/BackupTargetId"
        kind:
          $ref: "#/components/schemas/BackupTargetKind"
        name:
          type: string
        enabled:
          type: boolean
        customerSelectable:
          type: boolean
        legacy:
          type: boolean
          description: The destination created from the pre-multi-target settings; its location cannot change
        archivedAt:
          type: string
          format: date-time
          nullable: true
        retentionDays:
          type: integer
          nullable: true
        s3:
          type: object
          nullable: true
          required: [endpoint, region, bucket, prefix, accessKeyId, secretAccessKeySet]
          properties:
            endpoint:
              type: string
            region:
              type: string
            bucket:
              type: string
            prefix:
              type: string
            accessKeyId:
              type: string
            secretAccessKeySet:
              type: boolean
              const: true
        local:
          type: object
          nullable: true
          required: [root, initializedAt]
          properties:
            root:
              type: string
              nullable: true
            initializedAt:
              type: string
              format: date-time
              nullable: true
        lastTest:
          type: object
          nullable: true
          required: [at, outcome, problem, availableBytes, totalBytes]
          properties:
            at:
              type: string
              format: date-time
            outcome:
              type: string
              enum: [ok, failed]
            problem:
              $ref: "#/components/schemas/BackupProblem"
              nullable: true
            availableBytes:
              type: integer
              minimum: 0
              nullable: true
            totalBytes:
              type: integer
              minimum: 0
              nullable: true
        usage:
          type: object
          required: [policies, copies]
          properties:
            policies:
              type: array
              items:
                type: string
                enum: [default_site, site, panel]
            copies:
              type: integer
              minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BackupTargets:
      type: object
      required: [targets, localRootConfigured]
      properties:
        targets:
          type: array
          items:
            $ref: "#/components/schemas/AdminBackupTarget"
        localRootConfigured:
          type: boolean
          description: False when this install cannot offer a local destination

    BackupTargetTestResult:
      allOf:
        - $ref: "#/components/schemas/BackupTestResult"
        - type: object
          properties:
            availableBytes:
              type: integer
              minimum: 0
            totalBytes:
              type: integer
              minimum: 0

    BackupPolicyTarget:
      type: object
      required: [targetId, kind, priority, required]
      properties:
        targetId:
          $ref: "#/components/schemas/BackupTargetId"
        kind:
          $ref: "#/components/schemas/BackupTargetKind"
        priority:
          type: integer
          enum: [1, 2]
        required:
          type: boolean

    BackupPolicy:
      type: object
      required: [scope, siteId, scheduleHourUtc, retentionDays, targets, updatedAt]
      properties:
        scope:
          type: string
          enum: [default_site, panel]
        siteId:
          type: string
          nullable: true
          description: Always `null` here; per-site choices are in `SiteBackupPolicy`
        scheduleHourUtc:
          type: integer
          minimum: 0
          maximum: 23
          nullable: true
          description: "`null` for the panel policy, which has no schedule of its own"
        retentionDays:
          type: integer
          minimum: 1
          maximum: 365
        targets:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/BackupPolicyTarget"
        updatedAt:
          type: string
          format: date-time

    UpdateBackupPolicyInput:
      type: object
      additionalProperties: false
      description: Every property is optional; `scheduleHourUtc` is refused on the panel policy
      properties:
        scheduleHourUtc:
          type: integer
          minimum: 0
          maximum: 23
        retentionDays:
          type: integer
          minimum: 1
          maximum: 365
        targetIds:
          type: array
          maxItems: 2
          uniqueItems: true
          description: >-
            Enabled, not archived destinations; the order is the priority. With two, every backup
            is written to both, one after the other (priority 1 first), and its status is the
            aggregate: `succeeded` when both copies succeed, `partial` when one fails, `failed` when
            both fail. A `pre_update` backup counts as done only when every required copy succeeded
          items:
            $ref: "#/components/schemas/BackupTargetId"

    SetSiteBackupPolicyInput:
      type: object
      additionalProperties: false
      required: [targetIds]
      properties:
        targetIds:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          nullable: true
          description: Destinations the customer may choose; `null` inherits the default policy
          items:
            $ref: "#/components/schemas/BackupTargetId"

    BackupTargetChoice:
      type: object
      required: [id, kind]
      properties:
        id:
          $ref: "#/components/schemas/BackupTargetId"
        kind:
          $ref: "#/components/schemas/BackupTargetKind"

    SiteBackupPolicy:
      type: object
      required: [targetIds, inherited, choices]
      properties:
        targetIds:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/BackupTargetId"
        inherited:
          type: boolean
        choices:
          type: array
          items:
            $ref: "#/components/schemas/BackupTargetChoice"

    SiteBackupCopy:
      type: object
      required: [targetId, kind, status, sizeBytes, problem, startedAt, finishedAt]
      properties:
        targetId:
          $ref: "#/components/schemas/BackupTargetId"
        kind:
          $ref: "#/components/schemas/BackupTargetKind"
        status:
          $ref: "#/components/schemas/BackupCopyStatus"
        sizeBytes:
          type: integer
          minimum: 0
          nullable: true
        problem:
          $ref: "#/components/schemas/BackupProblem"
          nullable: true
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true

    CreateSiteBackupInput:
      type: object
      additionalProperties: false
      properties:
        targetId:
          $ref: "#/components/schemas/BackupTargetId"
          description: The destination to use instead of the site's own; the customer may name only a destination offered in `targets` of the backup list

    PrepareDownloadInput:
      type: object
      additionalProperties: false
      properties:
        targetId:
          $ref: "#/components/schemas/BackupTargetId"
          description: The destination to read from; it must hold a succeeded copy of the backup
        format:
          type: string
          enum: [zip, zip.age]
          default: zip
          description: >-
            `zip` (the default) is the decrypted single-zip archive. `zip.age` is the archive
            encrypted to `recipient`; it is refused with 422 `NOT_SUPPORTED` while
            `encryptedBackupExportAvailable` is false (always, in this release)
        recipient:
          type: string
          pattern: "^age1[02-9ac-hj-np-z]{58}$"
          description: >-
            age public key (X25519) to encrypt to. Required with `zip.age`, refused with `zip`.
            A public key, but still never stored, logged, audited or put in a URL: it travels only
            in this body

    BackupArchive:
      type: object
      required: [status, readyUntil, problem]
      properties:
        status:
          type: string
          enum: [preparing, ready, failed]
        readyUntil:
          type: string
          format: date-time
          nullable: true
        problem:
          $ref: "#/components/schemas/BackupProblem"
          nullable: true

    BackupLastRestore:
      type: object
      required: [backupId, backupStartedAt, status, finishedAt, problem]
      properties:
        backupId:
          type: string
        backupStartedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [running, succeeded, failed]
        finishedAt:
          type: string
          format: date-time
          nullable: true
        problem:
          $ref: "#/components/schemas/BackupProblem"
          nullable: true

    SiteBackup:
      type: object
      required: [id, kind, status, startedAt, finishedAt, sizeBytes, problem, archive, copies]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [nightly, manual, pre_update]
        status:
          type: string
          enum: [running, succeeded, failed, partial]
          description: >-
            The aggregate of its copies. `partial` means at least one copy succeeded and at least
            one failed (only with two destinations); the backup stays restorable and downloadable
            from the copies that succeeded, and `copies` says which one failed
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        sizeBytes:
          type: integer
          nullable: true
        problem:
          $ref: "#/components/schemas/BackupProblem"
          nullable: true
        archive:
          $ref: "#/components/schemas/BackupArchive"
          nullable: true
        copies:
          type: array
          description: One entry per destination the backup was written to (empty for a row from before destinations existed)
          items:
            $ref: "#/components/schemas/SiteBackupCopy"

    SiteBackups:
      type: object
      required: [available, configured, retentionDays, manualKept, runningOperationId, lastRestore, backups, targets]
      properties:
        available:
          type: boolean
        configured:
          type: boolean
        retentionDays:
          type: integer
        manualKept:
          type: integer
          const: 3
        runningOperationId:
          type: string
          nullable: true
        lastRestore:
          $ref: "#/components/schemas/BackupLastRestore"
          nullable: true
        backups:
          type: array
          items:
            $ref: "#/components/schemas/SiteBackup"
        targets:
          type: array
          description: The destinations this customer may name as `targetId` (id and kind only)
          items:
            $ref: "#/components/schemas/BackupTargetChoice"

    BackupArchiveChunk:
      type: object
      additionalProperties: false
      required: [dataBase64, size, eof, fileName]
      properties:
        dataBase64:
          type: string
        size:
          type: integer
          minimum: 0
        eof:
          type: boolean
        fileName:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,120}\\.zip$"

    AdminSiteBackupStatus:
      type: object
      required:
        - siteId
        - siteName
        - organizationId
        - organizationName
        - lastSuccessAt
        - lastAttemptAt
        - lastStatus
        - problem
        - runningOperationId
        - lastSuccessBackupId
        - lastSuccessSizeBytes
        - lastRestore
      properties:
        siteId:
          type: string
        siteName:
          type: string
        organizationId:
          type: string
        organizationName:
          type: string
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        lastStatus:
          type: string
          enum: [running, succeeded, failed, partial]
          nullable: true
          description: "`partial`: one of the two copies of the last attempt failed and the other succeeded"
        problem:
          $ref: "#/components/schemas/BackupProblem"
          nullable: true
        runningOperationId:
          type: string
          nullable: true
        lastSuccessBackupId:
          type: string
          nullable: true
        lastSuccessSizeBytes:
          type: integer
          minimum: 0
          nullable: true
        lastRestore:
          $ref: "#/components/schemas/BackupLastRestore"
          nullable: true

    SiteWordpressPlugin:
      type: object
      additionalProperties: false
      required: [name, title, status, version, updateVersion]
      properties:
        name:
          type: string
        title:
          type: string
        status:
          type: string
          description: Plugins use active, inactive, active-network, must-use, dropin; themes use active, inactive, parent
          enum: [active, inactive, active-network, must-use, dropin, parent]
        version:
          type: string
          nullable: true
        updateVersion:
          type: string
          nullable: true

    SiteWordpressStateDto:
      type: object
      additionalProperties: false
      required: [checkedAt, coreVersion, coreUpdate, updatesKnown, plugins, themes, administrators, problem]
      properties:
        checkedAt:
          type: string
          format: date-time
        coreVersion:
          type: string
          nullable: true
          description: null only when the check stored a problem
        coreUpdate:
          type: string
          nullable: true
        updatesKnown:
          type: boolean
        plugins:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/SiteWordpressPlugin"
        themes:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/SiteWordpressPlugin"
        administrators:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [id, login]
            properties:
              id:
                type: integer
                minimum: 1
              login:
                type: string
        problem:
          $ref: "#/components/schemas/SiteWordpressProblem"
          nullable: true

    SiteWordpressProblem:
      type: string
      enum:
        - wordpress_org_unreachable
        - config_broken
        - database_unreachable
        - not_installed
        - backup_failed
        - items_failed
        - item_unknown
        - outcome_unknown
        - interrupted

    SiteWordpressUpdateRequest:
      type: object
      additionalProperties: false
      required: [scope]
      description: "`name` is required for `plugin` and `theme` and forbidden otherwise."
      properties:
        scope:
          type: string
          enum: [all, core, plugin, theme]
        name:
          type: string
          pattern: "^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}$"

    SiteWordpressLastUpdateDto:
      type: object
      additionalProperties: false
      required: [operationId, target, status, finishedAt, problem, backup, items]
      properties:
        operationId:
          type: string
        target:
          $ref: "#/components/schemas/SiteWordpressUpdateRequest"
        status:
          type: string
          enum: [succeeded, failed]
        finishedAt:
          type: string
          format: date-time
        problem:
          $ref: "#/components/schemas/SiteWordpressProblem"
          nullable: true
        backup:
          type: string
          enum: [taken, skipped, failed]
        items:
          type: array
          maxItems: 701
          items:
            type: object
            additionalProperties: false
            required: [type, name, oldVersion, newVersion, status]
            properties:
              type:
                type: string
                enum: [core, plugin, theme]
              name:
                type: string
              oldVersion:
                type: string
                nullable: true
              newVersion:
                type: string
                nullable: true
              status:
                type: string
                enum: [updated, failed]

    SiteWordpressDto:
      type: object
      additionalProperties: false
      required: [backupsConfigured, state, runningOperation, lastUpdate]
      properties:
        backupsConfigured:
          type: boolean
        state:
          $ref: "#/components/schemas/SiteWordpressStateDto"
          nullable: true
        runningOperation:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, kind, status, steps]
          properties:
            id:
              type: string
            kind:
              type: string
              enum: [site.wordpress.inspect, site.wordpress.update]
            status:
              type: string
            steps:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [key, status]
                properties:
                  key:
                    type: string
                    enum: [inspect, backup, update, settle]
                  status:
                    type: string
        lastUpdate:
          $ref: "#/components/schemas/SiteWordpressLastUpdateDto"
          nullable: true

    SiteWordpressAcceptedDto:
      type: object
      additionalProperties: false
      required: [siteId, operationId]
      properties:
        siteId:
          type: string
        operationId:
          type: string

    SiteWordpressPasswordResetDto:
      type: object
      additionalProperties: false
      required: [temporaryPassword]
      properties:
        temporaryPassword:
          type: string
          minLength: 24
          description: One-time temporary password; shown once and never stored by the panel

    SiteWordpressImportSlotDto:
      type: object
      additionalProperties: false
      required: [state, size, uploadId]
      properties:
        state:
          type: string
          enum: [empty, partial, complete]
        size:
          type: integer
          minimum: 0
          description: Bytes held; a `partial` upload resumes at `offset = size`
        uploadId:
          type: string
          nullable: true
          pattern: "^[A-Za-z0-9_-]{16,64}$"
          description: The upload to resume, set only while the slot is `partial`

    SiteWordpressLastImportDto:
      type: object
      additionalProperties: false
      required: [operationId, finishedAt, outcome, reason, backup, oldAddress, leftOut, tables, line, errorNumber]
      properties:
        operationId:
          type: string
          pattern: "^op_[0-9a-f]{32}$"
        finishedAt:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [imported, nothing_changed, site_restored, undo_incomplete]
        reason:
          type: string
          nullable: true
          description: Closed reason of a failed import (null when imported)
          enum:
            - files_missing
            - earlier_import_unfinished
            - backup_failed
            - interrupted
            - timed_out
            - unavailable
            - other
            - archive_not_zip
            - dump_not_sql
            - archive_unsafe
            - archive_limit
            - archive_not_wordpress
            - disk_full
            - staging_unsafe
            - dump_unsafe
            - dump_too_large
            - dump_incomplete
            - dump_statement_unsupported
            - dump_load_failed
            - dump_not_wordpress
            - dump_ambiguous
            - multisite_unsupported
            - address_unsupported
            - dump_objects_unsupported
            - dump_names_unsupported
            - dump_too_many_tables
            - site_objects_unsupported
            - address_rewrite_failed
            - site_check_failed
        backup:
          type: string
          enum: [taken, skipped, failed]
        oldAddress:
          type: string
          nullable: true
          maxLength: 300
          description: The address the imported site had before (scheme, host and optional port)
        leftOut:
          type: array
          maxItems: 16
          description: Archive entries the import never takes, each the path from the site root
          items:
            type: string
            enum:
              - wp-config.php
              - ".htaccess"
              - ".maintenance"
              - wp-content/mu-plugins
              - wp-content/advanced-cache.php
              - wp-content/object-cache.php
              - wp-content/db.php
              - wp-content/db-error.php
              - wp-content/install.php
              - wp-content/maintenance.php
              - wp-content/php-error.php
              - wp-content/fatal-error-handler.php
              - wp-content/sunrise.php
              - wp-content/blog-deleted.php
              - wp-content/blog-inactive.php
              - wp-content/blog-suspended.php
        tables:
          type: integer
          minimum: 0
          nullable: true
        line:
          type: integer
          minimum: 0
          nullable: true
          description: Line of the database export where loading stopped
        errorNumber:
          type: integer
          minimum: 1
          maximum: 99999
          nullable: true
          description: Database error number where loading stopped

    SiteWordpressImportDto:
      type: object
      additionalProperties: false
      required: [available, backupsConfigured, slots, earlierImportUnfinished, runningOperation, lastImport]
      properties:
        available:
          type: boolean
        backupsConfigured:
          type: boolean
        slots:
          type: object
          nullable: true
          additionalProperties: false
          required: [archive, dump]
          description: Null when the site's files could not be read
          properties:
            archive:
              $ref: "#/components/schemas/SiteWordpressImportSlotDto"
            dump:
              $ref: "#/components/schemas/SiteWordpressImportSlotDto"
        earlierImportUnfinished:
          type: boolean
          description: An earlier import was left unfinished; restore a copy from Backups before a new import
        runningOperation:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, kind, status, steps]
          properties:
            id:
              type: string
            kind:
              type: string
              enum: [site.wordpress.import]
            status:
              type: string
            steps:
              type: array
              maxItems: 6
              items:
                type: object
                additionalProperties: false
                required: [key, status]
                properties:
                  key:
                    type: string
                    enum: [check, backup, unpack, database, switch, finish]
                  status:
                    type: string
        lastImport:
          $ref: "#/components/schemas/SiteWordpressLastImportDto"
          nullable: true

    SiteWordpressImportChunkRequest:
      type: object
      additionalProperties: false
      required: [uploadId, offset, dataBase64, final]
      description: A chunk is at most 512 KiB (524,288 bytes) before base64.
      properties:
        uploadId:
          type: string
          minLength: 16
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]{16,64}$"
        offset:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        dataBase64:
          type: string
          maxLength: 699052
          pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
        final:
          type: boolean

    SiteWordpressImportPickRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          $ref: "#/components/schemas/SiteFileItemPath"

    SiteWordpressImportStartRequest:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm:
          type: boolean
          enum: [true]

    SiteBackupAccepted:
      type: object
      required: [siteId, backupId, operationId]
      properties:
        siteId:
          type: string
        backupId:
          type: string
        operationId:
          type: string

    SiteDomainsDto:
      type: object
      required: [serverIpv4, routesPending, domains, mail]
      properties:
        mail:
          type: object
          required: [configured, fromAddress]
          properties:
            configured:
              type: boolean
            fromAddress:
              type: string
              nullable: true
        serverIpv4:
          type: string
        routesPending:
          type: boolean
        domains:
          type: array
          items:
            $ref: "#/components/schemas/SiteDomainDto"

    CreateManagedSiteInput:
      type: object
      required: [name, domain, title, adminUser, adminEmail, adminPassword]
      properties:
        name:
          type: string
          maxLength: 80
        domain:
          type: string
        includeWww:
          type: boolean
          default: false
          description: Also add `www.<domain>` as a second address of the site.
        phpVersion:
          type: string
          enum: ["8.3", "8.4", "8.5"]
          description: >-
            The PHP version of the site. Absent: the site type's default. A version the site type does not
            offer (to this caller) is refused (`VALIDATION_ERROR`).
        templateId:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            The site type, from the site types route. Absent: the built-in WordPress. An unknown, disabled or
            archived site type is `NOT_FOUND` (`details[0].reason: template_unavailable`).
        parameters:
          type: array
          maxItems: 32
          description: >-
            Values for the parameters of the site type that this caller may set; one entry per key. A parameter
            left out takes its default. A value the parameter refuses, an unknown key, or a missing required
            value is `VALIDATION_ERROR` (`details[].field: parameters.<key>`). A value whose rendered
            environment variable the executor would refuse (only a Docker socket path does) is also
            `VALIDATION_ERROR`, but with `details[0].field: parameters` (no key) and
            `details[0].reason: unsafe_value`; nothing is stored.
          items:
            $ref: "#/components/schemas/SiteTemplateParameterEntry"
        title:
          type: string
          maxLength: 120
        adminUser:
          type: string
        adminEmail:
          type: string
          format: email
        adminPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true

    AdminCreateSiteInput:
      allOf:
        - $ref: "#/components/schemas/CreateManagedSiteInput"
        - type: object
          required: [ownerOrganizationId]
          properties:
            ownerOrganizationId:
              type: string
              nullable: true

    ChangeSiteOwnerInput:
      type: object
      required: [ownerOrganizationId]
      properties:
        ownerOrganizationId:
          type: string
          nullable: true

    UpdateOrganizationSiteLimitInput:
      type: object
      additionalProperties: false
      required: [maxSites]
      properties:
        maxSites:
          type: integer
          minimum: 0
          maximum: 10000
          nullable: true
          description: "`null` removes the limit; `0` allows no new site. Sites the customer already holds are kept when the limit is set below their number."

    OrganizationSiteLimitDto:
      type: object
      required: [organizationId, maxSites, usedSites]
      properties:
        organizationId:
          type: string
        maxSites:
          type: integer
          minimum: 0
          nullable: true
          description: The limit now in force; `null` means unlimited
        usedSites:
          type: integer
          minimum: 0
          description: Sites the customer holds now, whatever their status

    UpdateOrganizationAppStackLimitInput:
      type: object
      additionalProperties: false
      required: [maxAppStacks]
      properties:
        maxAppStacks:
          type: integer
          minimum: 0
          maximum: 1000
          nullable: true
          description: "`null` removes the limit; `0` allows no new application. Applications the customer already holds are kept when the limit is set below their number."

    OrganizationAppStackLimitDto:
      type: object
      required: [organizationId, maxAppStacks, usedAppStacks]
      properties:
        organizationId:
          type: string
        maxAppStacks:
          type: integer
          minimum: 0
          nullable: true
          description: The limit now in force; `null` means unlimited
        usedAppStacks:
          type: integer
          minimum: 0
          description: Applications the customer holds now that are not deleted

    SiteTemplateParameterValue:
      description: The value of a template parameter; its type follows the parameter (`enum`, `string` and `size` are strings, `integer` an integer, `boolean` a boolean)
      oneOf:
        - type: string
          maxLength: 256
        - type: integer
        - type: boolean

    SiteTemplateParameter:
      type: object
      required: [key, label, type, customer]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,31}$"
        label:
          type: string
        type:
          type: string
          enum: [enum, integer, string, boolean, size]
        options:
          type: array
          description: The allowed values of an `enum` parameter
          items:
            type: string
        min:
          type: integer
        max:
          type: integer
        default:
          $ref: "#/components/schemas/SiteTemplateParameterValue"
        customer:
          type: boolean
          description: Whether the customer may set the value when creating a site; otherwise only an administrator can

    SiteTemplateParameterEntry:
      type: object
      additionalProperties: false
      required: [key, value]
      description: One parameter value. Parameters travel as a list of entries, never as an object keyed by name.
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,31}$"
        value:
          $ref: "#/components/schemas/SiteTemplateParameterValue"

    AdminSiteTemplateSummary:
      type: object
      required: [id, module, name, description, builtIn, enabled, archivedAt, defaultVersionId, defaultVersionNumber, versionCount, siteCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          pattern: "^stpl_[a-z0-9_]{1,64}$"
        module:
          type: string
          enum: [wordpress]
          description: The site type module the template is bound to
        name:
          type: string
          maxLength: 80
        description:
          type: string
          nullable: true
        builtIn:
          type: boolean
          description: The WordPress template that ships with the panel; it cannot be archived
        enabled:
          type: boolean
          description: Whether customers are offered the template
        archivedAt:
          type: string
          format: date-time
          nullable: true
        defaultVersionId:
          type: string
          pattern: "^stv_[a-z0-9_]{1,64}$"
        defaultVersionNumber:
          type: integer
        versionCount:
          type: integer
        siteCount:
          type: integer
          description: Sites that run on any version of the template
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminSiteTemplateVersionSummary:
      type: object
      required: [id, versionNumber, createdAt, siteCount, isDefault]
      properties:
        id:
          type: string
          pattern: "^stv_[a-z0-9_]{1,64}$"
        versionNumber:
          type: integer
        createdAt:
          type: string
          format: date-time
        siteCount:
          type: integer
          description: Sites that run on this version
        isDefault:
          type: boolean

    AdminSiteTemplateDetail:
      allOf:
        - $ref: "#/components/schemas/AdminSiteTemplateSummary"
        - type: object
          required: [versions]
          properties:
            versions:
              type: array
              description: Newest first, without the source
              items:
                $ref: "#/components/schemas/AdminSiteTemplateVersionSummary"

    AdminSiteTemplatesList:
      type: object
      required: [templates, modules]
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/AdminSiteTemplateSummary"
        modules:
          type: array
          description: The site types this release knows, with the PHP versions each supports
          items:
            type: object
            required: [key, phpVersions]
            properties:
              key:
                type: string
                enum: [wordpress]
              phpVersions:
                type: array
                items:
                  type: string

    AdminSiteTemplateVersion:
      type: object
      required: [id, templateId, versionNumber, createdAt, source]
      properties:
        id:
          type: string
          pattern: "^stv_[a-z0-9_]{1,64}$"
        templateId:
          type: string
          pattern: "^stpl_[a-z0-9_]{1,64}$"
        versionNumber:
          type: integer
        createdAt:
          type: string
          format: date-time
        source:
          type: string
          description: The Compose-like YAML document, as saved

    AdminSiteTemplateVersionCreated:
      allOf:
        - $ref: "#/components/schemas/AdminSiteTemplateVersion"
        - type: object
          required: [isDefault, created]
          properties:
            isDefault:
              type: boolean
            created:
              type: boolean
              description: "`false` when the source is identical to the latest version and no version was added"

    CreateSiteTemplateInput:
      type: object
      additionalProperties: false
      required: [module, name, source]
      properties:
        module:
          type: string
          enum: [wordpress]
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
        source:
          type: string
          minLength: 1
          description: The Compose-like YAML document, at most 65536 bytes
          maxLength: 65536

    AddSiteTemplateVersionInput:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          type: string
          minLength: 1
          maxLength: 65536
        makeDefault:
          type: boolean
          default: true
          description: Make the new version the one customers get

    UpdateSiteTemplateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
          nullable: true
        enabled:
          type: boolean
        defaultVersionId:
          type: string
          pattern: "^stv_[a-z0-9_]{1,64}$"

    ValidateSiteTemplateInput:
      type: object
      additionalProperties: false
      required: [module, source]
      properties:
        module:
          type: string
          enum: [wordpress]
        source:
          type: string
          minLength: 1
          maxLength: 65536

    SiteTemplateIssue:
      type: object
      required: [line, column, path, code, message]
      properties:
        line:
          type: integer
          nullable: true
          description: "`null` for a problem that has no position in the source"
        column:
          type: integer
          nullable: true
        path:
          type: string
          nullable: true
          description: Where in the document the problem is; `null` for a syntax error
        code:
          type: string
        message:
          type: string

    SiteTemplatePreview:
      type: object
      description: The service the template would deploy with every parameter at its default. Arrays only, so an environment variable named like a secret does not redact the answer.
      required: [module, image, internalPort, exposeHttp, limits, environment, volumes, phpSettings, parameters]
      properties:
        module:
          type: string
          enum: [wordpress]
        image:
          type: string
        internalPort:
          type: integer
        exposeHttp:
          type: boolean
        limits:
          type: object
          required: [cpuMilli, memoryBytes]
          properties:
            cpuMilli:
              type: integer
            memoryBytes:
              type: string
        environment:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name:
                type: string
              value:
                type: string
        volumes:
          type: array
          items:
            type: object
            required: [volume, containerPath]
            properties:
              volume:
                type: string
              containerPath:
                type: string
        phpSettings:
          type: array
          items:
            type: object
            required: [key, value]
            properties:
              key:
                type: string
              value:
                type: string
        parameters:
          type: array
          items:
            type: object
            required: [key, label, type, customer, value]
            properties:
              key:
                type: string
              label:
                type: string
              type:
                type: string
                enum: [enum, integer, string, boolean, size]
              customer:
                type: boolean
              value:
                $ref: "#/components/schemas/SiteTemplateParameterValue"

    SiteTemplateValidation:
      type: object
      required: [valid, errors, parameters, preview]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          description: Sorted by position, at most 50
          items:
            $ref: "#/components/schemas/SiteTemplateIssue"
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/SiteTemplateParameter"
        preview:
          nullable: true
          description: "`null` when the source is not valid"
          allOf:
            - $ref: "#/components/schemas/SiteTemplatePreview"

    CustomerSiteTypeParameter:
      type: object
      description: A parameter the customer may set; the same as a template parameter without the `customer` flag
      required: [key, label, type]
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [enum, integer, string, boolean, size]
        options:
          type: array
          items:
            type: string
        min:
          type: integer
        max:
          type: integer
        default:
          $ref: "#/components/schemas/SiteTemplateParameterValue"

    CustomerSiteType:
      type: object
      required: [id, name, description, module, phpVersions, defaultPhpVersion, parameters]
      properties:
        id:
          type: string
          description: Sent as `templateId` when creating a site
        name:
          type: string
        description:
          type: string
          nullable: true
        module:
          type: string
          enum: [wordpress]
        phpVersions:
          type: array
          description: The PHP versions the customer can pick; only the default when the site type does not let the customer choose
          items:
            type: string
        defaultPhpVersion:
          type: string
          nullable: true
        parameters:
          type: array
          description: The parameters the customer may set, without `php_version`, which is `phpVersion`
          items:
            $ref: "#/components/schemas/CustomerSiteTypeParameter"

    CustomerSiteTypes:
      type: object
      required: [siteTypes]
      properties:
        siteTypes:
          type: array
          description: The built-in WordPress first, then by name
          items:
            $ref: "#/components/schemas/CustomerSiteType"

    ChangeSiteTemplateVersionInput:
      type: object
      additionalProperties: false
      required: [versionId]
      properties:
        versionId:
          type: string
          pattern: "^stv_[a-z0-9_]{1,64}$"
          description: A newer version of the template the site runs on

    AdminSiteTemplateRef:
      type: object
      required: [templateId, templateName, versionId, versionNumber, defaultVersionId, defaultVersionNumber]
      properties:
        templateId:
          type: string
        templateName:
          type: string
        versionId:
          type: string
          description: The version the site runs on
        versionNumber:
          type: integer
        defaultVersionId:
          type: string
          nullable: true
          description: The version the template offers now; the site can move to it when its number is higher
        defaultVersionNumber:
          type: integer
          nullable: true

    AppEntityId:
      type: string
      pattern: "^[a-z][a-z0-9_]{0,63}$"
      description: An id of the application family (template, version, stack, revision, deployment, domain)

    AppStackKey:
      type: string
      pattern: "^[a-z](?:[a-z0-9-]{0,30}[a-z0-9])?$"
      description: A component (service) or volume key

    AppTemplateParameterKey:
      type: string
      pattern: "^[a-z][a-z0-9_]{0,31}$"
      description: A parameter key; never starts with `hp_`

    AppTemplateState:
      type: string
      enum: [draft, published, archived]
      description: "Derived, never stored: `archived` once archived, else `published` when enabled, else `draft`"

    AppStackStatus:
      type: string
      enum: [draft, queued, deploying, running, degraded, failed, unknown, stopping, stopped, starting, updating, deleting, deleted, delete_failed]

    AppTemplateIssue:
      type: object
      required: [path, code, reason, message]
      properties:
        path:
          type: string
          maxLength: 512
          description: Where in the document the problem is, or `parameters.<key>`; empty for the whole document
        line:
          type: integer
          minimum: 1
          description: Absent for a problem that has no position in the source
        column:
          type: integer
          minimum: 1
        code:
          type: string
          description: The validator's problem code
        reason:
          type: string
          enum: [STACK_TEMPLATE_INVALID, STACK_TEMPLATE_UNPUBLISHED, STACK_IMAGE_NOT_ALLOWED, STACK_QUOTA_EXCEEDED, STACK_DEPENDENCY_CYCLE, STACK_HEALTH_TIMEOUT, STACK_PORT_UNAVAILABLE, STACK_SECRET_MISSING, STACK_VOLUME_IN_USE, STACK_UNSUPPORTED_FEATURE, STACK_PARAMETER_INVALID, STACK_IMAGE_VOLUME_UNCOVERED]
        message:
          type: string
          minLength: 1
          maxLength: 300
          description: Fixed English text; never echoes a value

    AppTemplateValueParameter:
      description: A typed parameter with a default, by `type`
      oneOf:
        - type: object
          required: [key, label, type, options, default, customer]
          properties:
            key: { $ref: "#/components/schemas/AppTemplateParameterKey" }
            label: { type: string, minLength: 1, maxLength: 80 }
            type: { type: string, enum: [enum] }
            options:
              type: array
              minItems: 1
              maxItems: 32
              items: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" }
            default: { type: string }
            customer: { type: boolean }
        - type: object
          required: [key, label, type, default, customer]
          properties:
            key: { $ref: "#/components/schemas/AppTemplateParameterKey" }
            label: { type: string, minLength: 1, maxLength: 80 }
            type: { type: string, enum: [integer] }
            min: { type: integer, minimum: -1000000000, maximum: 1000000000 }
            max: { type: integer, minimum: -1000000000, maximum: 1000000000 }
            default: { type: integer, minimum: -1000000000, maximum: 1000000000 }
            customer: { type: boolean }
        - type: object
          required: [key, label, type, default, customer]
          properties:
            key: { $ref: "#/components/schemas/AppTemplateParameterKey" }
            label: { type: string, minLength: 1, maxLength: 80 }
            type: { type: string, enum: [string] }
            default: { type: string, maxLength: 256 }
            customer: { type: boolean }
        - type: object
          required: [key, label, type, default, customer]
          properties:
            key: { $ref: "#/components/schemas/AppTemplateParameterKey" }
            label: { type: string, minLength: 1, maxLength: 80 }
            type: { type: string, enum: [boolean] }
            default: { type: boolean }
            customer: { type: boolean }
        - type: object
          required: [key, label, type, default, customer]
          properties:
            key: { $ref: "#/components/schemas/AppTemplateParameterKey" }
            label: { type: string, minLength: 1, maxLength: 80 }
            type: { type: string, enum: [size] }
            default: { type: string, pattern: "^[1-9][0-9]{0,4}[KMG]$" }
            customer: { type: boolean }

    AppTemplateParameter:
      description: >-
        A parameter the customer may set, by `type`. A `secret` parameter has no default and is set by the customer,
        write-only. A secret the platform generates (`HCP-STACK/v2`) is never listed here, whether or not the customer
        may replace it.
      oneOf:
        - $ref: "#/components/schemas/AppTemplateValueParameter"
        - type: object
          required: [key, label, type, required, customer]
          properties:
            key: { $ref: "#/components/schemas/AppTemplateParameterKey" }
            label: { type: string, minLength: 1, maxLength: 80 }
            type: { type: string, enum: [secret] }
            required: { type: boolean }
            customer: { type: boolean, enum: [true] }

    AppSecretGenerate:
      type: object
      additionalProperties: false
      required: [kind, length]
      description: >-
        How the platform makes a secret nobody types (`HCP-STACK/v2`). `length` counts characters, except for `base64`
        where it counts the random bytes before encoding; the bounds are 16 to 128 for `password` and `hex`, 16 to 96
        for `base64` and 8 to 32 for `user`. The value is made at installation and never returned.
      properties:
        kind: { type: string, enum: [password, hex, base64, user] }
        length: { type: integer, minimum: 8, maximum: 128 }

    AdminAppTemplateParameter:
      description: >-
        A parameter as the template declares it, by `type` (server administrator only). A `secret` parameter of an
        `HCP-STACK/v1` template has no `generate` and is set by the customer. In `HCP-STACK/v2` it always has
        `generate`: `null` when the customer sets it (`customer` is then `true`), otherwise how the platform makes it at
        installation; a generated secret is always `required`, and `customer` says whether the customer may replace it.
      oneOf:
        - $ref: "#/components/schemas/AppTemplateValueParameter"
        - type: object
          required: [key, label, type, required, customer]
          properties:
            key: { $ref: "#/components/schemas/AppTemplateParameterKey" }
            label: { type: string, minLength: 1, maxLength: 80 }
            type: { type: string, enum: [secret] }
            required: { type: boolean }
            customer: { type: boolean }
            generate:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/AppSecretGenerate"

    AppStackHealthcheck:
      description: A closed tcp or http check on the component's own address; `timeoutSeconds` never exceeds `intervalSeconds`
      oneOf:
        - type: object
          required: [kind, port, intervalSeconds, timeoutSeconds]
          properties:
            kind: { type: string, enum: [tcp] }
            port: { type: integer, minimum: 1, maximum: 65535 }
            intervalSeconds: { type: integer, minimum: 5, maximum: 300 }
            timeoutSeconds: { type: integer, minimum: 1, maximum: 30 }
        - type: object
          required: [kind, port, path, intervalSeconds, timeoutSeconds]
          properties:
            kind: { type: string, enum: [http] }
            port: { type: integer, minimum: 1, maximum: 65535 }
            path: { type: string, pattern: "^/[A-Za-z0-9._~/-]{0,255}$" }
            intervalSeconds: { type: integer, minimum: 5, maximum: 300 }
            timeoutSeconds: { type: integer, minimum: 1, maximum: 30 }

    AppStackPlanIngress:
      type: object
      required: [componentKey, port]
      description: An HTTP entry point of the stack
      properties:
        componentKey:
          $ref: "#/components/schemas/AppStackKey"
        port:
          type: integer
          minimum: 1
          maximum: 65535

    AppStackPreviewComponent:
      type: object
      required: [key, image, runAsUser, argv, environment, secretFiles, resources, expose, dependsOn, volumes, healthcheck]
      properties:
        key:
          $ref: "#/components/schemas/AppStackKey"
        image:
          type: string
          pattern: '^[^\s@\x00-\x1f\x7f-\x9f]{1,255}@sha256:[a-f0-9]{64}$'
          description: Pinned by digest
        runAsUser:
          type: string
          pattern: "^[0-9]{1,10}(?::[0-9]{1,10})?$"
          nullable: true
        argv:
          type: array
          nullable: true
          minItems: 1
          maxItems: 64
          description: The container command; `null` keeps the image's own. Never a shell.
          items: { type: string, minLength: 1, maxLength: 1024 }
        environment:
          type: array
          maxItems: 64
          items:
            type: object
            required: [name, value]
            properties:
              name: { type: string, pattern: "^[A-Z_][A-Z0-9_]{0,63}$" }
              value: { type: string, maxLength: 4096 }
        secretFiles:
          type: array
          maxItems: 64
          description: The secret parameters mounted as read-only files; names only, never a value
          items:
            type: object
            required: [envName, parameterKey]
            properties:
              envName: { type: string, pattern: "^[A-Z_][A-Z0-9_]{0,63}$" }
              parameterKey: { $ref: "#/components/schemas/AppTemplateParameterKey" }
        profile:
          type: string
          enum: [strict, standard]
          description: >-
            The closed container body the component runs with; present only for an `HCP-STACK/v2` template (a v1
            component always runs as `strict`). What a name allows is fixed by the platform: no template names a
            capability, a user or a mount option.
        secretEnvironment:
          type: array
          maxItems: 64
          description: >-
            The variables whose value holds a secret, present only for an `HCP-STACK/v2` template; sorted by unique
            name. Each value is told as its pieces, in order: the template's own text, or the key of the secret
            parameter that fills that place. Never a secret value.
          items:
            type: object
            additionalProperties: false
            required: [name, pieces]
            properties:
              name: { type: string, pattern: "^[A-Z_][A-Z0-9_]{0,63}$" }
              pieces:
                type: array
                minItems: 1
                maxItems: 9
                description: At most 4 of the pieces name a secret parameter, and two pieces of text never follow each other
                items:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required: [literal]
                      properties:
                        literal: { type: string, minLength: 1, maxLength: 4096 }
                    - type: object
                      additionalProperties: false
                      required: [parameterKey]
                      properties:
                        parameterKey: { $ref: "#/components/schemas/AppTemplateParameterKey" }
        resources:
          type: object
          required: [cpuMilli, memoryBytes]
          properties:
            cpuMilli: { type: integer, minimum: 50, maximum: 16000 }
            memoryBytes: { type: string, pattern: "^[1-9][0-9]{0,11}$" }
        expose:
          type: array
          maxItems: 16
          items: { type: integer, minimum: 1, maximum: 65535 }
        dependsOn:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/AppStackKey" }
        volumes:
          type: array
          maxItems: 8
          items:
            type: object
            required: [volumeKey, containerPath, readOnly]
            properties:
              volumeKey: { $ref: "#/components/schemas/AppStackKey" }
              containerPath: { type: string, minLength: 2, maxLength: 255 }
              readOnly: { type: boolean }
        healthcheck:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AppStackHealthcheck"

    AppStackPreview:
      type: object
      description: What the template deploys with every parameter at its default, in deployment order; arrays only, without ids, hashes or secret values
      required: [components, volumes, ingress]
      properties:
        components:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/AppStackPreviewComponent"
        volumes:
          type: array
          maxItems: 8
          items:
            type: object
            required: [key]
            properties:
              key: { $ref: "#/components/schemas/AppStackKey" }
        ingress:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/AppStackPlanIngress"

    ValidateAppTemplateInput:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          type: string
          minLength: 1
          description: The `HCP-STACK/v1` or `HCP-STACK/v2` document, at most 65536 UTF-8 bytes

    ImportComposeInput:
      type: object
      additionalProperties: false
      required: [compose]
      properties:
        compose:
          type: string
          minLength: 1
          description: The Docker Compose file, at most 65536 UTF-8 bytes. Neither it nor the draft is stored or logged.
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: The name of the draft; without it, the `# name:` comment at the head of the file, or a default
        category:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,31}$"
          description: The category of the draft; without it, the `# category:` comment at the head of the file, or `apps`

    CreateAppTemplateInput:
      type: object
      additionalProperties: false
      required: [slug, source]
      properties:
        slug:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,47}$"
        source:
          type: string
          minLength: 1
          description: The `HCP-STACK/v1` or `HCP-STACK/v2` document, at most 65536 UTF-8 bytes; its header gives the name, description and category

    AddAppTemplateVersionInput:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          type: string
          minLength: 1
          description: The `HCP-STACK/v1` or `HCP-STACK/v2` document, at most 65536 UTF-8 bytes
        makeDefault:
          type: boolean
          default: false
          description: Make the new version the default

    UpdateAppTemplateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
          nullable: true
          description: An empty text and `null` both remove it
        category:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,31}$"
        enabled:
          type: boolean
          description: "`true` publishes the template to customers"
        defaultVersionId:
          $ref: "#/components/schemas/AppEntityId"

    ArchiveAppTemplateInput:
      type: object
      additionalProperties: false
      description: An empty object, or no body

    AppTemplateValidationDto:
      type: object
      required: [valid, issues, parameters, preview]
      properties:
        valid:
          type: boolean
        issues:
          type: array
          description: Sorted by position, at most 50; empty when valid
          items:
            $ref: "#/components/schemas/AppTemplateIssue"
        parameters:
          type: array
          description: Every parameter the source declares; empty when not valid
          items:
            $ref: "#/components/schemas/AdminAppTemplateParameter"
        preview:
          nullable: true
          description: "`null` when the source is not valid"
          allOf:
            - $ref: "#/components/schemas/AppStackPreview"

    ComposeImportNote:
      type: object
      required: [level, code, path, message]
      description: What the importer did with one part of the Compose file
      properties:
        level:
          type: string
          enum: [info, changed, dropped, refused]
          description: "`info` kept with a remark, `changed` kept in another form, `dropped` left out, `refused` no draft is made"
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,63}$"
          description: A fixed code of the importer, such as `IMAGE_PINNED`, `PORTS_DROPPED` or `IMAGE_UNRESOLVED`
        path:
          type: string
          maxLength: 512
          description: Where in the file; empty for the whole file
        message:
          type: string
          minLength: 1
          maxLength: 600
          description: Fixed English text; names keys, variables and images of the file, never a secret value

    ComposeImportDto:
      type: object
      required: [source, report, validation]
      properties:
        source:
          type: string
          nullable: true
          description: The draft `HCP-STACK/v2` document; `null` when the report holds a refusal
        report:
          type: array
          maxItems: 200
          description: When the importer has more than 200 things to say, refusals are kept first and the last note says how many are not shown
          items:
            $ref: "#/components/schemas/ComposeImportNote"
        validation:
          nullable: true
          description: The validator's verdict on the draft; `null` without a draft
          allOf:
            - $ref: "#/components/schemas/AppTemplateValidationDto"

    AdminAppTemplateSummaryDto:
      type: object
      required: [id, slug, name, category, description, builtIn, enabled, archivedAt, state, defaultVersionId, defaultVersionNumber, installations, componentCount, hasIngress, hasVolumes, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/AppEntityId"
        slug:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: string
          nullable: true
        builtIn:
          type: boolean
        enabled:
          type: boolean
        archivedAt:
          type: string
          format: date-time
          nullable: true
        state:
          $ref: "#/components/schemas/AppTemplateState"
        defaultVersionId:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
          nullable: true
        defaultVersionNumber:
          type: integer
          minimum: 1
          nullable: true
        installations:
          type: integer
          minimum: 0
          description: Applications not deleted, on any version
        componentCount:
          type: integer
          minimum: 0
          description: Components of the default version
        hasIngress:
          type: boolean
        hasVolumes:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    AdminAppTemplateVersionSummaryDto:
      type: object
      required: [id, versionNumber, specHash, createdAt, installations]
      properties:
        id:
          $ref: "#/components/schemas/AppEntityId"
        versionNumber:
          type: integer
          minimum: 1
        specHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        createdAt:
          type: string
          format: date-time
        installations:
          type: integer
          minimum: 0

    AdminAppTemplateDetailDto:
      allOf:
        - $ref: "#/components/schemas/AdminAppTemplateSummaryDto"
        - type: object
          required: [createdAt, versions]
          properties:
            createdAt:
              type: string
              format: date-time
            versions:
              type: array
              description: Newest first, without the source
              items:
                $ref: "#/components/schemas/AdminAppTemplateVersionSummaryDto"

    AdminAppTemplateVersionCreatedDto:
      type: object
      required: [template, versionId, versionNumber, created]
      properties:
        template:
          $ref: "#/components/schemas/AdminAppTemplateDetailDto"
        versionId:
          $ref: "#/components/schemas/AppEntityId"
        versionNumber:
          type: integer
          minimum: 1
        created:
          type: boolean
          description: "`false` when the source and spec are the same as the latest version and nothing was stored"

    AdminAppTemplateVersionDto:
      type: object
      required: [id, templateId, versionNumber, specHash, createdAt, source, valid, issues, parameters, preview]
      properties:
        id:
          $ref: "#/components/schemas/AppEntityId"
        templateId:
          $ref: "#/components/schemas/AppEntityId"
        versionNumber:
          type: integer
          minimum: 1
        specHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        createdAt:
          type: string
          format: date-time
        source:
          type: string
          description: The `HCP-STACK/v1` or `HCP-STACK/v2` document, as saved
        valid:
          type: boolean
          description: Whether the stored source passes today's checks
        issues:
          type: array
          items:
            $ref: "#/components/schemas/AppTemplateIssue"
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/AdminAppTemplateParameter"
        preview:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AppStackPreview"

    AdminAppTemplateUsageDto:
      type: object
      required: [templateId, stacks, truncated]
      properties:
        templateId:
          $ref: "#/components/schemas/AppEntityId"
        stacks:
          type: array
          maxItems: 200
          description: By customer name, then application name
          items:
            type: object
            required: [id, name, organizationId, organizationName, versionNumber, status]
            properties:
              id:
                $ref: "#/components/schemas/AppEntityId"
              name:
                type: string
              organizationId:
                type: string
              organizationName:
                type: string
              versionNumber:
                type: integer
                minimum: 1
              status:
                $ref: "#/components/schemas/AppStackStatus"
        truncated:
          type: boolean
          description: More than 200 applications exist

    AdminAppStacksDto:
      type: object
      required: [stacks, truncated]
      properties:
        stacks:
          type: array
          maxItems: 200
          description: By customer name, then application name
          items:
            type: object
            required: [id, name, organizationName, templateId, templateName, versionNumber, status, primaryHostname]
            properties:
              id:
                $ref: "#/components/schemas/AppEntityId"
              name:
                type: string
              organizationName:
                type: string
              templateId:
                $ref: "#/components/schemas/AppEntityId"
              templateName:
                type: string
              versionNumber:
                type: integer
                minimum: 1
              status:
                $ref: "#/components/schemas/AppStackStatus"
              primaryHostname:
                type: string
                nullable: true
                description: The first active web address by hostname, else the first one
        truncated:
          type: boolean
          description: More than 200 applications exist

    AdminAppStackDto:
      type: object
      required: [id, name, organizationId, organizationName, templateId, templateName, versionNumber, status, primaryHostname, components]
      properties:
        id:
          $ref: "#/components/schemas/AppEntityId"
        name:
          type: string
        organizationId:
          type: string
        organizationName:
          type: string
        templateId:
          $ref: "#/components/schemas/AppEntityId"
        templateName:
          type: string
        versionNumber:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/AppStackStatus"
        primaryHostname:
          type: string
          nullable: true
          description: The first active web address by hostname, else the first one
        components:
          type: array
          description: In the order of the customer's own page
          items:
            type: object
            required: [key, health]
            properties:
              key:
                $ref: "#/components/schemas/AppStackKey"
              health:
                $ref: "#/components/schemas/AppStackComponentHealth"

    CustomerAppTemplateSummaryDto:
      type: object
      required: [id, name, description, category, versionId, versionNumber, componentCount, cpuMilli, memoryBytes, volumeCount, hasIngress]
      properties:
        id:
          $ref: "#/components/schemas/AppEntityId"
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
        versionId:
          $ref: "#/components/schemas/AppEntityId"
        versionNumber:
          type: integer
          minimum: 1
        componentCount:
          type: integer
          minimum: 1
        cpuMilli:
          type: integer
          minimum: 0
          description: Sum of the components' CPU limits
        memoryBytes:
          type: string
          pattern: "^[0-9]{1,20}$"
          description: Sum of the components' memory limits, as a decimal string
        volumeCount:
          type: integer
          minimum: 0
        hasIngress:
          type: boolean

    CustomerAppTemplatesDto:
      type: object
      required: [templates, categories]
      properties:
        templates:
          type: array
          description: By name
          items:
            $ref: "#/components/schemas/CustomerAppTemplateSummaryDto"
        categories:
          type: array
          description: The categories of `templates`, sorted
          items:
            type: string

    CustomerAppTemplateDto:
      allOf:
        - $ref: "#/components/schemas/CustomerAppTemplateSummaryDto"
        - type: object
          required: [parameters, ingress, components]
          properties:
            parameters:
              type: array
              description: The parameters the customer may set, secret ones included, in source order
              items:
                $ref: "#/components/schemas/AppTemplateParameter"
            ingress:
              type: array
              items:
                $ref: "#/components/schemas/AppStackPlanIngress"
            components:
              type: array
              description: By key
              items:
                type: object
                required: [key, cpuMilli, memoryBytes]
                properties:
                  key:
                    $ref: "#/components/schemas/AppStackKey"
                  cpuMilli:
                    type: integer
                  memoryBytes:
                    type: string
                    pattern: "^[0-9]{1,20}$"

    AppStackComponentHealth:
      type: string
      enum: [unknown, starting, healthy, unhealthy, stopped, missing]

    AppStackDeploymentStatus:
      type: string
      enum: [queued, running, succeeded, failed, unknown, cancelled]

    AppStackVolumeStatus:
      type: string
      enum: [pending, present, retained, removed, missing]

    AppStackRetentionPolicy:
      type: string
      enum: [retain, destroy]
      description: "`destroy` once a delete with `destroyData: true` was requested"

    AppStackDiffChange:
      type: string
      enum: [added, updated, removed, unchanged]

    AppTemplateParameterEntry:
      type: object
      additionalProperties: false
      required: [key, value]
      properties:
        key:
          $ref: "#/components/schemas/AppTemplateParameterKey"
        value:
          oneOf:
            - type: string
              maxLength: 256
            - type: integer
            - type: boolean

    AppTemplateParameterEntries:
      type: array
      maxItems: 32
      description: Public parameter values, each key once; a list, never a keyed object
      items:
        $ref: "#/components/schemas/AppTemplateParameterEntry"

    AppStackDomainEntry:
      type: object
      additionalProperties: false
      required: [hostname, componentKey, port]
      properties:
        hostname:
          type: string
          description: Lower-cased; an international name is stored as punycode
        componentKey:
          $ref: "#/components/schemas/AppStackKey"
        port:
          type: integer
          minimum: 1
          maximum: 65535
        compression:
          type: boolean
          description: "true creates the address with compression on (ADR-0037); left out, it is off"

    CreateAppStackInput:
      type: object
      additionalProperties: false
      required: [templateVersionId, name, deploy]
      properties:
        templateVersionId:
          $ref: "#/components/schemas/AppEntityId"
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Trimmed; no control characters; unique in the organization
        parameters:
          $ref: "#/components/schemas/AppTemplateParameterEntries"
        domains:
          type: array
          maxItems: 8
          default: []
          description: Each hostname once
          items:
            $ref: "#/components/schemas/AppStackDomainEntry"
        deploy:
          type: boolean
          description: "`false` saves a draft: set its secrets, then deploy"

    DeployAppStackInput:
      type: object
      additionalProperties: false
      properties:
        parameters:
          $ref: "#/components/schemas/AppTemplateParameterEntries"

    AppStackActionInput:
      type: object
      additionalProperties: false
      description: An empty object, or no body

    PlanAppStackInput:
      type: object
      additionalProperties: false
      description: "`templateVersionId` previews an upgrade, `revisionId` a rollback (not both; a rollback takes no `parameters`), neither a deploy"
      properties:
        templateVersionId:
          $ref: "#/components/schemas/AppEntityId"
        revisionId:
          $ref: "#/components/schemas/AppEntityId"
        parameters:
          $ref: "#/components/schemas/AppTemplateParameterEntries"

    UpgradeAppStackInput:
      type: object
      additionalProperties: false
      required: [templateVersionId, planHash]
      properties:
        templateVersionId:
          $ref: "#/components/schemas/AppEntityId"
        parameters:
          $ref: "#/components/schemas/AppTemplateParameterEntries"
        planHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: The `planHash` of the preview the customer confirmed
        secrets:
          type: array
          maxItems: 8
          description: >-
            The private values the preview names in `newSecrets`, each key once. Write-only, like
            `SetAppStackSecretInput`
          items:
            type: object
            additionalProperties: false
            required: [parameterKey, value]
            properties:
              parameterKey:
                $ref: "#/components/schemas/AppTemplateParameterKey"
              value:
                type: string
                minLength: 6
                maxLength: 16384
                writeOnly: true
                description: >-
                  At least 6 characters (`value_too_short`). No control character other than tab and line breaks, no
                  unpaired surrogate, and no mark of a platform
                  process (`HP_TERMINAL_SESSION=` or `HP_TASK_RUN=`, anywhere), which an image could put in a component's
                  environment (`ADR-0041`); other `HP_` or `PHP_` text is accepted. Refused with `VALIDATION_ERROR`.

    RollbackAppStackInput:
      type: object
      additionalProperties: false
      required: [revisionId, planHash]
      properties:
        revisionId:
          $ref: "#/components/schemas/AppEntityId"
        planHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: The `planHash` of the preview the customer confirmed

    DeleteAppStackInput:
      type: object
      additionalProperties: false
      required: [confirmName, destroyData]
      properties:
        confirmName:
          type: string
          maxLength: 64
          description: The name of the application, exactly
        destroyData:
          type: boolean
          description: "`true` also removes the volumes and the secrets; `false` keeps them"

    CreateAppStackBackupInput:
      type: object
      additionalProperties: false
      description: Empty. The data of every volume go to every backup destination of the server; nothing is chosen here

    RestoreAppStackBackupInput:
      type: object
      additionalProperties: false
      required: [confirmName]
      properties:
        confirmName:
          type: string
          maxLength: 64
          description: The name of the application, exactly

    SetAppStackSecretInput:
      type: object
      additionalProperties: false
      required: [parameterKey, value]
      description: Write-only; `value` is never returned
      properties:
        parameterKey:
          $ref: "#/components/schemas/AppTemplateParameterKey"
        value:
          type: string
          minLength: 6
          maxLength: 16384
          writeOnly: true
          description: >-
            At least 6 characters (`value_too_short`). No control character other than tab and line breaks, no unpaired surrogate, and no mark of a platform
            process (`HP_TERMINAL_SESSION=` or `HP_TASK_RUN=`, anywhere), which an image could put in a component's
            environment (`ADR-0041`); other `HP_` or `PHP_` text is accepted. Refused with `VALIDATION_ERROR`.

    AddAppStackDomainInput:
      $ref: "#/components/schemas/AppStackDomainEntry"

    AppStackDomainPathRoute:
      type: object
      additionalProperties: false
      required: [pathPrefix, componentKey, port, stripPrefix]
      properties:
        pathPrefix:
          type: string
          maxLength: 64
          pattern: "^(?:/[A-Za-z0-9][A-Za-z0-9._~-]{0,31}){1,4}$"
          description: One to four segments, no trailing slash. The rule takes this path and everything below it
        componentKey:
          $ref: "#/components/schemas/AppStackKey"
        port:
          type: integer
          minimum: 1
          maximum: 65535
        stripPrefix:
          type: boolean
          description: Whether the path is taken off the request before it reaches the application

    UpdateAppStackDomainInput:
      type: object
      additionalProperties: false
      required: [redirectToDomainId, compression, protection, pathRoutes]
      description: The four routing options of a web address (ADR-0037), always sent together
      properties:
        redirectToDomainId:
          nullable: true
          description: Another web address of the same application; visitors are sent there, path and query kept
          allOf:
            - $ref: "#/components/schemas/AppEntityId"
        compression:
          type: boolean
        protection:
          type: object
          nullable: true
          additionalProperties: false
          required: [username]
          properties:
            username:
              type: string
              pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$"
            password:
              type: string
              writeOnly: true
              minLength: 12
              maxLength: 128
              description: Printable ASCII characters. Leave it out to keep the password already set
        pathRoutes:
          type: array
          maxItems: 4
          description: Each path once
          items:
            $ref: "#/components/schemas/AppStackDomainPathRoute"

    AppStackAcceptedDto:
      type: object
      required: [stackId, operationId, deploymentId, status]
      properties:
        stackId:
          $ref: "#/components/schemas/AppEntityId"
        operationId:
          type: string
          minLength: 1
          maxLength: 128
          nullable: true
          description: "`null` only for a draft"
        deploymentId:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AppEntityId"
        status:
          $ref: "#/components/schemas/AppStackStatus"

    AppStackAcceptedEnvelope:
      type: object
      required: [data, links]
      properties:
        data:
          $ref: "#/components/schemas/AppStackAcceptedDto"
        links:
          type: object
          required: [stack, operation]
          properties:
            stack:
              type: string
            operation:
              type: string
              nullable: true

    AppStackSummaryDto:
      type: object
      required: [id, name, status, templateId, templateName, templateVersionNumber, installed, componentCount, unhealthyCount, primaryHostname, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/AppEntityId"
        name:
          type: string
        status:
          $ref: "#/components/schemas/AppStackStatus"
        templateId:
          $ref: "#/components/schemas/AppEntityId"
        templateName:
          type: string
        templateVersionNumber:
          type: integer
          minimum: 1
        installed:
          type: object
          nullable: true
          description: >-
            The revision that runs (the applied one) whenever it is not the current one: while a change runs; after a
            change that failed once its components were being created; after an upgrade or a rollback that failed before
            that but was not taken back, because a web address now points at a part only the new version has; after a
            deploy with new settings that failed before its components were created (a deploy is not taken back). The
            `status` of the detail then follows the components of this revision. `null` when the current revision is the
            one that runs, and when none ever ran
          required: [revisionNumber, templateVersionNumber]
          properties:
            revisionNumber:
              type: integer
              minimum: 1
            templateVersionNumber:
              type: integer
              minimum: 1
        componentCount:
          type: integer
          minimum: 0
        unhealthyCount:
          type: integer
          minimum: 0
          description: Components observed unhealthy or missing; a stale observation is not counted
        primaryHostname:
          type: string
          nullable: true
          description: The first active web address by hostname, else the first one
        updatedAt:
          type: string
          format: date-time

    AppStackDetailDto:
      allOf:
        - $ref: "#/components/schemas/AppStackSummaryDto"
        - type: object
          required: [templateVersionId, createdAt, activeOperationId, platformWork, allowedActions, outcomeUnknown, revisionNumber, components, parameters, secretParameters, volumes, ingress, pathTargets, routesPending, cpuMilli, memoryBytes, upgrade, rollback]
          properties:
            templateVersionId:
              $ref: "#/components/schemas/AppEntityId"
            createdAt:
              type: string
              format: date-time
            activeOperationId:
              type: string
              nullable: true
              description: The organisation's own operation that holds the application, to follow; `null` otherwise
            platformWork:
              type: string
              enum: [backups_cleanup]
              nullable: true
              description: >-
                The application is held by work of the platform (`backups_cleanup`: the nightly clean-up of its
                backups, ADR-0038). Only the kind of work is given, never the operation, which the organisation cannot
                read; its actions answer `409 RESOURCE_LOCKED` until it ends
            allowedActions:
              type: array
              description: >-
                What the stored status, the lock and the caller's permissions allow now, decided by the checks the
                queueing request starts with (issue #106): none while an operation holds the application (whoever queued
                it), else those the stored status allows (the transition table; a backup and a restore from `running`,
                `degraded`, `failed` or `stopped`), kept to the ones the caller's permissions allow (`app.control` for
                deploy, start, stop, restart, backup and restore, `app.update` for upgrade and rollback, `app.delete` for
                delete; none for a suspended organisation). A run of a task that waits for its turn (ADR-0042) holds a
                lock of its own and does not change this list, though `activeOperationId` names it; once it runs it holds
                the application like any operation, and the list is empty. The `status` shown here also reflects the
                health of the components (a crashed essential component reads `failed`, a stale reading `unknown`) and
                never changes this list: an application that crashed keeps its stored `running` or `degraded`, so it offers
                `stack.restart`, not `stack.start`. Upgrade and rollback also need their target (`upgrade`, `rollback`).
                A listed action can still be refused for a reason of its own, which its answer gives: a database that
                applications still use (`VALIDATION_ERROR`, reason `database_in_use`), the hourly limit of backups and
                restores (`QUOTA_EXCEEDED`), a plan that no longer validates, or what `unavailableReason` of the backups
                says. Read at the time of the request: an operation queued a moment later still makes a request answer
                `409 RESOURCE_LOCKED`
              items:
                type: string
                enum: [stack.deploy, stack.start, stack.stop, stack.restart, stack.upgrade, stack.rollback, stack.delete, stack.backup, stack.restore]
            outcomeUnknown:
              type: boolean
              description: >-
                The outcome of the application's last operation is not known: its stored status is `unknown` (an
                operation in doubt until recovery settles it, or a stop interrupted by an API restart). `false` when
                `status` reads `unknown` only because the components could not be read lately
            revisionNumber:
              type: integer
              minimum: 1
              nullable: true
              description: "`null` for a draft"
            components:
              type: array
              description: In deployment order; a draft's by key
              items:
                type: object
                required: [key, health, healthObservedAt, dependsOn, ingress, cpuMilli, memoryBytes]
                properties:
                  key:
                    $ref: "#/components/schemas/AppStackKey"
                  health:
                    $ref: "#/components/schemas/AppStackComponentHealth"
                  healthObservedAt:
                    type: string
                    format: date-time
                    nullable: true
                  dependsOn:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppStackKey"
                  ingress:
                    type: boolean
                  cpuMilli:
                    type: integer
                  memoryBytes:
                    type: string
                    pattern: "^[0-9]{1,20}$"
            parameters:
              type: array
              description: The public settings; secret ones are never listed here
              items:
                type: object
                required: [key, label, value]
                properties:
                  key:
                    $ref: "#/components/schemas/AppTemplateParameterKey"
                  label:
                    type: string
                  value:
                    oneOf:
                      - type: string
                      - type: integer
                      - type: boolean
            secretParameters:
              type: array
              description: Whether each secret is set, never its value
              items:
                type: object
                required: [key, label, required, isSet, version, setAt]
                properties:
                  key:
                    $ref: "#/components/schemas/AppTemplateParameterKey"
                  label:
                    type: string
                  required:
                    type: boolean
                  isSet:
                    type: boolean
                  version:
                    type: integer
                    minimum: 1
                    nullable: true
                  setAt:
                    type: string
                    format: date-time
                    nullable: true
            volumes:
              type: array
              items:
                type: object
                required: [key, status, retentionPolicy]
                properties:
                  key:
                    $ref: "#/components/schemas/AppStackKey"
                  status:
                    $ref: "#/components/schemas/AppStackVolumeStatus"
                  retentionPolicy:
                    $ref: "#/components/schemas/AppStackRetentionPolicy"
            ingress:
              type: array
              items:
                $ref: "#/components/schemas/AppStackPlanIngress"
            pathTargets:
              type: array
              description: >-
                ADR-0037: the entry points a path of an address may point at now, those of both the revision that runs
                and the desired one (the routing options refuse any other with `unknown_ingress`)
              items:
                $ref: "#/components/schemas/AppStackPlanIngress"
            routesPending:
              type: boolean
              description: >-
                ADR-0037: the saved web addresses and their routing options differ from those the last successful route
                publication was made from, whatever the health of the targets then or now. While true the page shows no
                option of an address as active.
            cpuMilli:
              type: integer
              minimum: 0
            memoryBytes:
              type: string
              pattern: "^[0-9]{1,20}$"
            upgrade:
              type: object
              nullable: true
              description: The newer published version on offer, if any
              required: [templateVersionId, versionNumber]
              properties:
                templateVersionId:
                  $ref: "#/components/schemas/AppEntityId"
                versionNumber:
                  type: integer
                  minimum: 1
            rollback:
              type: object
              nullable: true
              description: >-
                The way back: the newest earlier revision that ran (a deploy, an upgrade or a rollback of it succeeded,
                or failed only at publishing its routes once its components were healthy) and whose plan is not the
                current one; `null` if none
              required: [revisionId, revisionNumber, templateVersionNumber]
              properties:
                revisionId:
                  $ref: "#/components/schemas/AppEntityId"
                revisionNumber:
                  type: integer
                  minimum: 1
                templateVersionNumber:
                  type: integer
                  minimum: 1

    AppStackSecretStateDto:
      type: object
      required: [key, isSet, version, setAt]
      properties:
        key:
          $ref: "#/components/schemas/AppTemplateParameterKey"
        isSet:
          type: boolean
          enum: [true]
        version:
          type: integer
          minimum: 1
        setAt:
          type: string
          format: date-time

    AppStackDeploymentDto:
      type: object
      required: [id, operationId, kind, revisionNumber, status, problem, startedAt, endedAt]
      properties:
        id:
          $ref: "#/components/schemas/AppEntityId"
        operationId:
          type: string
        kind:
          type: string
          enum: [stack.deploy, stack.start, stack.stop, stack.restart, stack.upgrade, stack.rollback, stack.delete]
        revisionNumber:
          type: integer
          minimum: 1
          nullable: true
        status:
          $ref: "#/components/schemas/AppStackDeploymentStatus"
        problem:
          type: string
          nullable: true
          description: >-
            An UPPER_SNAKE reason or error code, never free text. `STACK_IMAGE_VOLUME_UNCOVERED`: a deploy, upgrade or
            rollback was refused before anything changed because the application's software keeps data in a folder the
            application does not declare; the operation fails with `HOST_POLICY_DENIED` and only the server
            administrator can fix it, by publishing a version that gives that folder a volume.
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true

    AppStackBackupDto:
      type: object
      required: [id, kind, status, problem, sizeBytes, volumeKeys, copies, startedAt, finishedAt, restore, restorable, incompleteData]
      properties:
        id:
          $ref: "#/components/schemas/AppEntityId"
        kind:
          type: string
          enum: [manual, pre_restore]
          description: "`pre_restore` is the safety backup a restore makes of the data it is about to replace"
        status:
          type: string
          enum: [running, succeeded, partial, failed]
          description: "`partial`: good on at least one destination, failed on another"
        problem:
          type: string
          maxLength: 64
          nullable: true
          description: A problem class or an error code, never free text
        sizeBytes:
          type: integer
          minimum: 0
          nullable: true
        volumeKeys:
          type: array
          items:
            $ref: "#/components/schemas/AppStackKey"
        copies:
          type: array
          description: One per backup destination, by priority; no destination name, address or path
          items:
            type: object
            required: [priority, status, problem]
            properties:
              priority:
                type: integer
                minimum: 1
              status:
                type: string
                enum: [running, succeeded, failed]
              problem:
                type: string
                maxLength: 64
                nullable: true
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        restore:
          type: object
          nullable: true
          description: The last restore that read this backup
          required: [status, problem, at]
          properties:
            status:
              type: string
              enum: [running, succeeded, failed]
            problem:
              type: string
              maxLength: 64
              nullable: true
            at:
              type: string
              format: date-time
              nullable: true
        restorable:
          type: boolean
          description: At least one good copy, of data that still belong to the application
        incompleteData:
          type: boolean
          description: >-
            A backup, `manual` or `pre_restore`, taken while the application's data were half written (see
            `goBackTo`): writing it back leaves them so

    AppStackBackupsDto:
      type: object
      required: [backups, unavailableReason, goBackTo]
      properties:
        backups:
          type: array
          description: Newest first
          items:
            $ref: "#/components/schemas/AppStackBackupDto"
        unavailableReason:
          type: string
          enum: [not_available, no_destination, no_data]
          nullable: true
          description: Why a new backup cannot be asked for now; `null` when it can
        goBackTo:
          allOf:
            - $ref: "#/components/schemas/AppEntityId"
          nullable: true
          description: >-
            While the application's data are half written, that is while the newest action of it that decides (a
            restore that was not cancelled, or another action that succeeded; never a backup or a clean-up) is a
            restore that left them so: the newest good `pre_restore` backup of whole data, the one to restore to go
            back (the nightly clean-up never removes it meanwhile). `null` otherwise, and from the moment any other
            action, a start above all, has succeeded: it took the data as they are. An action under way or failed, and
            a restore cancelled before it ran, change nothing

    AppStackDomainDto:
      type: object
      required: [id, hostname, componentKey, port, status, certificateStatus, certificateProblem, certificateExpiresAt, checkedAt, redirectToDomainId, compression, protection, pathRoutes, removing]
      properties:
        id:
          $ref: "#/components/schemas/AppEntityId"
        hostname:
          type: string
        componentKey:
          $ref: "#/components/schemas/AppStackKey"
        port:
          type: integer
        status:
          type: string
          enum: [pending, active, failed]
        certificateStatus:
          type: string
          enum: [none, requested, active, failed]
        certificateProblem:
          type: string
          nullable: true
        certificateExpiresAt:
          type: string
          format: date-time
          nullable: true
        checkedAt:
          type: string
          format: date-time
          nullable: true
          description: When the DNS was last checked
        redirectToDomainId:
          nullable: true
          description: The web address of the same application this one sends its visitors to
          allOf:
            - $ref: "#/components/schemas/AppEntityId"
        compression:
          type: boolean
        protection:
          type: object
          nullable: true
          required: [username]
          description: Set when the address asks for a user name and a password. The password is never returned
          properties:
            username:
              type: string
        pathRoutes:
          type: array
          items:
            $ref: "#/components/schemas/AppStackDomainPathRoute"
        removing:
          type: boolean
          description: >-
            The address was removed and still answers until the application's route file without it is published. It
            keeps its hostname until then, takes no change, is no redirect destination and counts in no limit; it then
            leaves the list.

    CreateAppStackLinkInput:
      type: object
      additionalProperties: false
      required: [databaseStackId]
      properties:
        databaseStackId:
          $ref: "#/components/schemas/AppEntityId"

    AppStackLinkConnectionDto:
      type: object
      description: Where a connected application reaches the database. It works only from a connected application.
      required: [host, port]
      properties:
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535

    AppStackLinkDto:
      type: object
      required: [id, state, createdAt, databaseStackId, databaseName, databaseKind, applicationStackId, applicationName, connection]
      properties:
        id:
          $ref: "#/components/schemas/AppEntityId"
        state:
          type: string
          enum: [pending, active, removing]
          description: "`pending`: not applied on the server yet. `removing`: a disconnection the server has not confirmed yet"
        createdAt:
          type: string
          format: date-time
        databaseStackId:
          $ref: "#/components/schemas/AppEntityId"
        databaseName:
          type: string
        databaseKind:
          type: string
          description: The name of the database's template
        applicationStackId:
          $ref: "#/components/schemas/AppEntityId"
        applicationName:
          type: string
        connection:
          nullable: true
          description: "`null` when the database is no longer something to connect to"
          allOf:
            - $ref: "#/components/schemas/AppStackLinkConnectionDto"

    AppStackLinksDto:
      type: object
      required: [stackId, role, connection, links, candidates, limit]
      properties:
        stackId:
          $ref: "#/components/schemas/AppEntityId"
        role:
          type: string
          enum: [database, application]
        connection:
          nullable: true
          description: "A database's own address; `null` for an application"
          allOf:
            - $ref: "#/components/schemas/AppStackLinkConnectionDto"
        links:
          type: array
          description: "For a database the applications that use it; for an application the databases it uses"
          items:
            $ref: "#/components/schemas/AppStackLinkDto"
        candidates:
          type: array
          description: "For an application, the customer's databases it can still be connected to; always empty for a database"
          items:
            type: object
            required: [stackId, name, kind]
            properties:
              stackId:
                $ref: "#/components/schemas/AppEntityId"
              name:
                type: string
              kind:
                type: string
        limit:
          type: integer
          minimum: 1
          description: The most links this side can have (4 for an application, 8 for a database)

    AppStackPlanDiffDto:
      type: object
      required: [planHash, fromRevisionId, fromVersionNumber, toTemplateVersionId, toVersionNumber, newRevision, components, volumes, parameters, newSecrets, ingress, downtime, dataRisk]
      properties:
        planHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: What an upgrade or rollback must send back
        fromRevisionId:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AppEntityId"
        fromVersionNumber:
          type: integer
          minimum: 1
          nullable: true
        toTemplateVersionId:
          $ref: "#/components/schemas/AppEntityId"
        toVersionNumber:
          type: integer
          minimum: 1
        newRevision:
          type: boolean
          description: "`false` when a deploy would deploy the current revision again as it is"
        components:
          type: array
          items:
            type: object
            required: [key, change, restart]
            properties:
              key:
                $ref: "#/components/schemas/AppStackKey"
              change:
                $ref: "#/components/schemas/AppStackDiffChange"
              restart:
                type: boolean
        volumes:
          type: array
          description: "`removed` means no longer mounted; the data is kept"
          items:
            type: object
            required: [key, change]
            properties:
              key:
                $ref: "#/components/schemas/AppStackKey"
              change:
                $ref: "#/components/schemas/AppStackDiffChange"
        parameters:
          type: array
          description: Names only, secrets included; never a value
          items:
            type: object
            required: [key, change]
            properties:
              key:
                $ref: "#/components/schemas/AppTemplateParameterKey"
              change:
                $ref: "#/components/schemas/AppStackDiffChange"
        newSecrets:
          type: array
          description: >-
            Upgrade only: the required private values the customer types that the new version brings and the
            application has none of; the upgrade must carry them in `secrets`. Empty for a deploy and a rollback
          items:
            type: object
            required: [key, label]
            properties:
              key:
                $ref: "#/components/schemas/AppTemplateParameterKey"
              label:
                type: string
        ingress:
          type: array
          items:
            type: object
            required: [componentKey, port, change]
            properties:
              componentKey:
                $ref: "#/components/schemas/AppStackKey"
              port:
                type: integer
              change:
                $ref: "#/components/schemas/AppStackDiffChange"
        downtime:
          type: boolean
          description: A component behind a web address restarts or goes away
        dataRisk:
          type: boolean
          description: A component changes while the application has volumes

    AppStackLogLineDto:
      type: object
      required: [at, stream, text]
      properties:
        at:
          type: string
          format: date-time
          nullable: true
        stream:
          type: string
          enum: [stdout, stderr]
        text:
          type: string

    AppStackComponentLogsDto:
      type: object
      required: [componentKey, lines]
      properties:
        componentKey:
          $ref: "#/components/schemas/AppStackKey"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/AppStackLogLineDto"

    AppStackComponentHealthDto:
      type: object
      required: [componentKey, health, observedAt, stale, source]
      properties:
        componentKey:
          $ref: "#/components/schemas/AppStackKey"
        health:
          $ref: "#/components/schemas/AppStackComponentHealth"
        observedAt:
          type: string
          format: date-time
          nullable: true
        stale:
          type: boolean
          description: The last observation is older than five minutes (health then reads `unknown`)
        source:
          type: string
          enum: [tcp, http, running_state]
          description: The component's health check, or `running_state` when it declares none

    AppStackTaskRunId:
      type: string
      pattern: "^srun_[0-9a-f]{24}$"

    AppStackTaskSchedule:
      description: When a task runs by itself. Whole hours in UTC; `weekday` is 1 (Monday) to 7 (Sunday)
      oneOf:
        - type: object
          additionalProperties: false
          required: [frequency]
          properties:
            frequency:
              type: string
              enum: [never]
        - type: object
          additionalProperties: false
          required: [frequency]
          properties:
            frequency:
              type: string
              enum: [hourly]
        - type: object
          additionalProperties: false
          required: [frequency, hourUtc]
          properties:
            frequency:
              type: string
              enum: [daily]
            hourUtc:
              type: integer
              minimum: 0
              maximum: 23
        - type: object
          additionalProperties: false
          required: [frequency, weekday, hourUtc]
          properties:
            frequency:
              type: string
              enum: [weekly]
            weekday:
              type: integer
              minimum: 1
              maximum: 7
            hourUtc:
              type: integer
              minimum: 0
              maximum: 23

    AppStackTaskRunStatus:
      type: string
      enum: [queued, running, succeeded, failed, timed_out, not_started, unknown]
      description: "`unknown`: nobody knows how the run ended; it is never started again by itself"

    AppStackTaskRunSummaryDto:
      type: object
      required: [id, taskKey, trigger, status, problem, requestedAt, startedAt, endedAt]
      properties:
        id:
          $ref: "#/components/schemas/AppStackTaskRunId"
        taskKey:
          $ref: "#/components/schemas/AppStackKey"
        trigger:
          type: string
          enum: [manual, schedule]
        status:
          $ref: "#/components/schemas/AppStackTaskRunStatus"
        problem:
          type: string
          nullable: true
          enum: [component_not_running, cannot_run_tasks, task_gone, unavailable, refused, outcome_lost, busy, null]
          description: Why a run did not start (`busy`, another action on the application was queued or running when its turn came), or `outcome_lost` for an `unknown` one
        requestedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true

    AppStackTaskRunDto:
      allOf:
        - $ref: "#/components/schemas/AppStackTaskRunSummaryDto"
        - type: object
          required: [output, outputTruncated]
          properties:
            output:
              type: string
              maxLength: 16384
              description: The last lines the run printed, secrets masked; empty while it is queued or running
            outputTruncated:
              type: boolean

    AppStackTaskRunsDto:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/AppStackTaskRunDto"

    AppStackTaskDto:
      type: object
      required: [key, label, description, componentKey, schedule, nextRunAt, skipped, lastRun]
      properties:
        key:
          $ref: "#/components/schemas/AppStackKey"
        label:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 200
        componentKey:
          $ref: "#/components/schemas/AppStackKey"
        schedule:
          $ref: "#/components/schemas/AppStackTaskSchedule"
        nextRunAt:
          type: string
          format: date-time
          nullable: true
          description: The next time the schedule asks for a run; `null` for "never"
        skipped:
          type: object
          nullable: true
          required: [at, reason, pending]
          description: The latest scheduled time that was not run
          properties:
            at:
              type: string
              format: date-time
            reason:
              type: string
              enum: [busy, not_running, missed]
            pending:
              type: boolean
              description: True while the time is still tried (within 30 minutes of it); false once it was given up
        lastRun:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AppStackTaskRunSummaryDto"

    AppStackTasksDto:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/AppStackTaskDto"

    AppStackTaskRunAcceptedEnvelope:
      type: object
      required: [data, links]
      properties:
        data:
          type: object
          required: [runId, operationId, status]
          properties:
            runId:
              $ref: "#/components/schemas/AppStackTaskRunId"
            operationId:
              type: string
              minLength: 1
              maxLength: 128
            status:
              $ref: "#/components/schemas/AppStackTaskRunStatus"
        links:
          type: object
          required: [runs, operation]
          properties:
            runs:
              type: string
            operation:
              type: string

    SiteActionInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [start, stop, restart, retry]

    ChangeSiteRuntimeInput:
      type: object
      required: [phpVersion]
      properties:
        phpVersion:
          type: string
          enum: ["8.3", "8.4", "8.5"]

    DeleteSiteInput:
      type: object
      required: [confirmName]
      properties:
        confirmName:
          type: string

    SiteLogLineDto:
      type: object
      required: [at, stream, text]
      properties:
        at:
          type: string
          format: date-time
          nullable: true
        stream:
          type: string
          enum: [stdout, stderr]
        text:
          type: string

    SiteFilePath:
      type: string
      maxLength: 1024
      description: >-
        Path relative to the site's files (`""` is the root), `/`-separated, and traveling
        in the query or request body. Consecutive slashes and a trailing slash are
        normalized; leading `/`, `.` or `..` segments, segments starting with `.htpanel-`,
        control characters (`0x00`-`0x1F`, `0x7F`), and segments exceeding 255 UTF-8 bytes
        are rejected.

    SiteFileItemPath:
      type: string
      minLength: 1
      maxLength: 1024
      description: >-
        Non-empty relative path to an entry inside the site's files (`""` is rejected).
        Follows the same normalization and segment rules as `SiteFilePath`.

    SiteFileZipPath:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: "\\.[zZ][iI][pP]$"
      description: >-
        Non-empty relative path ending with `.zip` (case-insensitive) inside the site's
        files. Follows the same rules as `SiteFileItemPath`.

    SiteFileErrorReason:
      type: string
      description: Closed refusal reason token returned in `error.details[].reason` for file operations
      enum:
        - invalid_path
        - not_found
        - exists
        - not_a_directory
        - is_a_directory
        - protected
        - too_large
        - archive_limit
        - upload_mismatch
        - not_a_zip
        - disk_full
        - archive_unsafe
        - zip_unavailable
        - not_ready

    SiteFileEntryDto:
      type: object
      additionalProperties: false
      required: [name, kind, size, modifiedAt, writable]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        kind:
          type: string
          enum: [file, dir, link, other]
        size:
          type: integer
          minimum: 0
        modifiedAt:
          type: string
          format: date-time
        writable:
          type: boolean

    SiteFileListDto:
      type: object
      additionalProperties: false
      required: [entries, truncated]
      properties:
        entries:
          type: array
          description: Directory entries (sorted directories-first, capped at 5,000 per listing)
          items:
            $ref: "#/components/schemas/SiteFileEntryDto"
        truncated:
          type: boolean

    SiteFileChunkDto:
      type: object
      additionalProperties: false
      required: [dataBase64, size, eof]
      properties:
        dataBase64:
          type: string
          description: Base64-encoded chunk bytes (at most 524,288 bytes / 512 KiB before base64)
        size:
          type: integer
          minimum: 0
          description: Total file size in bytes
        eof:
          type: boolean

    SiteFileWriteRequest:
      type: object
      additionalProperties: false
      required: [path, uploadId, offset, dataBase64, final, overwrite]
      description: >-
        Chunked file upload payload. Uploads are addressed by `uploadId` and `offset` and
        are safe to resend. A chunk is at most 512 KiB (524,288 bytes) before base64;
        maximum total file size is 2 GiB (2,147,483,648 bytes).
      properties:
        path:
          $ref: "#/components/schemas/SiteFileItemPath"
        uploadId:
          type: string
          minLength: 16
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]{16,64}$"
        offset:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        dataBase64:
          type: string
          maxLength: 699052
          pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
          description: "Base64-encoded chunk bytes (at most 524,288 bytes / 512 KiB before base64; empty allowed on `final: true`)"
        final:
          type: boolean
        overwrite:
          type: boolean

    SiteFileWriteResultDto:
      type: object
      additionalProperties: false
      required: [received]
      properties:
        received:
          type: integer
          minimum: 0
          description: Staged byte count after writing the chunk (or final file size when `final` is `true`)

    SiteFileFolderRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          $ref: "#/components/schemas/SiteFileItemPath"

    SiteFileMoveRequest:
      type: object
      additionalProperties: false
      required: [from, to]
      description: "`to` must differ from `from` and cannot lie inside `from/`."
      properties:
        from:
          $ref: "#/components/schemas/SiteFileItemPath"
        to:
          $ref: "#/components/schemas/SiteFileItemPath"

    SiteFileDeleteRequest:
      type: object
      additionalProperties: false
      required: [paths]
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SiteFileItemPath"

    SiteFileArchiveRequest:
      type: object
      additionalProperties: false
      required: [paths, to]
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SiteFileItemPath"
        to:
          $ref: "#/components/schemas/SiteFileZipPath"

    SiteFileExtractRequest:
      type: object
      additionalProperties: false
      required: [path, to]
      properties:
        path:
          $ref: "#/components/schemas/SiteFileZipPath"
        to:
          $ref: "#/components/schemas/SiteFilePath"

    CreateSiteSftpUserRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 16
          pattern: "^[a-z0-9]{1,16}$"
          description: User suffix (trimmed and lowercased server-side) appended to `s<sha256(siteId)[0..8]>_`

    SiteSftpUserDto:
      type: object
      additionalProperties: false
      required: [id, username, createdAt, passwordChangedAt]
      properties:
        id:
          type: string
        username:
          type: string
          pattern: "^[a-z][a-z0-9]{1,14}_[a-z0-9]{1,16}$"
        createdAt:
          type: string
          format: date-time
        passwordChangedAt:
          type: string
          format: date-time

    SiteSftpDto:
      type: object
      additionalProperties: false
      required: [available, host, port, hostKeyFingerprint, users]
      properties:
        available:
          type: boolean
        host:
          type: string
          nullable: true
        port:
          type: integer
          minimum: 1
          maximum: 65535
          nullable: true
        hostKeyFingerprint:
          type: string
          nullable: true
        users:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/SiteSftpUserDto"

    SiteSftpUserCreatedDto:
      type: object
      additionalProperties: false
      required: [user, temporaryPassword]
      properties:
        user:
          $ref: "#/components/schemas/SiteSftpUserDto"
        temporaryPassword:
          type: string
          minLength: 20
          description: One-time temporary password returned only upon user creation

    SiteSftpPasswordResetDto:
      type: object
      additionalProperties: false
      required: [temporaryPassword]
      properties:
        temporaryPassword:
          type: string
          minLength: 20
          description: One-time temporary password returned only upon password reset

    CreateSiteDatabaseRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 16
          pattern: "^[a-z0-9][a-z0-9_]{0,15}$"
          description: Lowercase suffix appended to the site's database prefix (`<prefix>_<name>`)

    CreateSiteDatabaseUserRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 16
          pattern: "^[a-z0-9][a-z0-9_]{0,15}$"
          description: Lowercase suffix appended to the site's database prefix (`<prefix>_<name>`)

    SiteDatabaseDto:
      type: object
      additionalProperties: false
      required: [name, primary, sizeBytes]
      properties:
        name:
          type: string
          minLength: 1
        primary:
          type: boolean
        sizeBytes:
          type: integer
          format: int64
          minimum: 0

    SiteDatabaseUserDto:
      type: object
      additionalProperties: false
      required: [name, primary, databases]
      properties:
        name:
          type: string
          minLength: 1
        primary:
          type: boolean
        databases:
          type: array
          items:
            type: string
            minLength: 1

    SiteDatabasesDto:
      type: object
      additionalProperties: false
      required: [prefix, databases, users, limits, phpMyAdminAvailable]
      properties:
        prefix:
          type: string
          minLength: 1
        databases:
          type: array
          items:
            $ref: "#/components/schemas/SiteDatabaseDto"
        users:
          type: array
          items:
            $ref: "#/components/schemas/SiteDatabaseUserDto"
        limits:
          type: object
          additionalProperties: false
          required: [databases, users]
          properties:
            databases:
              type: integer
              minimum: 1
            users:
              type: integer
              minimum: 1
        phpMyAdminAvailable:
          type: boolean

    SiteDatabaseCreatedDto:
      type: object
      additionalProperties: false
      required: [database]
      properties:
        database:
          $ref: "#/components/schemas/SiteDatabaseDto"

    SiteDatabaseUserCreatedDto:
      type: object
      additionalProperties: false
      required: [user, temporaryPassword]
      properties:
        user:
          $ref: "#/components/schemas/SiteDatabaseUserDto"
        temporaryPassword:
          type: string
          minLength: 24
          pattern: "^[A-Za-z0-9]{24,}$"
          description: One-time temporary password returned only upon database user creation

    SiteDatabasePasswordResetDto:
      type: object
      additionalProperties: false
      required: [temporaryPassword]
      properties:
        temporaryPassword:
          type: string
          minLength: 24
          pattern: "^[A-Za-z0-9]{24,}$"
          description: One-time temporary password returned only upon password reset

    SiteDatabaseSignOnDto:
      type: object
      additionalProperties: false
      required: [username, temporaryPassword]
      properties:
        username:
          type: string
          pattern: "^pma_[0-9a-f]{12}$"
          description: Dedicated per-site MariaDB sign-on account (`pma_<hex>`)
        temporaryPassword:
          type: string
          minLength: 24
          pattern: "^[A-Za-z0-9]{24,}$"
          description: One-time phpMyAdmin sign-on password consumed by the web BFF only

    SiteSummaryDto:
      type: object
      required: [id, organizationId, hostAllocationId, name, slug, status, phpVersion, siteType, createdAt, updatedAt]
      properties:
        id:
          type: string
        organizationId:
          type: string
        hostAllocationId:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [ready, deploying, degraded, stopped, maintenance]
        phpVersion:
          type: string
          nullable: true
          enum: ["8.3", "8.4", "8.5"]
        siteType:
          type: string
          nullable: true
          enum: ["wordpress"]
          description: The type of a managed site; null for a site made through the generic service routes.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SiteDetailDto:
      allOf:
        - $ref: "#/components/schemas/SiteSummaryDto"
        - type: object
          required: [services, domains, driftSummary]
          properties:
            services:
              type: array
              items:
                $ref: "#/components/schemas/ServiceInstanceDto"
            domains:
              type: array
              items:
                $ref: "#/components/schemas/DomainDto"
            driftSummary:
