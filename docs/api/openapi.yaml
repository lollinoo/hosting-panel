          nullable: true
        userAgent:
          type: string
          nullable: true
        details:
          type: object
        timestamp:
          type: string
          format: date-time

    AdminHealthDto:
      type: object
      additionalProperties: false
      required: [generatedAt, components, siteContainers, disks, hostServices]
      properties:
        generatedAt:
          type: string
          format: date-time
        components:
          type: array
          description: Exactly eleven entries, one per part, in the order of the `component` enum
          minItems: 11
          maxItems: 11
          items:
            type: object
            additionalProperties: false
            required: [component, state, reason, observedAt]
            properties:
              component:
                type: string
                enum: [api, web, database, executor, host_agent, docker_engine, ingress_proxy, shared_database, phpmyadmin, sftp, mail_relay]
              state:
                type: string
                enum: [ok, degraded, down, not_in_use, unknown]
              reason:
                type: string
                nullable: true
                enum: [not_reporting, runtime_disabled, engine_unreachable, stopped, restarting, missing]
              observedAt:
                type: string
                format: date-time
                nullable: true
        siteContainers:
          type: array
          description: >-
            One entry per managed site that has a web service; a site without one (none created
            yet) is not listed
          items:
            type: object
            additionalProperties: false
            required: [siteId, siteName, organizationName, desired, observed, driftReason, restartCount, observedAt, stale]
            properties:
              siteId:
                type: string
              siteName:
                type: string
              organizationName:
                type: string
                nullable: true
                description: '`null` for sites held by the platform'
              desired:
                type: string
                enum: [running, stopped]
              observed:
                type: string
                enum: [running, stopped, degraded, missing, unknown]
                description: >-
                  What the last look saw. A container seen `running` whose not-running clock runs
                  (its restart count rose less than two minutes ago) is `degraded`; one crash alone
                  shows `degraded` for two minutes. The same value is used by `site_container_down`
              driftReason:
                type: string
                nullable: true
                enum: [out_of_band_modified, status_mismatch, revision_mismatch]
              restartCount:
                type: integer
                minimum: 0
                nullable: true
              observedAt:
                type: string
                format: date-time
                nullable: true
              stale:
                type: boolean
                description: No observation, or the last one is older than five minutes
        disks:
          type: array
          description: >-
            One entry per file system; places on the same file system share an entry. A place that
            does not exist has no entry; an agent older than M5b sends none.
          items:
            type: object
            additionalProperties: false
            required: [paths, usedBytes, totalBytes, usedPercent, observedAt]
            properties:
              paths:
                type: array
                minItems: 1
                items:
                  type: string
                  enum: [panel_data, docker_data, database_data, root]
              usedBytes:
                type: string
                pattern: '^\d+$'
                description: Bytes as a decimal string; blocks reserved for root count as used
              totalBytes:
                type: string
                pattern: '^\d+$'
              usedPercent:
                type: integer
                minimum: 0
                maximum: 100
                description: Rounded down
              observedAt:
                type: string
                format: date-time
        hostServices:
          type: array
          nullable: true
          description: >-
            The four panel services as systemd reports them now, in the order api, web, executor,
            host_agent; `null` when the host agent is disabled, did not answer within 3 seconds or
            sent something malformed
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/HostServiceStatusDto"

    HostServiceStatusDto:
      type: object
      additionalProperties: false
      required: [service, active, activeState, since, restarts]
      properties:
        service:
          type: string
          enum: [api, web, executor, host_agent]
        active:
          type: boolean
          description: The unit's state is `active`
        activeState:
          type: string
          minLength: 1
          maxLength: 32
          description: systemd's own word (for example `active`, `activating`, `failed`)
        since:
          type: string
          format: date-time
          nullable: true
          description: When the unit entered its active state; `null` when it never did
        restarts:
          type: integer
          minimum: 0
          description: Restarts systemd made by itself since the unit was last started by hand or at boot

    AdminAlertDto:
      type: object
      additionalProperties: false
      required: [severity, subject, since, kind, details]
      description: >-
        `critical` kinds: `disk_high`, `component_down`, `site_container_down`,
        `restore_undo_incomplete`; every other kind is `warning`, except `manual_certificate_expiring`,
        which is `warning` at tier `warning` and `critical` at tiers `critical` and `expired`. `details` has a fixed shape per
        `kind` (listed under `details`) and no other field.
      properties:
        severity:
          type: string
          enum: [warning, critical]
        subject:
          type: string
          minLength: 1
        since:
          type: string
          format: date-time
          nullable: true
        kind:
          type: string
          enum: [disk_high, certificate_expiring, certificate_not_issued, panel_certificate_expiring, manual_certificate_expiring, backup_failed, panel_backup_failed, backup_storage_test_failed, backup_target_space_low, backup_site_without_target, backup_partial, component_down, site_container_down, restore_undo_incomplete, restore_stuck, operation_unknown, operation_stuck]
        details:
          type: object
          description: >-
            disk_high `{paths, usedPercent}`;
            certificate_expiring `{siteId, siteName, hostname, expiresAt|null, problem|null}`;
            certificate_not_issued `{siteId, siteName, hostname, problem|null}`;
            panel_certificate_expiring `{hostname, expiresAt}`;
            manual_certificate_expiring `{siteId|null, siteName|null, certificateId, certificateName, notAfter, tier: warning|critical|expired}`;
            backup_failed `{siteId, siteName, failedAt}`;
            panel_backup_failed `{failedAt}`;
            backup_storage_test_failed `{testedAt, targetId, targetKind: s3|local, problem|null}`;
            backup_target_space_low `{targetId, targetKind: local, availableBytes, totalBytes, testedAt}`;
            backup_site_without_target `{siteId, siteName}`;
            backup_partial `{siteId, siteName, backupId, at}`;
            component_down `{component, state: down|degraded, reason|null}`;
            site_container_down `{siteId, siteName, observed}`;
            restore_undo_incomplete `{siteId, siteName, backupId, failedAt|null}`;
            restore_stuck `{operationId, siteId|null, siteName|null, startedAt}`;
            operation_unknown and operation_stuck `{operationId, kind, siteId|null, siteName|null}`.
            `problem` is one of `rate_limited`, `port_80_blocked`, `not_pointing`, `caa_blocked`,
            `dns_provider`, `other`; `kind` inside `details` is an operation kind.
          oneOf:
            - title: disk_high
              type: object
              additionalProperties: false
              required: [paths, usedPercent]
              properties:
                paths: { type: array, minItems: 1, items: { type: string, enum: [panel_data, docker_data, database_data, root] } }
                usedPercent: { type: integer, minimum: 0, maximum: 100 }
            - title: certificate_expiring
              type: object
              additionalProperties: false
              required: [siteId, siteName, hostname, expiresAt, problem]
              properties:
                siteId: { type: string }
                siteName: { type: string }
                hostname: { type: string }
                expiresAt: { type: string, format: date-time, nullable: true }
                problem: { type: string, nullable: true, enum: [rate_limited, port_80_blocked, not_pointing, caa_blocked, dns_provider, other] }
            - title: certificate_not_issued
              type: object
              additionalProperties: false
              required: [siteId, siteName, hostname, problem]
              properties:
                siteId: { type: string }
                siteName: { type: string }
                hostname: { type: string }
                problem: { type: string, nullable: true, enum: [rate_limited, port_80_blocked, not_pointing, caa_blocked, dns_provider, other] }
            - title: panel_certificate_expiring
              type: object
              additionalProperties: false
              required: [hostname, expiresAt]
              properties:
                hostname: { type: string }
                expiresAt: { type: string, format: date-time }
            - title: manual_certificate_expiring
              type: object
              description: >-
                An imported certificate version in use is within 14 days of `notAfter` (`warning`),
                within 7 days (`critical`) or past it (`expired`); `severity` is `warning` at tier
                `warning` and `critical` otherwise. `siteId` and `siteName` are null when the
                certificate is not assigned to a site
              additionalProperties: false
              required: [siteId, siteName, certificateId, certificateName, notAfter, tier]
              properties:
                siteId: { type: string, nullable: true }
                siteName: { type: string, nullable: true }
                certificateId: { type: string }
                certificateName: { type: string }
                notAfter: { type: string, format: date-time }
                tier: { type: string, enum: [warning, critical, expired] }
            - title: backup_failed
              type: object
              additionalProperties: false
              required: [siteId, siteName, failedAt]
              properties:
                siteId: { type: string }
                siteName: { type: string }
                failedAt: { type: string, format: date-time }
            - title: panel_backup_failed
              type: object
              additionalProperties: false
              required: [failedAt]
              properties:
                failedAt: { type: string, format: date-time }
            - title: backup_storage_test_failed
              type: object
              additionalProperties: false
              description: >-
                The last test of an enabled backup target failed. `subject` is the target id;
                `problem` is the problem name of that test, or null
              required: [testedAt, targetId, targetKind, problem]
              properties:
                testedAt: { type: string, format: date-time }
                targetId: { type: string, pattern: "^bkt_[0-9a-f]{32}$" }
                targetKind: { type: string, enum: [s3, local] }
                problem: { type: string, nullable: true, pattern: "^[a-z][a-z_]{0,63}$" }
            - title: backup_target_space_low
              type: object
              description: >-
                The last test of an enabled local target passed but its free space is below the
                larger of 1 GiB and a tenth of the total. `subject` is the target id; no path leaves
                the panel
              additionalProperties: false
              required: [targetId, targetKind, availableBytes, totalBytes, testedAt]
              properties:
                targetId: { type: string, pattern: "^bkt_[0-9a-f]{32}$" }
                targetKind: { type: string, enum: [local] }
                availableBytes: { type: integer, minimum: 0 }
                totalBytes: { type: integer, minimum: 0 }
                testedAt: { type: string, format: date-time }
            - title: backup_site_without_target
              type: object
              description: >-
                A site the nightly run would back up has no usable target, while some other target
                is usable. `subject` is the site id and `since` is null
              additionalProperties: false
              required: [siteId, siteName]
              properties:
                siteId: { type: string }
                siteName: { type: string }
            - title: backup_partial
              type: object
              description: >-
                The latest backup attempt of the site ended `partial`: one of its two copies failed,
                the other succeeded. `subject` is the site id and `since` is that attempt's time; the
                alert is raised only while the latest attempt is `partial` (`backup_failed` stays for
                `failed`)
              additionalProperties: false
              required: [siteId, siteName, backupId, at]
              properties:
                siteId: { type: string }
                siteName: { type: string }
                backupId: { type: string }
                at: { type: string, format: date-time }
            - title: component_down
              type: object
              additionalProperties: false
              required: [component, state, reason]
              properties:
                component: { type: string, enum: [api, web, database, executor, host_agent, docker_engine, ingress_proxy, shared_database, phpmyadmin, sftp, mail_relay] }
                state: { type: string, enum: [down, degraded] }
                reason: { type: string, nullable: true, enum: [not_reporting, runtime_disabled, engine_unreachable, stopped, restarting, missing] }
            - title: site_container_down
              type: object
              description: >-
                The service is wanted running, the look is fresh, the site is not deploying and not
                in maintenance, and for at least five minutes (`SITE_CONTAINER_DOWN_GRACE_MS`) the
                container has either not been running or been running with a restart count that
                rose less than two minutes earlier (`SITE_RESTART_QUIET_MS`; Docker raises the
                count when the container ends). The clock stops at the first look that sees the
                container running with no rise in the last two minutes; a lower count (a new
                container, a deploy, the panel's Restart) forgets the rise, and a wanted stop sets
                the clock back to nothing. So a crash loop whose runs last less than two minutes
                alerts after five minutes, one crash alone never alerts, and a loop whose runs last
                longer than two minutes does not alert (Health shows it restarting for two minutes
                after each crash). After a restore longer than five minutes the alert can show for
                one look (up to 15 seconds). `since` is when the clock started; `observed` is the
                site's value on Health. The way back is Restart, not Start; when `observed` is
                `missing` Restart fails (it needs a container) and a PHP version change on the
                site's page, a deploy, creates the container again
              additionalProperties: false
              required: [siteId, siteName, observed]
              properties:
                siteId: { type: string }
                siteName: { type: string }
                observed: { type: string, enum: [running, stopped, degraded, missing, unknown] }
            - title: restore_undo_incomplete
              type: object
              additionalProperties: false
              required: [siteId, siteName, backupId, failedAt]
              properties:
                siteId: { type: string }
                siteName: { type: string }
                backupId: { type: string }
                failedAt: { type: string, format: date-time, nullable: true }
            - title: restore_stuck
              type: object
              additionalProperties: false
              required: [operationId, siteId, siteName, startedAt]
              properties:
                operationId: { type: string }
                siteId: { type: string, nullable: true }
                siteName: { type: string, nullable: true }
                startedAt: { type: string, format: date-time }
            - title: operation_unknown or operation_stuck
              type: object
              additionalProperties: false
              required: [operationId, kind, siteId, siteName]
              properties:
                operationId: { type: string }
                kind: { type: string, enum: [service.deploy, service.restart, service.stop, site.deploy, site.provision, site.delete, site.reassign, site.domains, site.files.archive, site.files.extract, host.maintenance, host.security, host.allocate, site.backups.create, site.backups.prune, site.backups.restore, site.backups.download, panel.backups.create, panel.container.restart, site.wordpress.inspect, site.wordpress.update, site.wordpress.import, host.job, panel.container.apply, site.tls.apply, stack.deploy, stack.start, stack.stop, stack.restart, stack.upgrade, stack.rollback, stack.delete, stack.backup, stack.restore, stack.prune, stack.task] }
                siteId: { type: string, nullable: true }
                siteName: { type: string, nullable: true }

    EncryptedSecretMetadataDto:
      type: object
      description: Write-only encrypted secret metadata (never includes plaintext or ciphertext)
      required:
        - id
        - organizationId
        - siteId
        - secretKey
        - keyVersion
        - version
        - createdByUserId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        siteId:
          type: string
          nullable: true
        secretKey:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]{0,127}$"
        keyVersion:
          type: string
        version:
          type: integer
          minimum: 1
        createdByUserId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpsertEncryptedSecretInput:
      type: object
      required: [secretKey, value]
      properties:
        secretKey:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]{0,127}$"
        value:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
        siteId:
          type: string
          nullable: true

    HostDaemonHeartbeatDto:
      type: object
      required:
        - hostId
        - component
        - status
        - version
        - lastSeenAt
        - telemetrySnapshot
      properties:
        hostId:
          type: string
        component:
          type: string
          enum: [docker_executor, host_agent]
        status:
          type: string
          enum: [online, degraded, offline]
        version:
          type: string
        lastSeenAt:
          type: string
          format: date-time
        telemetrySnapshot:
          type: object

    HostTelemetryDto:
      type: object
      required:
        - hostId
        - cpuUsagePercent
        - memoryUsedBytes
        - memoryTotalBytes
        - storageUsedBytes
        - storageTotalBytes
        - uptimeSeconds
        - kernelVersion
        - dockerEngineReachable
        - collectedAt
      properties:
        hostId:
          type: string
        cpuUsagePercent:
          type: number
          minimum: 0
          maximum: 100
        memoryUsedBytes:
          type: string
        memoryTotalBytes:
          type: string
        storageUsedBytes:
          type: string
        storageTotalBytes:
          type: string
        uptimeSeconds:
          type: number
          minimum: 0
        kernelVersion:
          type: string
        dockerEngineReachable:
          type: boolean
        collectedAt:
          type: string
          format: date-time

    AsyncAcceptedData:
      type: object
      required: [operationId, status, resourceId, submittedAt]
      properties:
        operationId:
          type: string
        status:
          type: string
          enum:
            - queued
            - processing
            - accepted
            - reconciling
            - succeeded
            - failed
            - unknown
            - cancelled
        resourceId:
          type: string
        submittedAt:
          type: string
          format: date-time

    AsyncAcceptedLinks:
      type: object
      required: [self]
      properties:
        self:
          type: string

    AsyncAcceptedEnvelope:
      type: object
      required: [data, links]
      properties:
        data:
          $ref: "#/components/schemas/AsyncAcceptedData"
        links:
          $ref: "#/components/schemas/AsyncAcceptedLinks"

    OperationTimelineStep:
      type: object
      required: [id, key, label, status, message, startedAt, completedAt]
      properties:
        id:
          type: string
        key:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [pending, running, succeeded, failed, cancelled, skipped, unknown]
        message:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    RestartInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the restart is needed; trimmed first; kept in the audit row; a reason holding U+0000 is refused (`VALIDATION_ERROR`)

    TerminalOpenInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
          description: The current six-digit code from the caller's authenticator app

    TerminalWriteInput:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input:
          type: string
          minLength: 1
          description: Text sent to the shell as typed, at most 4096 UTF-8 bytes

    TerminalReadInput:
      type: object
      additionalProperties: false
      required: [cursor]
      properties:
        cursor:
          type: integer
          minimum: 0
          description: The `cursor` of the previous read; 0 for the first

    TerminalSessionDto:
      type: object
      additionalProperties: false
      required: [sessionId, siteId, containerName, openedAt, expiresAt]
      properties:
        sessionId:
          type: string
        siteId:
          type: string
        containerName:
          type: string
        openedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: 30 minutes after `openedAt`; the session ends then

    AppTerminalSessionDto:
      type: object
      additionalProperties: false
      required: [sessionId, stackId, componentKey, containerName, openedAt, expiresAt]
      properties:
        sessionId:
          type: string
        stackId:
          $ref: "#/components/schemas/AppEntityId"
        componentKey:
          $ref: "#/components/schemas/AppStackKey"
        containerName:
          type: string
          description: The name the panel derives for the component's container; never a Docker id
        openedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: 30 minutes after `openedAt`; the session ends then

    TerminalReadDto:
      type: object
      additionalProperties: false
      required: [output, cursor, dropped, ended]
      properties:
        output:
          type: string
        cursor:
          type: integer
          minimum: 0
          description: Pass it to the next read
        dropped:
          type: boolean
          description: Older output was dropped (the executor keeps the last 256 KiB)
        ended:
          type: object
          nullable: true
          additionalProperties: false
          required: [reason, at]
          properties:
            reason:
              type: string
              enum: [closed, shell_exited, idle, time_limit, container_gone, executor_gone, not_started]
            at:
              type: string
              format: date-time

    FirewallDto:
      type: object
      additionalProperties: false
      required: [baseRules, readAt, hostId, staticRules, ports, blocks]
      properties:
        baseRules:
          type: string
          enum: [current, outdated, absent, unmanaged, unreadable, disabled]
          description: >-
            `current` the base rules are in place; `outdated` an older version is; `absent` none
            are; `unmanaged` the server was installed without the panel's firewall
            (`--skip-firewall`): the panel changes nothing there and an apply fails; `unreadable` the
            host agent did not answer; `disabled` the agent is off
        readAt:
          type: string
          format: date-time
          nullable: true
          description: When the kernel's table was read; `null` when it was not
        hostId:
          type: string
          nullable: true
          description: The server's id, for `POST /v1/hosts/{hostId}/security`
        staticRules:
          type: array
          description: What the base rules always allow; not changeable here
          items:
            type: object
            additionalProperties: false
            required: [key, ports]
            properties:
              key:
                type: string
                enum: [ssh, web, panel, icmp, replies]
              ports:
                type: array
                items:
                  type: integer
        ports:
          type: array
          description: The six ports of the safe list, always all of them
          items:
            type: object
            additionalProperties: false
            required: [name, port, open, inForce]
            properties:
              name:
                type: string
                enum: [http_alt, https_alt, node_exporter, zabbix_agent, checkmk_agent, nrpe]
              port:
                type: integer
              open:
                type: boolean
                description: What the panel stored
              inForce:
                type: boolean
                nullable: true
                description: The kernel agrees with `open`; `null` unless `baseRules` is `current`
        blocks:
          type: array
          description: Newest first
          items:
            type: object
            additionalProperties: false
            required: [id, address, family, note, createdAt, inForce]
            properties:
              id:
                type: string
                pattern: "^fwb_[0-9a-f]{32}$"
              address:
                type: string
                description: Address or range in its short form
                example: 203.0.113.0/24
              family:
                type: string
                enum: [ipv4, ipv6]
              note:
                type: string
                nullable: true
                maxLength: 200
              createdAt:
                type: string
                format: date-time
              inForce:
                type: boolean
                nullable: true
                description: The kernel holds the block; `null` unless `baseRules` is `current`

    FirewallBlockInput:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        address:
          type: string
          maxLength: 64
          description: >-
            One IPv4 or IPv6 address, or a range with a prefix (IPv4 /16 to /32, IPv6 /32 to /128)
          example: 192.0.2.0/24
        note:
          type: string
          nullable: true
          maxLength: 200
          description: Why; no control characters. Empty is stored as `null`

    UpdatesDto:
      type: object
      additionalProperties: false
      required: [panel, components, sites, sitesTotal]
      properties:
        panel:
          type: object
          additionalProperties: false
          required: [installedVersion, check, running, last]
          properties:
            installedVersion:
              type: string
              nullable: true
              pattern: '^\d+\.\d+\.\d+$'
            check:
              type: object
              additionalProperties: false
              required: [state, latestVersion, checkedAt]
              properties:
                state:
                  type: string
                  enum: [never_checked, up_to_date, newer, no_release, failed]
                latestVersion:
                  type: string
                  nullable: true
                  pattern: '^\d+\.\d+\.\d+$'
                checkedAt:
                  type: string
                  format: date-time
                  nullable: true
            running:
              type: object
              nullable: true
              additionalProperties: false
              required: [operationId]
              properties:
                operationId:
                  type: string
            last:
              type: object
              nullable: true
              additionalProperties: false
              required: [operationId, result, endedAt]
              properties:
                operationId:
                  type: string
                result:
                  $ref: "#/components/schemas/HostJobResult"
                endedAt:
                  type: string
                  format: date-time
        components:
          type: array
          description: The five panel containers, in this order
          minItems: 5
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [component, expected, imageCurrent, runningOperationId]
            properties:
              component:
                type: string
                enum: [ingress_proxy, shared_database, phpmyadmin, sftp, mail_relay]
              expected:
                type: boolean
                nullable: true
                description: The panel needs this container now; `null` when nothing was seen
              imageCurrent:
                type: boolean
                nullable: true
                description: The container runs the image this release pins; `null` when nothing was seen
              runningOperationId:
                type: string
                nullable: true
                description: A `panel.container.apply` of this container still queued or running
        sites:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [siteId, siteName, organizationName, phpVersion, stopped]
            properties:
              siteId:
                type: string
              siteName:
                type: string
              organizationName:
                type: string
                nullable: true
                description: '`null` for sites held by the platform'
              phpVersion:
                type: string
                enum: ["8.3", "8.4", "8.5"]
              stopped:
                type: boolean
        sitesTotal:
          type: integer
          minimum: 0

    HostJobResult:
      type: string
      enum: [succeeded, updated, already_current, rolled_back, rollback_unhealthy, failed, not_started]

    OsPackagesDto:
      type: object
      additionalProperties: false
      required: [packages, rebootRequired, canUpgrade, listsReadAt, running]
      properties:
        packages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, installedVersion, newVersion, origin]
            properties:
              name:
                type: string
                minLength: 1
              installedVersion:
                type: string
                minLength: 1
              newVersion:
                type: string
                minLength: 1
              origin:
                type: string
                enum: [security, distribution, other]
        rebootRequired:
          type: boolean
        canUpgrade:
          type: boolean
        listsReadAt:
          type: string
          format: date-time
          nullable: true
        running:
          type: object
          nullable: true
          additionalProperties: false
          required: [operationId, job]
          properties:
            operationId:
              type: string
            job:
              type: string
              enum: [os_refresh, os_upgrade]

    HostJobAccepted:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [operationId]
          properties:
            operationId:
              type: string

    ComponentApplyAccepted:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [component, operationId]
          properties:
            component:
              type: string
              enum: [ingress_proxy, shared_database, phpmyadmin, sftp, mail_relay]
            operationId:
              type: string
              nullable: true
              description: '`null` for `mail_relay`'

    SiteImageUpdateAccepted:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [siteId, operationId]
          properties:
            siteId:
              type: string
            operationId:
              type: string

    OperationDto:
      type: object
      required:
        - id
        - organizationId
        - kind
        - status
        - resourceType
        - resourceId
        - requestedByUserId
        - errorCode
        - errorMessage
        - submittedAt
        - startedAt
        - completedAt
        - updatedAt
        - steps
      properties:
        id:
          type: string
        organizationId:
          type: string
        kind:
          type: string
          enum:
            - service.deploy
            - service.restart
            - service.stop
            - site.deploy
            - site.provision
            - site.delete
            - site.reassign
            - site.domains
            - site.files.archive
            - site.files.extract
            - site.backups.create
            - site.backups.prune
            - site.backups.restore
            - site.backups.download
            - site.wordpress.inspect
            - site.wordpress.update
            - site.wordpress.import
            - panel.backups.create
            - panel.container.restart
            - panel.container.apply
            - host.job
            - host.maintenance
            - host.security
            - host.allocate
            - site.tls.apply
            - stack.deploy
            - stack.start
            - stack.stop
            - stack.restart
            - stack.upgrade
            - stack.rollback
            - stack.delete
            - stack.backup
            - stack.restore
            - stack.prune
            - stack.task
        status:
          type: string
          enum:
            - queued
            - processing
            - accepted
            - reconciling
            - succeeded
            - failed
            - unknown
            - cancelled
        resourceType:
          type: string
          enum: [host, allocation, site, service, domain, quota, stack]
        resourceId:
          type: string
        requestedByUserId:
          type: string
          nullable: true
        errorCode:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: "#/components/schemas/OperationTimelineStep"

    NotificationGroup:
      type: string
      description: A group of alert kinds; `server` exists only in the server's settings
      enum: [availability, backups, certificates, server]

    NotificationProblem:
      type: string
      description: Why a message did not go; a closed list, never the other side's words
      enum: [mail_not_configured, mail_refused, address_not_allowed, unreachable, redirect, rejected, server_error, expired, channel_changed]

    ServerNotificationChannelInput:
      description: The body that fits `:channel` in the server's settings
      oneOf:
        - $ref: "#/components/schemas/ServerEmailNotificationChannelInput"
        - $ref: "#/components/schemas/WebhookNotificationChannelInput"
        - $ref: "#/components/schemas/TelegramNotificationChannelInput"

    CustomerNotificationChannelInput:
      description: The body that fits `:channel` in a customer's settings
      oneOf:
        - $ref: "#/components/schemas/CustomerEmailNotificationChannelInput"
        - $ref: "#/components/schemas/WebhookNotificationChannelInput"
        - $ref: "#/components/schemas/TelegramNotificationChannelInput"

    ServerEmailNotificationChannelInput:
      type: object
      additionalProperties: false
      required: [enabled, groups, recipients]
      properties:
        enabled:
          type: boolean
        groups:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/NotificationGroup"
        recipients:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            format: email
            maxLength: 254

    CustomerEmailNotificationChannelInput:
      type: object
      description: The mail of a customer goes to the owners of the customer's account; there is no address to type
      additionalProperties: false
      required: [enabled, groups]
      properties:
        enabled:
          type: boolean
        groups:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/NotificationGroup"

    WebhookNotificationChannelInput:
      type: object
      additionalProperties: false
      required: [enabled, groups]
      properties:
        enabled:
          type: boolean
        groups:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/NotificationGroup"
        url:
          type: string
          maxLength: 1024
          description: >-
            Write-only. An `https://` address with a DNS name, without user name or password; every address the name
            resolves to must be public and not one of this server's own. Left out, the stored address stays.
        signingKey:
          type: string
          nullable: true
          pattern: "^[\\x21-\\x7e]{16,128}$"
          description: >-
            Write-only. With a key, every request carries `X-Hosting-Panel-Signature: t=<seconds>,v1=<hex HMAC-SHA256 of
            "<seconds>.<body>">`. Left out, the stored key stays; `null` removes it.

    TelegramNotificationChannelInput:
      type: object
      additionalProperties: false
      required: [enabled, groups, chat]
      properties:
        enabled:
          type: boolean
        groups:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/NotificationGroup"
        botToken:
          type: string
          pattern: "^\\d{6,12}:[A-Za-z0-9_-]{30,50}$"
          description: Write-only. Left out, the stored one stays.
        chat:
          type: string
          pattern: "^(?:-?\\d{1,20}|@[A-Za-z][A-Za-z0-9_]{4,31})$"
          description: The numeric id of the chat, or the `@name` of a public channel

    NotificationEmailChannelDto:
      type: object
      required: [enabled, groups, updatedAt, lastTestedAt, recipients]
      properties:
        enabled:
          type: boolean
        groups:
          type: array
          items:
            $ref: "#/components/schemas/NotificationGroup"
        updatedAt:
          type: string
          format: date-time
        lastTestedAt:
          type: string
          format: date-time
          nullable: true
        recipients:
          type: array
          nullable: true
          description: null in a customer's settings, where the mail goes to the owners of the account
          items:
            type: string

    NotificationWebhookChannelDto:
      type: object
      required: [enabled, groups, updatedAt, lastTestedAt, host, signed]
      properties:
        enabled:
          type: boolean
        groups:
          type: array
          items:
            $ref: "#/components/schemas/NotificationGroup"
        updatedAt:
          type: string
          format: date-time
        lastTestedAt:
          type: string
          format: date-time
          nullable: true
        host:
          type: string
          description: The host name of the address; the rest of the address is never returned
        signed:
          type: boolean
          description: Whether a signing key is stored

    NotificationTelegramChannelDto:
      type: object
      required: [enabled, groups, updatedAt, lastTestedAt, chat]
      properties:
        enabled:
          type: boolean
        groups:
          type: array
          items:
            $ref: "#/components/schemas/NotificationGroup"
        updatedAt:
          type: string
          format: date-time
        lastTestedAt:
          type: string
          format: date-time
          nullable: true
        chat:
          type: string

    NotificationDeliveryDto:
      type: object
      required: [id, channel, createdAt, finishedAt, status, problem, httpStatus, attempts, test, opened, closed, recipient]
      properties:
        id:
          type: string
          description: The id a webhook receives in its body; the same at every try of the same message
        channel:
          type: string
          enum: [email, webhook, telegram]
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          description: "`pending` is tried again after 2, 10 and 30 minutes; after that, or after one hour, it is `failed`"
          enum: [pending, sent, failed]
        problem:
          allOf:
            - $ref: "#/components/schemas/NotificationProblem"
          nullable: true
        httpStatus:
          type: integer
          minimum: 100
          maximum: 599
          nullable: true
        attempts:
          type: integer
          minimum: 0
        test:
          type: boolean
        opened:
          type: integer
          minimum: 0
          description: How many alerts the message says open
        closed:
          type: integer
          minimum: 0
          description: How many alerts the message says no longer open
        recipient:
          type: string
          nullable: true
          description: The address a mail went to; null for the other channels

    NotificationSettingsDto:
      type: object
      required: [audience, mailReady, groups, channels, deliveries]
      properties:
        audience:
          type: string
          enum: [server, customer]
        mailReady:
          type: boolean
          description: Whether sending mail is set up; without it the email channel can be saved but nothing goes out
        groups:
          type: array
          description: The groups this scope can turn on
          items:
            $ref: "#/components/schemas/NotificationGroup"
        channels:
          type: object
          required: [email, webhook, telegram]
          properties:
            email:
              allOf:
                - $ref: "#/components/schemas/NotificationEmailChannelDto"
              nullable: true
            webhook:
              allOf:
                - $ref: "#/components/schemas/NotificationWebhookChannelDto"
              nullable: true
            telegram:
              allOf:
                - $ref: "#/components/schemas/NotificationTelegramChannelDto"
              nullable: true
        deliveries:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/NotificationDeliveryDto"

    NotificationTestResult:
      type: object
      required: [outcome, problem, httpStatus]
      properties:
        outcome:
          type: string
          enum: [sent, failed]
        problem:
          allOf:
            - $ref: "#/components/schemas/NotificationProblem"
          nullable: true
        httpStatus:
          type: integer
          minimum: 100
          maximum: 599
          nullable: true
