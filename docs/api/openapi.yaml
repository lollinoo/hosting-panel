          nullable: true
        region:
          type: string
          nullable: true
        bucket:
          type: string
          nullable: true
        prefix:
          type: string
        accessKeyId:
          type: string
          nullable: true
        secretAccessKeySet:
          type: boolean
        scheduleHourUtc:
