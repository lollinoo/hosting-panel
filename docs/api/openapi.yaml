          name: name
          required: true
          description: Full database name (`<prefix>_<suffix>`)
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "204":
          description: Custom database deleted
        "400":
          description: "Cannot delete the site's primary database (`VALIDATION_ERROR`, `reason: protected`)"
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.databases.manage` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site or database not found within site prefix (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Database metadata lock contention or concurrent change in progress (`RESOURCE_LOCKED`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Database runtime unavailable on the active backend (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: Executor or MariaDB service unavailable or outcome unclear (`DOCKER_ENGINE_UNAVAILABLE`, retryable)
          $ref: "#/components/responses/ErrorResponse"

