        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.databases.manage` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Organization or site not found (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: "Site locked in `deploying` or `maintenance` (`RESOURCE_LOCKED`, `reason: not_ready`)"
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: phpMyAdmin unavailable on the active runtime backend (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/databases/{name}:
    delete:
      tags: [Managed Sites]
      operationId: deleteSiteDatabase
      summary: Delete a custom site database (site.databases.manage)
      description: >-
        Drops a custom database owned by the site (`<prefix>_<suffix>`). Refuses deleting the
        site's primary database with `400 VALIDATION_ERROR` (`reason: protected`), and refuses
        names outside the site's prefix (including `pma_...` or `phpmyadmin`) with `404`.
