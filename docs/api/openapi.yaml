        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    XRequestId:
      description: Unique correlation request ID
      schema:
        type: string

  parameters:
    OrgIdParam:
      in: path
      name: orgId
      required: true
      schema:
        type: string
    HostIdParam:
      in: path
      name: hostId
      required: true
      schema:
        type: string
    SiteIdParam:
      in: path
      name: siteId
      required: true
      schema:
        type: string
    DomainIdParam:
      in: path
      name: domainId
      required: true
      schema:
        type: string
    ServiceIdParam:
      in: path
      name: serviceId
      required: true
      schema:
        type: string
    SecretIdParam:
      in: path
      name: secretId
      required: true
      schema:
        type: string
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
    IdempotencyKeyRuntimeHeader:
      in: header
      name: Idempotency-Key
      required: false
      description: Required when runtime execution is enabled (`runtimeBackend != 'disabled'`)
      schema:
        type: string
    CursorQuery:
      in: query
      name: cursor
      schema:
        type: string
    LimitQuery:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  responses:
    ErrorResponse:
      description: Standard normalized RFC-style error envelope
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"

  schemas:
    ApiErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiErrorBody"

    ApiErrorBody:
      type: object
      required: [code, message, requestId, retryable, details]
      properties:
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - INVALID_CREDENTIALS
            - ACCOUNT_LOCKED
            - TOTP_INVALID
            - ACCOUNT_SETUP_INCOMPLETE
            - PERMISSION_DENIED
            - HOST_POLICY_DENIED
            - ORGANIZATION_SUSPENDED
            - NOT_FOUND
            - VALIDATION_ERROR
            - IDEMPOTENCY_CONFLICT
            - RESOURCE_LOCKED
            - QUOTA_EXCEEDED
            - DEDICATED_HOST_OCCUPIED
            - SHARED_MODE_GATED
            - DOMAIN_CONFLICT
            - ALREADY_EXISTS
            - LAST_OWNER_PROTECTED
            - NOT_SUPPORTED
            - OPERATION_INTERRUPTED
            - OPERATION_AMBIGUOUS
            - DOCKER_ENGINE_UNAVAILABLE
            - MAIL_RELAY_UNAVAILABLE
            - HOST_AGENT_UNAVAILABLE
            - INTERNAL_ERROR
        message:
          type: string
        requestId:
          type: string
        retryable:
          type: boolean
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      required: [message]
      properties:
        field:
          type: string
        message:
          type: string
        reason:
          type: string

    AdminUserDto:
      type: object
      required: [id, email, name, role, status, totpEnabled, mustChangePassword, lockedUntil, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [server_admin, customer]
        status:
          type: string
          enum: [active, disabled]
        totpEnabled:
          type: boolean
        mustChangePassword:
          type: boolean
        lockedUntil:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    ReadMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        total:
          type: integer
        cursor:
          type: string
          nullable: true
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time

    CursorPage:
      type: object
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean

    RuntimeBackend:
      type: string
      enum: [linux-systemd, local-simulator, disabled]

    PlatformCapabilitiesDto:
      type: object
      required:
        - phase
        - runtimeBackend
        - hostingMode
        - sharedHostingEnabled
        - dockerExecutorRuntimeAvailable
        - hostAgentRuntimeAvailable
        - acmeTlsRuntimeAvailable
        - sftpAvailable
        - productionBackupRuntimeAvailable
      properties:
        phase:
          type: string
          enum: [phase-1, phase-2]
        runtimeBackend:
          $ref: "#/components/schemas/RuntimeBackend"
        hostingMode:
          type: string
          const: dedicated
        sharedHostingEnabled:
          type: boolean
          const: false
        dockerExecutorRuntimeAvailable:
          type: boolean
        hostAgentRuntimeAvailable:
          type: boolean
        acmeTlsRuntimeAvailable:
          type: boolean
        sftpAvailable:
          type: boolean
          const: false
        productionBackupRuntimeAvailable:
          type: boolean
          const: false

    OrganizationCapabilitiesDto:
      type: object
      required:
        - hostingMode
        - sharedHostingEnabled
        - dockerExecutorRuntimeAvailable
        - hostAgentRuntimeAvailable
        - acmeTlsRuntimeAvailable
        - sftpAvailable
        - productionBackupRuntimeAvailable
      properties:
        hostingMode:
          type: string
          enum: [dedicated, shared]
        sharedHostingEnabled:
          type: boolean
          const: false
        dockerExecutorRuntimeAvailable:
          type: boolean
        hostAgentRuntimeAvailable:
          type: boolean
        acmeTlsRuntimeAvailable:
          type: boolean
        sftpAvailable:
          type: boolean
          const: false
        productionBackupRuntimeAvailable:
          type: boolean
          const: false

    DevPersonaDto:
      type: object
      required: [id, email, name, description, role, globalRoles]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        description:
          type: string
        role:
          type: string
        organizationId:
          type: string
          nullable: true
        globalRoles:
          type: array
          items:
            type: string

    MeMembershipDto:
      type: object
      required: [id, organizationId, organizationName, organizationSlug, role, organizationStatus]
      properties:
        id:
          type: string
        organizationId:
          type: string
        organizationName:
          type: string
        organizationSlug:
          type: string
        role:
          type: string
        organizationStatus:
          type: string
          enum: [active, suspended, archived]

    MeDto:
      type: object
      required: [user, globalRoles, hostingAdminOrgIds, memberships, platformCapabilities]
      properties:
        user:
          type: object
          required: [id, email, name]
          properties:
            id:
              type: string
            email:
              type: string
              format: email
            name:
              type: string
        globalRoles:
