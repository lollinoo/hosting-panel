        - $ref: "#/components/parameters/SiteIdParam"
        - $ref: "#/components/parameters/UserIdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: New one-time temporary password
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteWordpressPasswordResetDto"
        "400":
          description: >-
            Non-empty body (`VALIDATION_ERROR`), or `userId` is not an administrator of the site
            (`VALIDATION_ERROR`, reason `administrator_unknown`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.update` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found or belongs to another organization (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Site deploying/maintenance (`RESOURCE_LOCKED`, reason `not_ready`) or another operation
            is running on the site (`RESOURCE_LOCKED`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: >-
            WordPress tools unavailable on the active backend (`NOT_SUPPORTED`, reason
            `wordpress_unavailable`) or the site is not a WordPress site (`NOT_SUPPORTED`, reason `not_wordpress`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: >-
            The password was not confirmed (`DOCKER_ENGINE_UNAVAILABLE`, retryable; reason
            `not_installed`, `config_broken`, `database_unreachable` or `unavailable`)
          $ref: "#/components/responses/ErrorResponse"


  /v1/organizations/{orgId}/managed-sites/{siteId}/wordpress/import:
    get:
      tags: [Managed Sites]
      operationId: getSiteWordpressImport
      summary: WordPress import state of a site (`site.read`)
      description: >-
        Returns the two upload slots, whether an earlier import was left unfinished, the running
        `site.wordpress.import` operation (its six steps in order) and the outcome of the last import.
        `slots` is null (still `200`) when the site's files could not be read; `earlierImportUnfinished`
        is then false. On a server without the WordPress tools or for a site that is not WordPress,
        `available` is false and `slots` null. A suspended organization still reads this state.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
      responses:
        "200":
          description: WordPress import state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteWordpressImportDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.read` permission (`PERMISSION_DENIED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found or belongs to another organization (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"

    post:
      tags: [Managed Sites]
      operationId: startSiteWordpressImport
      summary: Enqueue a `site.wordpress.import` of the two uploaded files (`site.update`, 202 Accepted)
      description: >-
        Replaces the site's files and database with the uploaded ones. Both slots must be complete.
        When backups are configured a `pre_update` copy of the site is taken first; its row carries
        the import's operation id. Counts toward the hourly limit of 6 heavy actions per site (a server
        administrator's actions are not counted). A replay with the same `Idempotency-Key` answers the
        same operation.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteWordpressImportStartRequest"
      responses:
        "202":
          description: Accepted; follow the returned operation URL
          content:
            application/json:
              schema:
                type: object
                required: [data, links]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteWordpressAcceptedDto"
                  links:
                    type: object
                    required: [operation]
                    properties:
                      operation:
                        type: string
        "400":
          description: Invalid body or missing/invalid `Idempotency-Key` (`VALIDATION_ERROR`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.update` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found or belongs to another organization (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Site deploying/maintenance (`RESOURCE_LOCKED`, reason `not_ready`) or an import of this
            site is running (`RESOURCE_LOCKED`, reason `import_running`), a slot is not complete (`RESOURCE_LOCKED`, reason `files_incomplete`), an earlier
            import was left unfinished (`RESOURCE_LOCKED`, reason `earlier_import_unfinished`; restore a
            copy from Backups first), locked by another operation (`RESOURCE_LOCKED`), reused
            `Idempotency-Key` (`IDEMPOTENCY_CONFLICT`), or hourly limit of 6 heavy actions per site
            reached (`QUOTA_EXCEEDED`, reason `too_many_requests`, `details[].field: retryAt`, `Retry-After` header)
          $ref: "#/components/responses/QuotaConflictErrorResponse"
        "422":
          description: >-
            WordPress tools unavailable on the active backend (`NOT_SUPPORTED`, reason
            `wordpress_unavailable`) or the site is not a WordPress site (`NOT_SUPPORTED`, reason `not_wordpress`)
          $ref: "#/components/responses/ErrorResponse"
        "502":
          description: The files call ended without a confirmed outcome (`OPERATION_AMBIGUOUS`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: File operations temporarily unavailable (`DOCKER_ENGINE_UNAVAILABLE`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/wordpress/import/files:
    delete:
      tags: [Managed Sites]
      operationId: discardSiteWordpressImportFiles
      summary: Discard both uploaded import files (`site.update`, 204 No Content)
      description: >-
        Empties both slots. The work left by an unfinished earlier import is kept, so
        `earlierImportUnfinished` stays true; the answer is still `204`.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
      responses:
        "204":
          description: Both slots are empty
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.update` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found or belongs to another organization (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Site deploying/maintenance (`RESOURCE_LOCKED`, reason `not_ready`) or an import of this
            site is running (`RESOURCE_LOCKED`, reason `import_running`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: >-
            WordPress tools unavailable on the active backend (`NOT_SUPPORTED`, reason
            `wordpress_unavailable`) or the site is not a WordPress site (`NOT_SUPPORTED`, reason `not_wordpress`)
          $ref: "#/components/responses/ErrorResponse"
        "502":
          description: The files call ended without a confirmed outcome (`OPERATION_AMBIGUOUS`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: File operations temporarily unavailable (`DOCKER_ENGINE_UNAVAILABLE`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/wordpress/import/files/{slot}:
    put:
      tags: [Managed Sites]
      operationId: uploadSiteWordpressImportChunk
      summary: Upload one chunk of an import file into a slot (`site.update`)
      description: >-
        Chunks are addressed by `uploadId` and `offset` and are safe to resend; resume a `partial`
        slot at `offset = size` with its `uploadId`. The chunk with `final: true` completes the slot.
        The archive must be a zip; the dump must be SQL text or gzip.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
        - name: slot
          in: path
          required: true
          description: "`archive` (the site files, a zip) or `dump` (the database export, `.sql` or `.sql.gz`)"
          schema:
            type: string
            enum: [archive, dump]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteWordpressImportChunkRequest"
      responses:
        "200":
          description: Bytes of the slot received so far
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteFileWriteResultDto"
        "400":
          description: >-
            Invalid slot or body (`VALIDATION_ERROR`), the chunk does not match the upload
            (`VALIDATION_ERROR`, reason `upload_mismatch`), the archive is not a zip (`VALIDATION_ERROR`,
            reason `not_a_zip`) or the dump is not SQL (`VALIDATION_ERROR`, reason `dump_not_sql`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.update` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found or belongs to another organization (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Site deploying/maintenance (`RESOURCE_LOCKED`, reason `not_ready`) or an import of this
            site is running (`RESOURCE_LOCKED`, reason `import_running`), the file is too large (`QUOTA_EXCEEDED`, reason `too_large`) or the site's
            storage is full (`QUOTA_EXCEEDED`, reason `disk_full`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: >-
            WordPress tools unavailable on the active backend (`NOT_SUPPORTED`, reason
            `wordpress_unavailable`) or the site is not a WordPress site (`NOT_SUPPORTED`, reason `not_wordpress`)
          $ref: "#/components/responses/ErrorResponse"
        "502":
          description: The files call ended without a confirmed outcome (`OPERATION_AMBIGUOUS`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: File operations temporarily unavailable (`DOCKER_ENGINE_UNAVAILABLE`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/wordpress/import/files/{slot}/pick:
    post:
      tags: [Managed Sites]
      operationId: pickSiteWordpressImportFile
      summary: Use a file already in the site's files (for example uploaded by SFTP) as a slot (`site.update`)
      description: >-
        Moves the file at `path` into the slot, which becomes `complete`. The same zip and SQL checks
        as an upload apply.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
        - name: slot
          in: path
          required: true
          description: "`archive` (the site files, a zip) or `dump` (the database export, `.sql` or `.sql.gz`)"
          schema:
            type: string
            enum: [archive, dump]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteWordpressImportPickRequest"
      responses:
        "200":
          description: The filled slot
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteWordpressImportSlotDto"
        "400":
          description: >-
            Invalid slot, body or path (`VALIDATION_ERROR`, reason `invalid_path` for a path outside the
            site's files), the path is a folder (`VALIDATION_ERROR`, reason `is_a_directory`), the archive
            is not a zip (`VALIDATION_ERROR`, reason `not_a_zip`) or the dump is not SQL (`VALIDATION_ERROR`,
            reason `dump_not_sql`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.update` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`), or the file is protected (`PERMISSION_DENIED`, reason `protected`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: >-
            Site not found or belongs to another organization (`NOT_FOUND`), or no file at `path`
            (`NOT_FOUND`, reason `not_found`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Site deploying/maintenance (`RESOURCE_LOCKED`, reason `not_ready`) or an import of this
            site is running (`RESOURCE_LOCKED`, reason `import_running`), the file is too large (`QUOTA_EXCEEDED`, reason `too_large`) or the site's
            storage is full (`QUOTA_EXCEEDED`, reason `disk_full`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: >-
            WordPress tools unavailable on the active backend (`NOT_SUPPORTED`, reason
            `wordpress_unavailable`) or the site is not a WordPress site (`NOT_SUPPORTED`, reason `not_wordpress`)
          $ref: "#/components/responses/ErrorResponse"
        "502":
          description: The files call ended without a confirmed outcome (`OPERATION_AMBIGUOUS`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: File operations temporarily unavailable (`DOCKER_ENGINE_UNAVAILABLE`)
          $ref: "#/components/responses/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    XRequestId:
      description: Unique correlation request ID
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying after reaching a per-site rate limit (`QUOTA_EXCEEDED`)
      schema:
        type: integer
        minimum: 1

  parameters:
    OrgIdParam:
      in: path
      name: orgId
      required: true
      schema:
        type: string
    HostIdParam:
      in: path
      name: hostId
      required: true
      schema:
        type: string
    SiteIdParam:
      in: path
      name: siteId
      required: true
      schema:
        type: string
    BackupIdParam:
      in: path
      name: backupId
      required: true
      schema:
        type: string
    DomainIdParam:
      in: path
      name: domainId
      required: true
      schema:
        type: string
    CertificateIdParam:
      in: path
      name: certificateId
      required: true
      schema:
        type: string
    VersionIdParam:
      in: path
      name: versionId
      required: true
      schema:
        type: string
    UserIdParam:
      in: path
      name: userId
      required: true
      schema:
        type: string
    ServiceIdParam:
      in: path
      name: serviceId
      required: true
      schema:
        type: string
    SecretIdParam:
      in: path
      name: secretId
      required: true
      schema:
        type: string
    TerminalSessionIdParam:
      in: path
      name: sessionId
      required: true
      description: '`term_` and 32 hex characters; any other value is `NOT_FOUND`'
      schema:
        type: string
    FirewallPortNameParam:
      in: path
      name: name
      required: true
      description: >-
        A port of the safe list: `http_alt` 8080, `https_alt` 8443, `node_exporter` 9100,
        `zabbix_agent` 10050, `checkmk_agent` 6556, `nrpe` 5666 (all TCP)
      schema:
        type: string
        enum: [http_alt, https_alt, node_exporter, zabbix_agent, checkmk_agent, nrpe]
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
    IdempotencyKeyRuntimeHeader:
      in: header
      name: Idempotency-Key
      required: false
      description: Required when runtime execution is enabled (`runtimeBackend != 'disabled'`)
      schema:
        type: string
    CursorQuery:
      in: query
      name: cursor
      schema:
        type: string
    LimitQuery:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  responses:
    ErrorResponse:
      description: Standard normalized RFC-style error envelope
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    QuotaConflictErrorResponse:
      description: Standard normalized RFC-style error envelope with `Retry-After` header for hourly heavy-action limit (`QUOTA_EXCEEDED`)
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"

  schemas:
    ApiErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiErrorBody"

    ApiErrorBody:
      type: object
      required: [code, message, requestId, retryable, details]
      properties:
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - INVALID_CREDENTIALS
            - ACCOUNT_LOCKED
            - TOTP_INVALID
            - ACCOUNT_SETUP_INCOMPLETE
            - PASSWORD_CHANGE_REQUIRED
            - PASSWORD_RESET_INVALID
            - PERMISSION_DENIED
            - HOST_POLICY_DENIED
            - ORGANIZATION_SUSPENDED
            - NOT_FOUND
            - VALIDATION_ERROR
            - IDEMPOTENCY_CONFLICT
            - RESOURCE_LOCKED
            - QUOTA_EXCEEDED
            - DEDICATED_HOST_OCCUPIED
            - SHARED_MODE_GATED
            - DOMAIN_CONFLICT
            - ALREADY_EXISTS
            - LAST_OWNER_PROTECTED
            - LAST_ADMINISTRATOR_PROTECTED
            - PANEL_CONTAINER_ABSENT
            - FIREWALL_BASE_RULES_NOT_CURRENT
            - HOST_JOB_FAILED
            - RATE_LIMITED
            - NOT_SUPPORTED
            - OPERATION_INTERRUPTED
            - OPERATION_AMBIGUOUS
            - DOCKER_ENGINE_UNAVAILABLE
            - MAIL_RELAY_UNAVAILABLE
            - HOST_AGENT_UNAVAILABLE
            - INTERNAL_ERROR
            - CERTIFICATE_INVALID
            - CERTIFICATE_KEY_MISMATCH
            - CERTIFICATE_CHAIN_INVALID
            - CERTIFICATE_NOT_YET_VALID
            - CERTIFICATE_EXPIRED
            - CERTIFICATE_HOSTNAME_MISMATCH
            - CERTIFICATE_IN_USE
            - CERTIFICATE_APPLY_FAILED
            - CERTIFICATE_SNI_MISMATCH
            - CERTIFICATE_UPLOAD_TOO_LARGE
            - CERTIFICATE_FORMAT_UNSUPPORTED
            - BACKUP_TARGET_IN_USE
        message:
          type: string
        requestId:
          type: string
        retryable:
          type: boolean
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      required: [message]
      properties:
        field:
          type: string
        message:
          type: string
        reason:
          type: string

    AdminUserDto:
      type: object
      required: [id, email, name, role, status, totpEnabled, mustChangePassword, lockedUntil, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [server_admin, customer]
        status:
          type: string
          enum: [active, disabled]
        totpEnabled:
          type: boolean
        mustChangePassword:
          type: boolean
        lockedUntil:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    ReadMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        total:
          type: integer
        cursor:
          type: string
          nullable: true
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time

    CursorPage:
      type: object
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean

    RuntimeBackend:
      type: string
      enum: [linux-systemd, local-simulator, disabled]

    PlatformCapabilitiesDto:
      type: object
      required:
        - phase
        - runtimeBackend
        - hostingMode
        - sharedHostingEnabled
        - dockerExecutorRuntimeAvailable
        - hostAgentRuntimeAvailable
        - acmeTlsRuntimeAvailable
        - sftpAvailable
        - phpMyAdminAvailable
        - productionBackupRuntimeAvailable
        - wordpressToolsAvailable
        - manualTlsCertificatesAvailable
        - localBackupTargetsAvailable
        - encryptedBackupExportAvailable
      properties:
        phase:
          type: string
          enum: [phase-1, phase-2]
        runtimeBackend:
          $ref: "#/components/schemas/RuntimeBackend"
        hostingMode:
          type: string
          const: dedicated
        sharedHostingEnabled:
          type: boolean
          const: false
        dockerExecutorRuntimeAvailable:
          type: boolean
        hostAgentRuntimeAvailable:
          type: boolean
        acmeTlsRuntimeAvailable:
          type: boolean
        sftpAvailable:
          type: boolean
          description: True when `runtimeBackend` is `linux-systemd`; false otherwise
        phpMyAdminAvailable:
          type: boolean
          description: True when `runtimeBackend` is `linux-systemd`; false otherwise
        productionBackupRuntimeAvailable:
          type: boolean
          description: True when `runtimeBackend` is `linux-systemd`; false otherwise
        wordpressToolsAvailable:
          type: boolean
          description: True when `runtimeBackend` is `linux-systemd`; false otherwise
        manualTlsCertificatesAvailable:
          type: boolean
          default: false
          description: True when `runtimeBackend` is `linux-systemd`; false otherwise
        localBackupTargetsAvailable:
          type: boolean
          default: false
          description: True once a backup target on this server can be configured; false until that capability ships
        encryptedBackupExportAvailable:
          type: boolean
          default: false
          description: True once an encrypted backup export can be downloaded; false until that capability ships

    OrganizationCapabilitiesDto:
      type: object
      required:
        - hostingMode
        - sharedHostingEnabled
        - dockerExecutorRuntimeAvailable
        - hostAgentRuntimeAvailable
        - acmeTlsRuntimeAvailable
        - sftpAvailable
        - phpMyAdminAvailable
        - productionBackupRuntimeAvailable
        - wordpressToolsAvailable
        - manualTlsCertificatesAvailable
        - localBackupTargetsAvailable
        - encryptedBackupExportAvailable
      properties:
        hostingMode:
          type: string
          enum: [dedicated, shared]
        sharedHostingEnabled:
          type: boolean
          const: false
        dockerExecutorRuntimeAvailable:
          type: boolean
        hostAgentRuntimeAvailable:
          type: boolean
        acmeTlsRuntimeAvailable:
          type: boolean
        sftpAvailable:
          type: boolean
          description: True when `runtimeBackend` is `linux-systemd`; false otherwise
        phpMyAdminAvailable:
          type: boolean
          description: True when `runtimeBackend` is `linux-systemd`; false otherwise
        productionBackupRuntimeAvailable:
          type: boolean
          description: True when `runtimeBackend` is `linux-systemd`; false otherwise
        wordpressToolsAvailable:
          type: boolean
          description: True when `runtimeBackend` is `linux-systemd`; false otherwise
        manualTlsCertificatesAvailable:
          type: boolean
          default: false
          description: True when `runtimeBackend` is `linux-systemd`; false otherwise
        localBackupTargetsAvailable:
          type: boolean
          default: false
          description: True once a backup target on this server can be configured; false until that capability ships
        encryptedBackupExportAvailable:
          type: boolean
          default: false
          description: True once an encrypted backup export can be downloaded; false until that capability ships

    DevPersonaDto:
      type: object
      required: [id, email, name, description, role, globalRoles]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        description:
          type: string
        role:
          type: string
        organizationId:
          type: string
          nullable: true
        globalRoles:
          type: array
          items:
            type: string

    MeMembershipDto:
      type: object
      required: [id, organizationId, organizationName, organizationSlug, role, organizationStatus]
      properties:
        id:
          type: string
        organizationId:
          type: string
        organizationName:
          type: string
        organizationSlug:
          type: string
        role:
          type: string
        organizationStatus:
          type: string
          enum: [active, suspended, archived]

    SupportAccessDto:
      type: object
      required: [organizationId, organizationName, expiresAt]
      properties:
        organizationId:
          type: string
        organizationName:
          type: string
          minLength: 1
        expiresAt:
          type: string
          format: date-time

    MeDto:
      type: object
      required: [user, globalRoles, hostingAdminOrgIds, memberships, platformCapabilities]
      properties:
        user:
          type: object
          required: [id, email, name]
          properties:
            id:
              type: string
            email:
              type: string
              format: email
            name:
              type: string
        globalRoles:
          type: array
          items:
            type: string
        hostingAdminOrgIds:
          type: array
          items:
            type: string
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/MeMembershipDto"
        platformCapabilities:
          $ref: "#/components/schemas/PlatformCapabilitiesDto"
