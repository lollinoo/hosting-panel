    EncryptedSecretMetadataDto:
      type: object
      description: Write-only encrypted secret metadata (never includes plaintext or ciphertext)
      required:
        - id
        - organizationId
        - siteId
        - secretKey
        - keyVersion
        - version
        - createdByUserId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        siteId:
          type: string
          nullable: true
        secretKey:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]{0,127}$"
        keyVersion:
          type: string
        version:
          type: integer
          minimum: 1
        createdByUserId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpsertEncryptedSecretInput:
      type: object
      required: [secretKey, value]
      properties:
        secretKey:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]{0,127}$"
        value:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
        siteId:
          type: string
          nullable: true

    HostDaemonHeartbeatDto:
      type: object
