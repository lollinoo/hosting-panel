        - key_file_missing
        - tool_unavailable
        - no_space
        - database_dump_failed
        - files_unreadable
        - repository_locked
        - timeout
        - interrupted
        - other
        - restore_prepare_failed
        - switch_undone
        - undo_incomplete
        - definer_missing
        - panel_dump_missing
        - site_busy
        - address_not_updated
        - panel_dump_failed
        - panel_dump_tool_missing
        - site_not_started

    BackupSettingsInput:
      type: object
      additionalProperties: false
      required: [endpoint, region, bucket, accessKeyId]
      properties:
        endpoint:
          type: string
          pattern: "^https?:\\/\\/[A-Za-z0-9.-]+(:\\d{1,5})?$"
        region:
          type: string
          pattern: "^[a-z0-9-]{1,64}$"
        bucket:
          type: string
          pattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
        prefix:
          type: string
          default: ""
          pattern: "^$|^[A-Za-z0-9_-][A-Za-z0-9._-]{0,63}(\\/[A-Za-z0-9_-][A-Za-z0-9._-]{0,63}){0,7}$"
        accessKeyId:
          type: string
          minLength: 1
          maxLength: 256
        secretAccessKey:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
