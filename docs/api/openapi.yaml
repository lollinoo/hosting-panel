openapi: 3.1.0
info:
  title: Hosting Control Panel API
  version: 0.2.0
  summary: Docker-Native Control Plane API (HCP-SPEC-003 Phase 2)
  description: >-
    Versioned `/v1` Docker-native control-plane REST API enforcing strict tenant
    organization isolation, default-deny RBAC/ABAC authorization, transactional
    host placement and quota reservations, immutable stack revisions, write-only
    AES-256-GCM encrypted secrets, transactional outbox lifecycle operations over
    signed Unix Domain Socket IPC (`docker-executor` and `host-agent`), `unknown`
    crash recovery, and observe-only drift reconciliation. Shared hosting, ACME
    TLS, SFTP, and production backups remain gated (`false`).
servers:
  - url: http://127.0.0.1:4000
    description: Local embedded control-plane development server

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Liveness and database readiness probes
  - name: Auth
    description: Authentication, Dev OIDC token issuance, and token revocation
  - name: Identity
    description: Principal identity, assigned roles, and tenant memberships
  - name: Hosts
    description: Linux host nodes, telemetry, maintenance, security posture, operations, and allocations
  - name: Service Templates
    description: Approved service catalog templates
  - name: Admin Audit
    description: Platform-wide immutable audit trail
  - name: Organizations
    description: Tenant organizations, capabilities, quotas, and members
  - name: Secrets
    description: Write-only AES-256-GCM encrypted secrets metadata
  - name: Sites
    description: Composite application sites, domains, and aggregate drift status
  - name: Services
    description: Declarative service instances, immutable revisions, and async lifecycle
  - name: Operations
    description: Asynchronous operations and timeline progress

paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getHealthLive
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [status, service, spec, phase, timestamp]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: hosting-panel-api
                  spec:
                    type: string
                    enum: [HCP-SPEC-002, HCP-SPEC-003]
                  phase:
                    type: string
                    enum: [phase-1, phase-2]
                  runtimeBackend:
                    $ref: "#/components/schemas/RuntimeBackend"
                  timestamp:
                    type: string
                    format: date-time

  /health/ready:
    get:
      tags: [Health]
      operationId: getHealthReady
      summary: Readiness probe verifying PostgreSQL connectivity
      security: []
      responses:
        "200":
          description: Control-plane database is reachable
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [status, database, mode, timestamp]
                properties:
                  status:
                    type: string
                    const: ready
                  database:
                    type: string
                    const: up
                  mode:
                    type: string
                    enum: [pglite, postgres]
                  timestamp:
                    type: string
                    format: date-time
        "500":
          $ref: "#/components/responses/ErrorResponse"

  /v1/dev/auth/personas:
    get:
      tags: [Auth]
      operationId: getDevPersonas
      summary: List seeded personas for local development authentication
      security: []
      responses:
        "200":
          description: List of available personas
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DevPersonaDto"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/dev/auth/token:
    post:
      tags: [Auth]
      operationId: issueDevToken
      summary: Mint an RS256 Bearer JWT for a development persona
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                email:
                  type: string
                  format: email
                expiresInSeconds:
                  type: integer
                  minimum: 1
                  maximum: 86400
      responses:
        "200":
          description: Token successfully issued
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [accessToken, tokenType, expiresIn, expiresAt, issuer, audience, user]
                    properties:
                      accessToken:
                        type: string
                      tokenType:
                        type: string
                        const: Bearer
                      expiresIn:
                        type: integer
                      expiresAt:
                        type: string
                        format: date-time
                      issuer:
                        type: string
                      audience:
                        type: string
                      user:
                        type: object
                        required: [id, email, name]
                        properties:
                          id:
                            type: string
                          email:
                            type: string
                            format: email
                          name:
                            type: string
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/auth/revoke:
    post:
      tags: [Auth]
      operationId: revokeCurrentToken
      summary: Immediately revoke the caller's active JWT jti
      responses:
        "200":
          description: Token successfully revoked
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [revoked, revokedAt]
                    properties:
                      revoked:
                        type: boolean
                        const: true
                      revokedAt:
                        type: string
                        format: date-time
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /v1/me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Retrieve current authenticated principal details and memberships
      responses:
        "200":
          description: Principal context
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MeDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /v1/me/organizations:
    get:
      tags: [Identity]
      operationId: getMyOrganizations
      summary: List organizations where caller holds active membership
      parameters:
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated organization summaries
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationSummaryDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /v1/hosts:
    get:
      tags: [Hosts]
      operationId: listHosts
      summary: List managed physical/virtual Linux host nodes (host.read)
      parameters:
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated host nodes
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/HostDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /v1/hosts/{hostId}:
    get:
      tags: [Hosts]
      operationId: getHost
      summary: Retrieve specific host details (host.read)
      parameters:
        - $ref: "#/components/parameters/HostIdParam"
      responses:
        "200":
          description: Host details
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/HostDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/hosts/{hostId}/telemetry:
    get:
      tags: [Hosts]
      operationId: getHostTelemetry
      summary: Retrieve host telemetry snapshot and daemon heartbeats (host.metrics.read)
      parameters:
        - $ref: "#/components/parameters/HostIdParam"
      responses:
        "200":
          description: Host telemetry and daemon heartbeats
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [hostId, runtimeBackend, telemetry, daemons]
                    properties:
                      hostId:
                        type: string
                      runtimeBackend:
                        $ref: "#/components/schemas/RuntimeBackend"
                      telemetry:
                        $ref: "#/components/schemas/HostTelemetryDto"
                        nullable: true
                      daemons:
                        type: array
                        items:
                          $ref: "#/components/schemas/HostDaemonHeartbeatDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/hosts/{hostId}/mode:
    patch:
      tags: [Hosts]
      operationId: updateHostMode
      summary: Update host hosting mode transition (host.security.manage)
      parameters:
        - $ref: "#/components/parameters/HostIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHostModeInput"
      responses:
        "200":
          description: Host mode updated or noop
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/HostDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Shared mode transition gated (AC-F1-06 / AC-F2-10)
          $ref: "#/components/responses/ErrorResponse"

  /v1/hosts/{hostId}/maintenance:
    post:
      tags: [Hosts]
      operationId: executeHostMaintenance
      summary: Enqueue allowlisted host maintenance operation (host.maintenance.execute)
      parameters:
        - $ref: "#/components/parameters/HostIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyRuntimeHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostMaintenanceInput"
      responses:
        "202":
          description: Host maintenance operation queued via transactional outbox (AC-F2-04)
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAcceptedEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Permission denied or unapproved maintenance action (HOST_POLICY_DENIED)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Resource locked or idempotency conflict (RESOURCE_LOCKED / IDEMPOTENCY_CONFLICT)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Host agent runtime disabled (NOT_SUPPORTED)
          $ref: "#/components/responses/ErrorResponse"

  /v1/hosts/{hostId}/security:
    post:
      tags: [Hosts]
      operationId: executeHostSecurity
      summary: Enqueue allowlisted host security posture operation (host.security.manage)
      parameters:
        - $ref: "#/components/parameters/HostIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyRuntimeHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostSecurityInput"
      responses:
        "202":
          description: Host security operation queued via transactional outbox (AC-F2-04)
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAcceptedEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Permission denied or unapproved security policy (HOST_POLICY_DENIED)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Resource locked or idempotency conflict (RESOURCE_LOCKED / IDEMPOTENCY_CONFLICT)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Host agent runtime disabled (NOT_SUPPORTED)
          $ref: "#/components/responses/ErrorResponse"

  /v1/hosts/{hostId}/operations:
    get:
      tags: [Hosts, Operations]
      operationId: listHostOperations
      summary: List asynchronous operations targeting a host (operation.read)
      parameters:
        - $ref: "#/components/parameters/HostIdParam"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated host operations
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OperationDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/hosts/{hostId}/operations/{opId}:
    get:
      tags: [Hosts, Operations]
      operationId: getHostOperation
      summary: Retrieve specific host operation timeline and progress (operation.read)
      parameters:
        - $ref: "#/components/parameters/HostIdParam"
        - in: path
          name: opId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Host operation details and timeline steps
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/OperationDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/allocations:
    get:
      tags: [Hosts]
      operationId: listAllocations
      summary: List all host allocations across platform (allocation.read)
      parameters:
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated host allocations
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/HostAllocationDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /v1/hosts/{hostId}/allocations:
    get:
      tags: [Hosts]
      operationId: listHostAllocations
      summary: List allocations for a specific host (allocation.read)
      parameters:
        - $ref: "#/components/parameters/HostIdParam"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated host allocations for host
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/HostAllocationDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Hosts]
      operationId: createHostAllocation
      summary: Allocate a host node to a tenant organization (allocation.create)
      parameters:
        - $ref: "#/components/parameters/HostIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId]
              properties:
                organizationId:
                  type: string
                hostingMode:
                  type: string
                  enum: [dedicated, shared]
                  default: dedicated
      responses:
        "201":
          description: Host successfully allocated
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/HostAllocationDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Dedicated host occupied (AC-F1-01) or shared mode gated (AC-F1-06)
          $ref: "#/components/responses/ErrorResponse"

  /v1/service-templates:
    get:
      tags: [Service Templates]
      operationId: listServiceTemplates
      summary: List catalog service templates (template.read)
      parameters:
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated service templates
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServiceTemplateDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Service Templates]
      operationId: createServiceTemplate
      summary: Register a new service template (template.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceTemplateInput"
      responses:
        "201":
          description: Service template registered
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ServiceTemplateDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/audit:
    get:
      tags: [Admin Audit]
      operationId: listAdminAudit
      summary: Query platform immutable audit events (audit.read)
      parameters:
        - in: query
          name: organizationId
          schema:
            type: string
        - in: query
          name: action
          schema:
            type: string
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated audit events
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEventDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}:
    get:
      tags: [Organizations]
      operationId: getOrganization
      summary: Retrieve tenant organization details and quotas (organization.read)
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
      responses:
        "200":
          description: Organization details
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/OrganizationDetailDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Anti-BOLA not found if caller lacks access (AC-F1-02)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/capabilities:
    get:
      tags: [Organizations]
      operationId: getOrganizationCapabilities
      summary: Retrieve organization runtime feature capabilities (organization.read)
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
      responses:
        "200":
          description: Organization runtime and deferred capability flags (AC-F2-10)
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/OrganizationCapabilitiesDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/secrets:
    get:
      tags: [Secrets]
      operationId: listOrganizationSecrets
      summary: List write-only encrypted secrets metadata for organization (service.configuration.manage)
      description: >-
        Returns metadata only (`secretKey`, `version`, `keyVersion`, `siteId`, timestamps).
        Plaintext secret values, ciphertexts, IVs, and authentication tags are never returned (AC-F2-05).
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - in: query
          name: siteId
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated encrypted secret metadata list
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EncryptedSecretMetadataDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Secrets]
      operationId: upsertOrganizationSecret
      summary: Create or rotate an AES-256-GCM encrypted secret (service.configuration.manage)
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertEncryptedSecretInput"
      responses:
        "201":
          description: Encrypted secret created or rotated (metadata only)
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
