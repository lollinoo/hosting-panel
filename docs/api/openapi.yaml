    SiteFilePath:
      type: string
      maxLength: 1024
      description: >-
        Path relative to the site's files (`""` is the root), `/`-separated, and traveling
        in the query or request body. Consecutive slashes and a trailing slash are
        normalized; leading `/`, `.` or `..` segments, segments starting with `.htpanel-`,
        control characters (`0x00`-`0x1F`, `0x7F`), and segments exceeding 255 UTF-8 bytes
        are rejected.

    SiteFileItemPath:
      type: string
      minLength: 1
      maxLength: 1024
      description: >-
        Non-empty relative path to an entry inside the site's files (`""` is rejected).
        Follows the same normalization and segment rules as `SiteFilePath`.

    SiteFileZipPath:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: "\\.[zZ][iI][pP]$"
      description: >-
        Non-empty relative path ending with `.zip` (case-insensitive) inside the site's
        files. Follows the same rules as `SiteFileItemPath`.

    SiteFileErrorReason:
      type: string
      description: Closed refusal reason token returned in `error.details[].reason` for file operations
      enum:
        - invalid_path
        - not_found
        - exists
        - not_a_directory
        - is_a_directory
        - protected
        - too_large
        - archive_limit
        - upload_mismatch
        - not_a_zip
        - disk_full
        - archive_unsafe
        - zip_unavailable
        - not_ready

    SiteFileEntryDto:
      type: object
      additionalProperties: false
      required: [name, kind, size, modifiedAt, writable]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        kind:
          type: string
          enum: [file, dir, link, other]
        size:
          type: integer
          minimum: 0
        modifiedAt:
          type: string
          format: date-time
        writable:
          type: boolean

    SiteFileListDto:
      type: object
      additionalProperties: false
      required: [entries, truncated]
      properties:
        entries:
          type: array
          description: Directory entries (sorted directories-first, capped at 5,000 per listing)
          items:
            $ref: "#/components/schemas/SiteFileEntryDto"
        truncated:
          type: boolean

    SiteFileChunkDto:
      type: object
      additionalProperties: false
      required: [dataBase64, size, eof]
      properties:
        dataBase64:
          type: string
          description: Base64-encoded chunk bytes (at most 524,288 bytes / 512 KiB before base64)
        size:
          type: integer
          minimum: 0
          description: Total file size in bytes
        eof:
          type: boolean

    SiteFileWriteRequest:
      type: object
      additionalProperties: false
      required: [path, uploadId, offset, dataBase64, final, overwrite]
      description: >-
        Chunked file upload payload. Uploads are addressed by `uploadId` and `offset` and
        are safe to resend. A chunk is at most 512 KiB (524,288 bytes) before base64;
        maximum total file size is 2 GiB (2,147,483,648 bytes).
      properties:
        path:
          $ref: "#/components/schemas/SiteFileItemPath"
        uploadId:
          type: string
          minLength: 16
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]{16,64}$"
        offset:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        dataBase64:
          type: string
          maxLength: 699052
          pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
          description: "Base64-encoded chunk bytes (at most 524,288 bytes / 512 KiB before base64; empty allowed on `final: true`)"
        final:
          type: boolean
        overwrite:
          type: boolean

    SiteFileWriteResultDto:
      type: object
      additionalProperties: false
      required: [received]
      properties:
        received:
          type: integer
          minimum: 0
          description: Staged byte count after writing the chunk (or final file size when `final` is `true`)

    SiteFileFolderRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          $ref: "#/components/schemas/SiteFileItemPath"

    SiteFileMoveRequest:
      type: object
      additionalProperties: false
      required: [from, to]
      description: "`to` must differ from `from` and cannot lie inside `from/`."
      properties:
        from:
          $ref: "#/components/schemas/SiteFileItemPath"
        to:
          $ref: "#/components/schemas/SiteFileItemPath"

    SiteFileDeleteRequest:
      type: object
      additionalProperties: false
      required: [paths]
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SiteFileItemPath"

    SiteFileArchiveRequest:
      type: object
      additionalProperties: false
      required: [paths, to]
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SiteFileItemPath"
        to:
          $ref: "#/components/schemas/SiteFileZipPath"

    SiteFileExtractRequest:
