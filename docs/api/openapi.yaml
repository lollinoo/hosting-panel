      summary: List site databases, database users, grants, and phpMyAdmin availability (site.databases.manage)
      description: >-
        Returns the site's database name prefix, databases with byte sizes, database users
        with granted database names, custom quotas, and whether phpMyAdmin sign-on is
        available on the active backend. Allowed while a site is `deploying` or in
        `maintenance`. Never exposes password hashes or credentials.
      parameters:
