        - $ref: "#/components/parameters/SiteIdParam"
      responses:
        "200":
          description: Site database state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteDatabasesDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.databases.manage` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Organization or site not found (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Database runtime unavailable on the active backend (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: Executor or MariaDB service unavailable (`DOCKER_ENGINE_UNAVAILABLE`, retryable)
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Managed Sites]
      operationId: createSiteDatabase
      summary: Create a custom site database (site.databases.manage)
      description: >-
        Creates a MariaDB database named `<prefix>_<suffix>`. Refused with `409 RESOURCE_LOCKED`
        (`reason: not_ready`) while the site is `deploying` or in `maintenance`.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteDatabaseRequest"
      responses:
        "201":
          description: Custom database created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteDatabaseCreatedDto"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.databases.manage` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Organization or site not found (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Site locked in `deploying` or `maintenance` (`RESOURCE_LOCKED`, `reason: not_ready`),
            duplicate database name (`ALREADY_EXISTS`), or custom database limit reached
            (`QUOTA_EXCEEDED`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Database runtime unavailable on the active backend (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: Executor or MariaDB service unavailable or outcome unclear (`DOCKER_ENGINE_UNAVAILABLE`, retryable)
          $ref: "#/components/responses/ErrorResponse"

