          type: array
          items:
            type: string
        wildcard:
          type: boolean
        notBefore:
          type: string
          format: date-time
        notAfter:
          type: string
          format: date-time
        serialNumber:
          type: string
        fingerprintSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        keyType:
          type: string
          enum: [rsa, ec]
        keyBits:
          type: integer
        createdAt:
          type: string
          format: date-time
        activatedAt:
          type: string
          format: date-time
          nullable: true
        problem:
          type: string
          nullable: true
          description: The last apply problem recorded on this version (`apply_failed`, `sni_mismatch`, ...)

    TlsCertificateDto:
      type: object
      required: [id, name, source, createdForSiteId, activeVersionId, versions, coveredDomains, assignedDomains, expiry, warnings, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        source:
          type: string
          enum: [manual]
        createdForSiteId:
          type: string
          nullable: true
        activeVersionId:
          type: string
          nullable: true
        versions:
          type: array
          description: Oldest first. Never carries the certificate text or the key
          items:
            $ref: "#/components/schemas/TlsCertificateVersionDto"
        coveredDomains:
          type: array
          description: Domains of the organization whose hostname some version of this certificate covers
          items:
            type: object
            required: [domainId, hostname, assigned, versionId]
            properties:
              domainId:
                type: string
              hostname:
                type: string
              assigned:
                type: boolean
              versionId:
                type: string
                nullable: true
        assignedDomains:
          type: array
          description: Domains (any site of the organization) that serve a version of this certificate
          items:
            type: object
            required: [domainId, siteId, siteName, hostname, versionId]
            properties:
              domainId:
                type: string
              siteId:
                type: string
              siteName:
                type: string
              hostname:
                type: string
              versionId:
                type: string
        expiry:
          type: object
          nullable: true
          required: [tier, daysLeft]
          properties:
            tier:
              type: string
              enum: [ok, notice, warning, critical, expired]
            daysLeft:
              type: integer
        warnings:
          type: array
          items:
            type: string
            enum: [expiring, expired, covers_unassigned_domains]
        updatedAt:
          type: string
          format: date-time

    AdminTlsInventoryItemDto:
      type: object
      required: [source, certificateId, name, organizationId, organizationName, siteId, siteName, hostnames, issuer, wildcard, notAfter, status, tier]
      properties:
        source:
          type: string
          enum: [manual, acme]
        certificateId:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        organizationId:
