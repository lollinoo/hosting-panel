  /v1/organizations/{orgId}/app-stacks/{stackId}/upgrade:
    post:
      tags: [App Stacks]
      operationId: upgradeAppStack
      summary: Move an application to a newer version of its template (app.update; audited as app.stack.upgrade)
      description: >-
        Send the `planHash` of the preview (`POST .../plan` with the same `templateVersionId` and `parameters`); a
        plan that changed since is refused (`VALIDATION_ERROR`, `details[0].field: planHash`,
        `details[0].reason: plan_changed`). Without `parameters` the stored settings the new version still declares
        are carried over. `secrets` carries exactly the private values the preview names in `newSecrets`; each is
        stored as version 1 of an ordinary private value in the transaction that queues the upgrade (a refused request
        stores nothing; an upgrade taken back keeps it, and the next preview no longer asks for it). Refusals, with
        `details[].field: secrets.<key>`: one that is missing (`STACK_SECRET_MISSING`, one detail per value), a key
        that is not a private value of the new version or that the customer may not set (`STACK_PARAMETER_INVALID`),
        an optional one, set among the private values after the upgrade, whether or not the application has a value
        for it already (`secret_not_needed`), and a value over 4096 UTF-8 bytes that the new version puts in an
        environment variable, or over 24576 for any other (`value_too_long`, with `details[0].limit` `environment` or
        `store`, the bound it passed). A value shorter than 6 characters, the shortest the log reader masks, is refused
        (`VALIDATION_ERROR`, `details[0].field: secrets.<key>`, `details[0].reason: value_too_short`), is not echoed,
        and nothing is stored or queued. A value the new version requires that
        the application has already (stored since the preview, e.g. by an upgrade taken back) means the preview is
        stale and is refused like a changed plan (`details[0].field: planHash`, `details[0].reason: plan_changed`);
        only such a value is, since no preview asks for any other. The values are never returned, logged or audited (the audit names each
        key and its version as `app.stack.secret.rotate`), and the request hash of the Idempotency-Key covers their keys only: the same key
        with other values replays the first request. Other refusals on `templateVersionId` are `unknown_version`, `not_newer`,
        `STACK_TEMPLATE_UNPUBLISHED` and `STACK_TEMPLATE_INVALID`; a web address whose entry point the new version
        drops is refused with `domain_target_removed`, and a path of a web address whose entry point it drops with
        `path_target_removed` (`details[0].field: domains`). When every such address is one being removed, the refusal
        is 409 `RESOURCE_LOCKED` with `address_removing` instead: its row goes once its route is withdrawn, so the same
        upgrade is normally accepted a few minutes later; while the application is `failed`, or after a stop that
        failed before it withdrew the routes, only once a start, a restart or a stop of the application succeeds. A
        database that an application still uses is refused with
        `database_in_use` (`details[0].field: links`) when the new version is no longer one component with one port.
        Volumes are never removed by an upgrade. Returns 422
        NOT_SUPPORTED (reason STACK_UNSUPPORTED_FEATURE) while the capability flag `applicationStacksAvailable` is
        false.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/AppStackIdParam"
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeAppStackInput"
      responses:
        "202":
          description: Accepted; follow the returned operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppStackAcceptedEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Another operation is running, the status does not allow it, or only web addresses being removed still point at what the new revision drops (`RESOURCE_LOCKED`; `details[0].reason: address_removing` for the last), the plan exceeds the allocation (`QUOTA_EXCEEDED`), or the Idempotency-Key was used for another request (`IDEMPOTENCY_CONFLICT`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: "Applications are not available yet (`NOT_SUPPORTED`, `details[0].reason: STACK_UNSUPPORTED_FEATURE`)"
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/app-stacks/{stackId}/rollback:
    post:
      tags: [App Stacks]
      operationId: rollbackAppStack
      summary: Deploy an earlier revision of an application again, with the settings it had (app.update; audited as app.stack.rollback)
      description: >-
        Send the `planHash` of the preview (`POST .../plan` with the same `revisionId`); a plan that changed since is
        refused (`details[0].reason: plan_changed`). Other refusals on `revisionId` are `unknown_revision`,
        `already_current`, `STACK_IMAGE_NOT_ALLOWED` (software no longer allowed) and `STACK_TEMPLATE_INVALID` (its
        template version no longer passes today's checks); a web address whose entry point that revision lacks is
        refused with `domain_target_removed`, and a path of a web address whose entry point it lacks with
        `path_target_removed`; when every such address is one being removed, with 409 `RESOURCE_LOCKED`,
        `address_removing`, until its route is withdrawn. A database that an application still uses is refused with `database_in_use`
        (`details[0].field: links`) when that revision is not one component with one port. Volume data is never
        touched. Returns 422 NOT_SUPPORTED (reason
        STACK_UNSUPPORTED_FEATURE) while the capability flag `applicationStacksAvailable` is false.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/AppStackIdParam"
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackAppStackInput"
      responses:
        "202":
          description: Accepted; follow the returned operation
