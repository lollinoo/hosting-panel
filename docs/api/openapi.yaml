components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    XRequestId:
      description: Unique correlation request ID
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying after reaching a per-site rate limit (`QUOTA_EXCEEDED`)
      schema:
        type: integer
        minimum: 1

  parameters:
    OrgIdParam:
      in: path
      name: orgId
      required: true
      schema:
        type: string
    NotificationChannelParam:
      in: path
      name: channel
      required: true
      schema:
        type: string
        enum: [email, webhook, telegram]
    HostIdParam:
      in: path
      name: hostId
      required: true
      schema:
        type: string
    SiteIdParam:
      in: path
      name: siteId
      required: true
      schema:
        type: string
    BackupIdParam:
      in: path
      name: backupId
      required: true
      schema:
        type: string
    BackupTargetIdParam:
      in: path
      name: targetId
      required: true
      schema:
        $ref: "#/components/schemas/BackupTargetId"
    BackupPolicyScopeParam:
      in: path
      name: scope
      required: true
      schema:
        type: string
        enum: [default, panel]
    DomainIdParam:
      in: path
      name: domainId
      required: true
      schema:
        type: string
    CertificateIdParam:
      in: path
      name: certificateId
      required: true
      schema:
        type: string
    VersionIdParam:
      in: path
      name: versionId
      required: true
      schema:
        type: string
    SiteTemplateIdParam:
      in: path
      name: templateId
      required: true
      schema:
        type: string
    SiteTemplateVersionIdParam:
      in: path
      name: versionId
      required: true
      schema:
        type: string
    AppTemplateIdParam:
      in: path
      name: templateId
      required: true
      schema:
        type: string
    AppTemplateVersionIdParam:
      in: path
      name: versionId
      required: true
      schema:
        type: string
    AppStackIdParam:
      in: path
      name: stackId
      required: true
      schema:
        type: string
    AppStackLinkIdParam:
      in: path
      name: linkId
      required: true
      schema:
        type: string
    AppStackComponentKeyParam:
      in: path
      name: componentKey
      required: true
      schema:
        type: string
    AppStackTaskKeyParam:
      in: path
      name: taskKey
      required: true
      description: The key of a task the template version of the installed revision declares
      schema:
        type: string
    UserIdParam:
      in: path
      name: userId
      required: true
      schema:
        type: string
    ServiceIdParam:
      in: path
      name: serviceId
      required: true
      schema:
        type: string
    SecretIdParam:
      in: path
      name: secretId
      required: true
      schema:
        type: string
    TerminalSessionIdParam:
      in: path
      name: sessionId
      required: true
      description: '`term_` and 32 hex characters; any other value is `NOT_FOUND`'
      schema:
        type: string
    FirewallPortNameParam:
      in: path
      name: name
      required: true
      description: >-
        A port of the safe list: `http_alt` 8080, `https_alt` 8443, `node_exporter` 9100,
        `zabbix_agent` 10050, `checkmk_agent` 6556, `nrpe` 5666 (all TCP)
      schema:
        type: string
        enum: [http_alt, https_alt, node_exporter, zabbix_agent, checkmk_agent, nrpe]
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
    IdempotencyKeyRuntimeHeader:
      in: header
      name: Idempotency-Key
      required: false
      description: Required when runtime execution is enabled (`runtimeBackend != 'disabled'`)
      schema:
        type: string
    CursorQuery:
      in: query
      name: cursor
      schema:
        type: string
    LimitQuery:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  responses:
    ErrorResponse:
      description: Standard normalized RFC-style error envelope
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    QuotaConflictErrorResponse:
      description: Standard normalized RFC-style error envelope with `Retry-After` header for hourly heavy-action limit (`QUOTA_EXCEEDED`)
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"

  schemas:
    ApiErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiErrorBody"

    ApiErrorBody:
      type: object
      required: [code, message, requestId, retryable, details]
      properties:
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - INVALID_CREDENTIALS
            - ACCOUNT_LOCKED
            - TOTP_INVALID
            - ACCOUNT_SETUP_INCOMPLETE
            - PASSWORD_CHANGE_REQUIRED
            - PASSWORD_RESET_INVALID
            - PERMISSION_DENIED
            - HOST_POLICY_DENIED
            - ORGANIZATION_SUSPENDED
            - NOT_FOUND
            - VALIDATION_ERROR
            - IDEMPOTENCY_CONFLICT
            - RESOURCE_LOCKED
            - QUOTA_EXCEEDED
            - DEDICATED_HOST_OCCUPIED
            - SHARED_MODE_GATED
            - DOMAIN_CONFLICT
            - ALREADY_EXISTS
            - LAST_OWNER_PROTECTED
            - LAST_ADMINISTRATOR_PROTECTED
            - PANEL_CONTAINER_ABSENT
            - FIREWALL_BASE_RULES_NOT_CURRENT
            - HOST_JOB_FAILED
            - RATE_LIMITED
            - NOT_SUPPORTED
            - OPERATION_INTERRUPTED
            - OPERATION_AMBIGUOUS
            - DOCKER_ENGINE_UNAVAILABLE
            - MAIL_RELAY_UNAVAILABLE
            - HOST_AGENT_UNAVAILABLE
            - INTERNAL_ERROR
            - CERTIFICATE_INVALID
            - CERTIFICATE_KEY_MISMATCH
            - CERTIFICATE_CHAIN_INVALID
            - CERTIFICATE_NOT_YET_VALID
            - CERTIFICATE_EXPIRED
            - CERTIFICATE_HOSTNAME_MISMATCH
            - CERTIFICATE_IN_USE
            - CERTIFICATE_APPLY_FAILED
            - CERTIFICATE_SNI_MISMATCH
            - CERTIFICATE_UPLOAD_TOO_LARGE
            - CERTIFICATE_FORMAT_UNSUPPORTED
            - BACKUP_TARGET_IN_USE
        message:
          type: string
        requestId:
          type: string
        retryable:
          type: boolean
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      required: [message]
      properties:
        field:
          type: string
        message:
          type: string
        reason:
          type: string
          description: >-
            A stable machine reason. For `CERTIFICATE_*` errors (the PEM and the field in `field`, never the
            material) it is one of: nul_byte, not_pem, wrong_block_type, multiple_blocks, too_many_intermediates,
            encrypted_key, format_unsupported, parse_failed, key_parse_failed, key_algorithm, key_mismatch,
            leaf_is_ca, eku_not_server_auth, not_yet_valid, expired, expires_within_24h, no_dns_san, too_many_sans,
            unsupported_wildcard, san_invalid, cn_not_in_san, ip_san_unsupported, untrusted_or_incomplete,
            chain_expired, bad_signature, verify_timeout, chain_invalid, not_covered, domain_not_active,
            duplicate_certificate, manual_overlap, captures_host, acme_certificate_conflict, not_served,
            proxy_start_restored
        limit:
          type: string
          enum: [environment, store]
          description: >-
            Only with `reason: value_too_long` on a private value of an application (its private values route and the
            `secrets` of an upgrade): the bound the value passed. `environment`: a value the application reads from a
            component's environment, at most 4096 UTF-8 bytes; `store`: any other value, at most 24576 UTF-8 bytes,
            the bound of the store.

