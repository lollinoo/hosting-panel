openapi: 3.1.0
info:
  title: Hosting Control Panel API
  version: 0.3.0
  summary: Docker-Native Control Plane API (HCP-SPEC-003 Phase 2)
  description: >-
    Versioned `/v1` Docker-native control-plane REST API enforcing strict tenant
    organization isolation, default-deny RBAC/ABAC authorization, transactional
    host placement and quota reservations, immutable stack revisions, write-only
    AES-256-GCM encrypted secrets, transactional outbox lifecycle operations over
    signed Unix Domain Socket IPC (`docker-executor` and `host-agent`), `unknown`
    crash recovery, and observe-only drift reconciliation. Shared hosting, ACME
    TLS, SFTP, and production backups remain gated (`false`).
servers:
  - url: http://127.0.0.1:4000
    description: Local embedded control-plane development server

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Liveness and database readiness probes
  - name: Auth
    description: Authentication, Dev OIDC token issuance, and token revocation
  - name: Account
    description: Self-service password, two-factor authentication and language
  - name: Admin Users
    description: Account administration by the server administrator
  - name: Identity
    description: Principal identity, assigned roles, and tenant memberships
  - name: Hosts
    description: Linux host nodes, telemetry, maintenance, security posture, operations, and allocations
  - name: Service Templates
    description: Approved service catalog templates
  - name: Admin Audit
    description: Platform-wide immutable audit trail
  - name: Organizations
    description: Tenant organizations, capabilities, quotas, and members
  - name: Secrets
    description: Write-only AES-256-GCM encrypted secrets metadata
  - name: Sites
    description: Composite application sites, domains, and aggregate drift status
  - name: Managed Sites
    description: WordPress sites created, controlled and deleted by customers (async, 202 + operation)
  - name: Admin Sites
    description: Server administrator view over all WordPress sites, creation for a customer and ownership moves
  - name: Services
    description: Declarative service instances, immutable revisions, and async lifecycle
  - name: Operations
    description: Asynchronous operations and timeline progress

paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getHealthLive
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [status, service, spec, phase, timestamp]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: hosting-panel-api
                  spec:
                    type: string
                    enum: [HCP-SPEC-002, HCP-SPEC-003]
                  phase:
                    type: string
                    enum: [phase-1, phase-2]
                  runtimeBackend:
                    $ref: "#/components/schemas/RuntimeBackend"
                  timestamp:
                    type: string
                    format: date-time

  /health/ready:
    get:
      tags: [Health]
      operationId: getHealthReady
      summary: Readiness probe verifying PostgreSQL connectivity
      security: []
      responses:
        "200":
          description: Control-plane database is reachable
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [status, database, mode, timestamp]
                properties:
                  status:
                    type: string
                    const: ready
                  database:
                    type: string
                    const: up
                  mode:
                    type: string
                    enum: [pglite, postgres]
                  timestamp:
                    type: string
                    format: date-time
        "500":
          $ref: "#/components/responses/ErrorResponse"

  /v1/dev/auth/personas:
    get:
      tags: [Auth]
      operationId: getDevPersonas
      summary: List seeded personas for local development authentication
      security: []
      responses:
        "200":
          description: List of available personas
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DevPersonaDto"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/dev/auth/token:
    post:
      tags: [Auth]
      operationId: issueDevToken
      summary: Mint an RS256 Bearer JWT for a development persona
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                email:
                  type: string
                  format: email
                expiresInSeconds:
                  type: integer
                  minimum: 1
                  maximum: 86400
      responses:
        "200":
          description: Token successfully issued
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [accessToken, tokenType, expiresIn, expiresAt, issuer, audience, user]
                    properties:
                      accessToken:
                        type: string
                      tokenType:
                        type: string
                        const: Bearer
                      expiresIn:
                        type: integer
                      expiresAt:
                        type: string
                        format: date-time
                      issuer:
                        type: string
                      audience:
                        type: string
                      user:
                        type: object
                        required: [id, email, name]
                        properties:
                          id:
                            type: string
                          email:
                            type: string
                            format: email
                          name:
                            type: string
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/auth/revoke:
    post:
      tags: [Auth]
      operationId: revokeCurrentToken
      summary: Immediately revoke the caller's active JWT jti
      responses:
        "200":
          description: Token successfully revoked
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [revoked, revokedAt]
                    properties:
                      revoked:
                        type: boolean
                        const: true
                      revokedAt:
                        type: string
                        format: date-time
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Email and password login (TOTP code required for accounts with 2FA)
      description: >-
        Returns `totp_required` when the account has 2FA enabled and no `totpCode` was sent.
        5 failures in 15 minutes lock the account (`ACCOUNT_LOCKED`, 423); TOTP guesses have a separate counter.
        Server administrators without enrolled 2FA get `ACCOUNT_SETUP_INCOMPLETE` (403).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                totpCode:
                  type: string
                  pattern: "^\\d{6}$"
      responses:
        "200":
          description: Login result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - type: object
                        required: [status, accessToken, expiresAt, mustChangePassword]
                        properties:
                          status:
                            type: string
                            const: ok
                          accessToken:
                            type: string
                          expiresAt:
                            type: string
                            format: date-time
                          mustChangePassword:
                            type: boolean
                      - type: object
                        required: [status]
                        properties:
                          status:
                            type: string
                            const: totp_required
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "423":
          $ref: "#/components/responses/ErrorResponse"

  /v1/me/password:
    post:
      tags: [Account]
      operationId: changeMyPassword
      summary: Change own password (min 12 chars); revokes the other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 12
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "423":
          $ref: "#/components/responses/ErrorResponse"

  /v1/me/totp/setup:
    post:
      tags: [Account]
      operationId: setupMyTotp
      summary: Generate a TOTP secret (not active until enabled)
      responses:
        "200":
          description: Secret and otpauth URI
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [secretBase32, otpauthUri]
                    properties:
                      secretBase32:
                        type: string
                      otpauthUri:
                        type: string
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /v1/me/totp/enable:
    post:
      tags: [Account]
      operationId: enableMyTotp
      summary: Enable 2FA by confirming a code from the authenticator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "204":
          description: 2FA enabled
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "423":
          $ref: "#/components/responses/ErrorResponse"

  /v1/me/totp/disable:
    post:
      tags: [Account]
      operationId: disableMyTotp
      summary: Disable 2FA (customers only; server administrators must keep it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password:
                  type: string
                code:
                  type: string
      responses:
        "204":
          description: 2FA disabled
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "423":
          $ref: "#/components/responses/ErrorResponse"

  /v1/me/locale:
    patch:
      tags: [Account]
      operationId: setMyLocale
      summary: Set the UI language of the caller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale:
                  type: string
                  enum: [it, en]
      responses:
        "204":
          description: Locale updated
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/users:
    get:
      tags: [Admin Users]
      operationId: listAdminUsers
      summary: List all accounts (platform.users.manage)
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUserDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/customer-account:
    post:
      tags: [Admin Users]
      operationId: createCustomerAccount
      summary: Create the customer organization and its hosting admin (one customer per server)
      description: The temporary password is returned once; the user must change it at first login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationName, ownerName, ownerEmail]
              properties:
                organizationName:
                  type: string
                ownerName:
                  type: string
                ownerEmail:
                  type: string
                  format: email
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [organizationId, userId, temporaryPassword]
                    properties:
                      organizationId:
                        type: string
                      userId:
                        type: string
                      temporaryPassword:
                        type: string
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/users/{userId}:
    patch:
      tags: [Admin Users]
      operationId: updateAdminUserStatus
      summary: Enable or disable an account (disabling revokes its sessions)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AdminUserDto"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/users/{userId}/reset-password:
    post:
      tags: [Admin Users]
      operationId: resetAdminUserPassword
      summary: Issue a new temporary password (returned once)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Temporary password
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [temporaryPassword]
                    properties:
                      temporaryPassword:
                        type: string
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/users/{userId}/reset-totp:
    post:
      tags: [Admin Users]
      operationId: resetAdminUserTotp
      summary: Remove a customer's 2FA (server administrators recover via the SSH CLI only)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 2FA reset
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Retrieve current authenticated principal details and memberships
      responses:
        "200":
          description: Principal context
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MeDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /v1/me/organizations:
    get:
      tags: [Identity]
      operationId: getMyOrganizations
      summary: List organizations where caller holds active membership
      parameters:
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated organization summaries
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationSummaryDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /v1/hosts:
    get:
      tags: [Hosts]
      operationId: listHosts
      summary: List managed physical/virtual Linux host nodes (host.read)
      parameters:
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated host nodes
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/HostDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /v1/hosts/{hostId}:
    get:
      tags: [Hosts]
      operationId: getHost
      summary: Retrieve specific host details (host.read)
      parameters:
        - $ref: "#/components/parameters/HostIdParam"
      responses:
        "200":
          description: Host details
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/HostDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/hosts/{hostId}/telemetry:
    get:
      tags: [Hosts]
      operationId: getHostTelemetry
      summary: Retrieve host telemetry snapshot and daemon heartbeats (host.metrics.read)
      parameters:
        - $ref: "#/components/parameters/HostIdParam"
      responses:
        "200":
          description: Host telemetry and daemon heartbeats
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [hostId, runtimeBackend, telemetry, daemons]
                    properties:
                      hostId:
                        type: string
                      runtimeBackend:
                        $ref: "#/components/schemas/RuntimeBackend"
                      telemetry:
                        $ref: "#/components/schemas/HostTelemetryDto"
                        nullable: true
                      daemons:
                        type: array
                        items:
                          $ref: "#/components/schemas/HostDaemonHeartbeatDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/hosts/{hostId}/mode:
    patch:
      tags: [Hosts]
      operationId: updateHostMode
      summary: Update host hosting mode transition (host.security.manage)
      parameters:
        - $ref: "#/components/parameters/HostIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHostModeInput"
      responses:
        "200":
          description: Host mode updated or noop
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/HostDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Shared mode transition gated (AC-F1-06 / AC-F2-10)
          $ref: "#/components/responses/ErrorResponse"

  /v1/hosts/{hostId}/maintenance:
    post:
      tags: [Hosts]
      operationId: executeHostMaintenance
      summary: Enqueue allowlisted host maintenance operation (host.maintenance.execute)
      parameters:
        - $ref: "#/components/parameters/HostIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyRuntimeHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostMaintenanceInput"
      responses:
        "202":
          description: Host maintenance operation queued via transactional outbox (AC-F2-04)
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAcceptedEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Permission denied or unapproved maintenance action (HOST_POLICY_DENIED)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Resource locked or idempotency conflict (RESOURCE_LOCKED / IDEMPOTENCY_CONFLICT)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Host agent runtime disabled (NOT_SUPPORTED)
          $ref: "#/components/responses/ErrorResponse"

  /v1/hosts/{hostId}/security:
    post:
      tags: [Hosts]
      operationId: executeHostSecurity
      summary: Enqueue allowlisted host security posture operation (host.security.manage)
      parameters:
        - $ref: "#/components/parameters/HostIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyRuntimeHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostSecurityInput"
      responses:
        "202":
          description: Host security operation queued via transactional outbox (AC-F2-04)
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAcceptedEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Permission denied or unapproved security policy (HOST_POLICY_DENIED)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Resource locked or idempotency conflict (RESOURCE_LOCKED / IDEMPOTENCY_CONFLICT)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Host agent runtime disabled (NOT_SUPPORTED)
          $ref: "#/components/responses/ErrorResponse"

  /v1/hosts/{hostId}/operations:
    get:
      tags: [Hosts, Operations]
      operationId: listHostOperations
      summary: List asynchronous operations targeting a host (operation.read)
      parameters:
        - $ref: "#/components/parameters/HostIdParam"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated host operations
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OperationDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/hosts/{hostId}/operations/{opId}:
    get:
      tags: [Hosts, Operations]
      operationId: getHostOperation
      summary: Retrieve specific host operation timeline and progress (operation.read)
      parameters:
        - $ref: "#/components/parameters/HostIdParam"
        - in: path
          name: opId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Host operation details and timeline steps
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/OperationDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/allocations:
    get:
      tags: [Hosts]
      operationId: listAllocations
      summary: List all host allocations across platform (allocation.read)
      parameters:
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated host allocations
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, page]
                properties:
                  data:
