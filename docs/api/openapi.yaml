          enum: [active, inactive, active-network, must-use, dropin, parent]
        version:
          type: string
          nullable: true
        updateVersion:
          type: string
          nullable: true

    SiteWordpressStateDto:
      type: object
      additionalProperties: false
      required: [checkedAt, coreVersion, coreUpdate, updatesKnown, plugins, themes, administrators, problem]
      properties:
        checkedAt:
          type: string
          format: date-time
        coreVersion:
          type: string
          nullable: true
          description: null only when the check stored a problem
        coreUpdate:
          type: string
          nullable: true
        updatesKnown:
          type: boolean
        plugins:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/SiteWordpressPlugin"
        themes:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/SiteWordpressPlugin"
        administrators:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [id, login]
            properties:
              id:
                type: integer
                minimum: 1
              login:
                type: string
        problem:
          $ref: "#/components/schemas/SiteWordpressProblem"
          nullable: true

    SiteWordpressProblem:
      type: string
      enum:
        - wordpress_org_unreachable
        - config_broken
        - database_unreachable
        - not_installed
        - backup_failed
        - items_failed
        - item_unknown
        - outcome_unknown
        - interrupted

    SiteWordpressUpdateRequest:
      type: object
      additionalProperties: false
      required: [scope]
      description: "`name` is required for `plugin` and `theme` and forbidden otherwise."
      properties:
        scope:
          type: string
          enum: [all, core, plugin, theme]
        name:
          type: string
          pattern: "^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}$"

    SiteWordpressLastUpdateDto:
      type: object
      additionalProperties: false
      required: [operationId, target, status, finishedAt, problem, backup, items]
      properties:
        operationId:
          type: string
        target:
          $ref: "#/components/schemas/SiteWordpressUpdateRequest"
        status:
          type: string
          enum: [succeeded, failed]
        finishedAt:
          type: string
          format: date-time
        problem:
          $ref: "#/components/schemas/SiteWordpressProblem"
          nullable: true
        backup:
          type: string
          enum: [taken, skipped, failed]
        items:
          type: array
          maxItems: 701
          items:
            type: object
            additionalProperties: false
            required: [type, name, oldVersion, newVersion, status]
            properties:
              type:
                type: string
                enum: [core, plugin, theme]
              name:
                type: string
              oldVersion:
                type: string
                nullable: true
              newVersion:
                type: string
                nullable: true
              status:
                type: string
                enum: [updated, failed]

    SiteWordpressDto:
      type: object
      additionalProperties: false
      required: [backupsConfigured, state, runningOperation, lastUpdate]
      properties:
        backupsConfigured:
          type: boolean
        state:
          $ref: "#/components/schemas/SiteWordpressStateDto"
          nullable: true
        runningOperation:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, kind, status, steps]
          properties:
            id:
              type: string
            kind:
              type: string
              enum: [site.wordpress.inspect, site.wordpress.update]
            status:
              type: string
            steps:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [key, status]
                properties:
                  key:
                    type: string
                    enum: [inspect, backup, update, settle]
                  status:
                    type: string
        lastUpdate:
          $ref: "#/components/schemas/SiteWordpressLastUpdateDto"
          nullable: true

    SiteWordpressAcceptedDto:
      type: object
      additionalProperties: false
      required: [siteId, operationId]
      properties:
        siteId:
          type: string
        operationId:
          type: string

    SiteWordpressPasswordResetDto:
      type: object
      additionalProperties: false
      required: [temporaryPassword]
      properties:
        temporaryPassword:
          type: string
          minLength: 24
          description: One-time temporary password; shown once and never stored by the panel

    SiteWordpressImportSlotDto:
      type: object
      additionalProperties: false
      required: [state, size, uploadId]
      properties:
        state:
          type: string
          enum: [empty, partial, complete]
        size:
          type: integer
          minimum: 0
          description: Bytes held; a `partial` upload resumes at `offset = size`
        uploadId:
          type: string
          nullable: true
          pattern: "^[A-Za-z0-9_-]{16,64}$"
          description: The upload to resume, set only while the slot is `partial`

    SiteWordpressLastImportDto:
      type: object
      additionalProperties: false
      required: [operationId, finishedAt, outcome, reason, backup, oldAddress, leftOut, tables, line, errorNumber]
      properties:
        operationId:
          type: string
          pattern: "^op_[0-9a-f]{32}$"
        finishedAt:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [imported, nothing_changed, site_restored, undo_incomplete]
        reason:
          type: string
          nullable: true
          description: Closed reason of a failed import (null when imported)
          enum:
            - files_missing
            - earlier_import_unfinished
            - backup_failed
            - interrupted
            - timed_out
            - unavailable
            - other
            - archive_not_zip
            - dump_not_sql
            - archive_unsafe
            - archive_limit
            - archive_not_wordpress
            - disk_full
            - staging_unsafe
            - dump_unsafe
            - dump_too_large
            - dump_incomplete
            - dump_statement_unsupported
            - dump_load_failed
            - dump_not_wordpress
            - dump_ambiguous
            - multisite_unsupported
            - address_unsupported
            - dump_objects_unsupported
            - dump_names_unsupported
            - dump_too_many_tables
            - site_objects_unsupported
            - address_rewrite_failed
            - site_check_failed
        backup:
          type: string
          enum: [taken, skipped, failed]
        oldAddress:
          type: string
          nullable: true
          maxLength: 300
          description: The address the imported site had before (scheme, host and optional port)
        leftOut:
          type: array
          maxItems: 16
          description: Archive entries the import never takes, each the path from the site root
          items:
            type: string
            enum:
              - wp-config.php
              - ".htaccess"
              - ".maintenance"
              - wp-content/mu-plugins
              - wp-content/advanced-cache.php
              - wp-content/object-cache.php
              - wp-content/db.php
              - wp-content/db-error.php
              - wp-content/install.php
              - wp-content/maintenance.php
              - wp-content/php-error.php
              - wp-content/fatal-error-handler.php
              - wp-content/sunrise.php
              - wp-content/blog-deleted.php
              - wp-content/blog-inactive.php
              - wp-content/blog-suspended.php
        tables:
          type: integer
          minimum: 0
          nullable: true
        line:
          type: integer
          minimum: 0
          nullable: true
          description: Line of the database export where loading stopped
        errorNumber:
          type: integer
          minimum: 1
          maximum: 99999
          nullable: true
          description: Database error number where loading stopped

    SiteWordpressImportDto:
      type: object
      additionalProperties: false
      required: [available, backupsConfigured, slots, earlierImportUnfinished, runningOperation, lastImport]
      properties:
        available:
          type: boolean
        backupsConfigured:
          type: boolean
        slots:
          type: object
          nullable: true
          additionalProperties: false
          required: [archive, dump]
          description: Null when the site's files could not be read
          properties:
            archive:
              $ref: "#/components/schemas/SiteWordpressImportSlotDto"
            dump:
              $ref: "#/components/schemas/SiteWordpressImportSlotDto"
        earlierImportUnfinished:
          type: boolean
          description: An earlier import was left unfinished; restore a copy from Backups before a new import
        runningOperation:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, kind, status, steps]
          properties:
            id:
              type: string
            kind:
              type: string
              enum: [site.wordpress.import]
            status:
              type: string
            steps:
              type: array
              maxItems: 6
              items:
                type: object
                additionalProperties: false
                required: [key, status]
                properties:
                  key:
                    type: string
                    enum: [check, backup, unpack, database, switch, finish]
                  status:
                    type: string
        lastImport:
          $ref: "#/components/schemas/SiteWordpressLastImportDto"
          nullable: true

    SiteWordpressImportChunkRequest:
      type: object
      additionalProperties: false
      required: [uploadId, offset, dataBase64, final]
      description: A chunk is at most 512 KiB (524,288 bytes) before base64.
      properties:
        uploadId:
          type: string
          minLength: 16
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]{16,64}$"
        offset:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        dataBase64:
          type: string
          maxLength: 699052
          pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
        final:
          type: boolean

    SiteWordpressImportPickRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          $ref: "#/components/schemas/SiteFileItemPath"

    SiteWordpressImportStartRequest:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm:
          type: boolean
          enum: [true]

    SiteBackupAccepted:
      type: object
      required: [siteId, backupId, operationId]
      properties:
        siteId:
          type: string
        backupId:
          type: string
        operationId:
          type: string

    SiteDomainsDto:
      type: object
      required: [serverIpv4, routesPending, domains, mail]
      properties:
        mail:
          type: object
          required: [configured, fromAddress]
          properties:
            configured:
              type: boolean
            fromAddress:
              type: string
              nullable: true
        serverIpv4:
          type: string
        routesPending:
          type: boolean
        domains:
          type: array
          items:
            $ref: "#/components/schemas/SiteDomainDto"

    CreateManagedSiteInput:
      type: object
      required: [name, domain, title, adminUser, adminEmail, adminPassword]
      properties:
        name:
          type: string
          maxLength: 80
        domain:
          type: string
        includeWww:
          type: boolean
          default: false
          description: Also add `www.<domain>` as a second address of the site.
        phpVersion:
          type: string
          enum: ["8.3", "8.4", "8.5"]
          default: "8.4"
        title:
          type: string
          maxLength: 120
        adminUser:
          type: string
        adminEmail:
          type: string
          format: email
        adminPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true

    AdminCreateSiteInput:
      allOf:
        - $ref: "#/components/schemas/CreateManagedSiteInput"
        - type: object
          required: [ownerOrganizationId]
          properties:
            ownerOrganizationId:
              type: string
              nullable: true

    ChangeSiteOwnerInput:
      type: object
      required: [ownerOrganizationId]
      properties:
        ownerOrganizationId:
          type: string
          nullable: true

    SiteActionInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [start, stop, restart, retry]

    ChangeSiteRuntimeInput:
      type: object
      required: [phpVersion]
      properties:
        phpVersion:
          type: string
          enum: ["8.3", "8.4", "8.5"]

    DeleteSiteInput:
      type: object
      required: [confirmName]
      properties:
        confirmName:
          type: string

    SiteLogLineDto:
      type: object
      required: [at, stream, text]
      properties:
        at:
          type: string
          format: date-time
          nullable: true
        stream:
          type: string
          enum: [stdout, stderr]
        text:
          type: string

    SiteFilePath:
      type: string
      maxLength: 1024
      description: >-
        Path relative to the site's files (`""` is the root), `/`-separated, and traveling
        in the query or request body. Consecutive slashes and a trailing slash are
        normalized; leading `/`, `.` or `..` segments, segments starting with `.htpanel-`,
        control characters (`0x00`-`0x1F`, `0x7F`), and segments exceeding 255 UTF-8 bytes
        are rejected.

    SiteFileItemPath:
      type: string
      minLength: 1
      maxLength: 1024
      description: >-
        Non-empty relative path to an entry inside the site's files (`""` is rejected).
        Follows the same normalization and segment rules as `SiteFilePath`.

    SiteFileZipPath:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: "\\.[zZ][iI][pP]$"
      description: >-
        Non-empty relative path ending with `.zip` (case-insensitive) inside the site's
        files. Follows the same rules as `SiteFileItemPath`.

    SiteFileErrorReason:
      type: string
      description: Closed refusal reason token returned in `error.details[].reason` for file operations
      enum:
        - invalid_path
        - not_found
        - exists
        - not_a_directory
        - is_a_directory
        - protected
        - too_large
        - archive_limit
        - upload_mismatch
        - not_a_zip
        - disk_full
        - archive_unsafe
        - zip_unavailable
        - not_ready

    SiteFileEntryDto:
      type: object
      additionalProperties: false
      required: [name, kind, size, modifiedAt, writable]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        kind:
          type: string
          enum: [file, dir, link, other]
        size:
          type: integer
          minimum: 0
        modifiedAt:
          type: string
          format: date-time
        writable:
          type: boolean

    SiteFileListDto:
      type: object
      additionalProperties: false
      required: [entries, truncated]
      properties:
        entries:
          type: array
          description: Directory entries (sorted directories-first, capped at 5,000 per listing)
          items:
            $ref: "#/components/schemas/SiteFileEntryDto"
        truncated:
          type: boolean

    SiteFileChunkDto:
      type: object
      additionalProperties: false
      required: [dataBase64, size, eof]
      properties:
        dataBase64:
          type: string
          description: Base64-encoded chunk bytes (at most 524,288 bytes / 512 KiB before base64)
        size:
          type: integer
          minimum: 0
          description: Total file size in bytes
        eof:
          type: boolean

    SiteFileWriteRequest:
      type: object
      additionalProperties: false
      required: [path, uploadId, offset, dataBase64, final, overwrite]
      description: >-
        Chunked file upload payload. Uploads are addressed by `uploadId` and `offset` and
        are safe to resend. A chunk is at most 512 KiB (524,288 bytes) before base64;
        maximum total file size is 2 GiB (2,147,483,648 bytes).
      properties:
        path:
          $ref: "#/components/schemas/SiteFileItemPath"
        uploadId:
          type: string
          minLength: 16
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]{16,64}$"
        offset:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        dataBase64:
          type: string
          maxLength: 699052
          pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
          description: "Base64-encoded chunk bytes (at most 524,288 bytes / 512 KiB before base64; empty allowed on `final: true`)"
        final:
          type: boolean
        overwrite:
          type: boolean

    SiteFileWriteResultDto:
      type: object
      additionalProperties: false
      required: [received]
      properties:
        received:
          type: integer
          minimum: 0
          description: Staged byte count after writing the chunk (or final file size when `final` is `true`)

    SiteFileFolderRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
