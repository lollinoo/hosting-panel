            application/json:
              schema:
                type: object
                required: [data, moved]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteDomainsDto"
                  moved:
                    type: array
                    items:
                      $ref: "#/components/schemas/TlsMovedDomain"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: >-
            Missing `site.certificates.manage` on this site; the organization's other sites a change reaches need it too (`PERMISSION_DENIED`)
