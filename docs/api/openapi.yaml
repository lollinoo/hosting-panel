  /v1/admin/backups/sites/{siteId}/restore:
    post:
      tags: [Admin Backups]
      operationId: adminRestoreSiteBackup
      summary: Put back a site's named or newest succeeded copy, also where nothing of the site exists (server administrator only, 202 Accepted)
      description: |
        Steps, in order: `provision_database` (always; creates the site database and its user if missing), `restore`,
        `start_site` (only when the site is not running; never reinstalls), `update_address`, `sftp`.
        A step that is not needed is `skipped`. Audited as `admin.site.backups.restore.requested`
        and `admin.site.backups.restore.finished`. The customers' limit on heavy actions does not apply.
        A replay with the same `Idempotency-Key` and no `backupId` answers the first operation.
      parameters:
        - $ref: "#/components/parameters/SiteIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRestoreBackupInput"
      responses:
        "202":
          description: Accepted; restore queued via transactional outbox
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteBackupAccepted"
                  links:
                    type: object
                    properties:
                      operation:
                        type: string
        "400":
          description: >-
            No succeeded copy, or an unknown or not succeeded `backupId` (`VALIDATION_ERROR`,
            `details: [{field: backupId, message: no_succeeded_backup}]`); wrong name (`VALIDATION_ERROR`,
            `details: [{field: confirmName}]`); backup target not configured (`VALIDATION_ERROR`, message
            `not_configured`); invalid body; or missing/invalid `Idempotency-Key`
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Site deploying/maintenance (`RESOURCE_LOCKED`, message `not_ready`), locked by another operation (`RESOURCE_LOCKED`), or reused `Idempotency-Key` (`IDEMPOTENCY_CONFLICT`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Backups runtime unavailable on the active backend (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/health:
    get:
      tags: [Admin Health]
      operationId: getAdminHealth
      summary: State of the panel's parts, the site containers and the disks (server administrator)
      description: >-
        Computed on each call from stored rows, plus one live read of the four host services from
        the host agent (`hostServices`), bound to 3 seconds; when the agent is disabled, out of
        reach, slow or sends something malformed, `hostServices` is `null` and the rest is unchanged.
        `api`, `web` and `database` are always `ok` (the answer itself proves them). `executor` and
        `host_agent` come from their heartbeat rows: no row is `unknown`/`not_reporting`, a row older
        than five minutes or offline is `down`/`not_reporting`. `docker_engine` follows the executor's
        row. The five panel containers come from the `panel_containers` row written by the drift
        pass every 15 seconds; a container the panel does not need yet and that is stopped or missing
        is `not_in_use`. With the runtime disabled the daemons and containers are
        `unknown`/`runtime_disabled`. `disks` comes from the host agent's last snapshot; its age is
        not checked. A site container whose observation is older than five minutes, or missing, is
        `stale`.
      responses:
        "200":
          description: The health snapshot
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AdminHealthDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/alerts:
    get:
      tags: [Admin Health]
      operationId: listAdminAlerts
      summary: Open alerts, worst first (server administrator)
      description: >-
        Computed on each call; nothing is stored, so an alert disappears as soon as its condition
        ends. Order: `critical` before `warning`, then the order of `kind` in the enum, then `since`
        oldest first, with a missing `since` last.
      responses:
        "200":
          description: The open alerts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminAlertDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/sites/{siteId}/logs:
    get:
      tags: [Admin Health]
      operationId: getAdminSiteLogs
      summary: Read recent log lines of any managed site (audited as admin.site.logs.read)
      description: >-
        A successful read writes the audit event `admin.site.logs.read` with the owner as
        organisation and `details: {tail}`; a failed read writes none.
      parameters:
        - $ref: "#/components/parameters/SiteIdParam"
        - in: query
          name: tail
          description: Lines to read, clamped to 1–500; 200 when absent or not a number
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          description: Log lines, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SiteLogLineDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: >-
            Site not found or not a managed site (`NOT_FOUND`), or the site's container is gone
            (`NOT_FOUND`, "There is no log to show: this part is not running on this server.")
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: >-
            Runtime disabled or the executor failed
            (`DOCKER_ENGINE_UNAVAILABLE`, "The logs are not available right now. Try again in a few minutes.")
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/logs/{component}:
    get:
      tags: [Admin Health]
      operationId: getAdminPanelLogs
      summary: Read recent log lines of a panel container, a panel service or a host job (server administrator; not audited)
      description: >-
        Twelve sources. The five panel containers are read through the executor, which maps the
        name to its container itself; in `phpmyadmin` lines every query string is replaced with
        `?[masked]`. The seven journal sources (the four panel services and the three host jobs:
        panel update, package list refresh, package upgrade) are read through the host agent with
        `journalctl` on that unit only; each line is `stdout`, its text cut to 2000 characters.
        No read is audited.
      parameters:
        - in: path
          name: component
          required: true
          schema:
            type: string
            enum: [ingress_proxy, shared_database, phpmyadmin, sftp, mail_relay, hp-api, hp-web, hp-docker-executor, hp-host-agent, hp-panel-update, hp-os-refresh, hp-os-upgrade]
        - in: query
          name: tail
          description: Lines to read, clamped to 1–500; 200 when absent or not a number
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          description: Log lines, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SiteLogLineDto"
        "400":
          description: '`component` is not one of the twelve sources (`VALIDATION_ERROR`)'
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: >-
            The container does not exist (`NOT_FOUND`, "There is no log to show: this part is not
            running on this server.")
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: >-
            A journal source while the host agent is disabled (`NOT_SUPPORTED`, "The host agent is
            disabled on this server.")
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: >-
            A container source with the runtime disabled or a failed executor
            (`DOCKER_ENGINE_UNAVAILABLE`), or a journal source the agent did not read
            (`HOST_AGENT_UNAVAILABLE`); both read "The logs are not available right now. Try again
            in a few minutes."
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/sites/{siteId}/restart:
    post:
      tags: [Admin Sites]
      operationId: adminRestartSite
      summary: Restart a site's container with a reason (server administrator; audited as admin.site.restart)
      description: >-
        Queues `service.restart` under the site lock, like the owner's Restart. The wanted state
        becomes running, so restarting a site its owner stopped starts it again. A container that is
        gone is created again from the stored revision, but only when the site's last
        `site.provision` succeeded and no `site.delete` was ever queued for the site. Not counted by
        the heavy-action limit. The audit row `admin.site.restart` keeps `reason` and `operationId`
        in `details`; its organisation is null. It is written in the transaction that queues the
        restart: a replayed `Idempotency-Key` writes no second row.
      parameters:
        - $ref: "#/components/parameters/SiteIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestartInput"
      responses:
        "202":
          description: Accepted; follow the operation with GET /v1/admin/operations/{operationId}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedSiteAccepted"
        "400":
          description: No `Idempotency-Key`, or the reason is missing, blank, over 500 characters or holds U+0000 (`VALIDATION_ERROR`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found or not a managed site (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Another operation holds the site (`RESOURCE_LOCKED`), or the key was used for another
            request (`IDEMPOTENCY_CONFLICT`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/panel-containers/{component}/restart:
    post:
      tags: [Admin Health]
      operationId: adminRestartPanelContainer
      summary: Restart one of the panel's own containers with a reason (server administrator; audited)
      description: >-
        Queues `panel.container.restart` under the lock `panel:container:<component>`. The worker
        starts the restart about two seconds after the request was accepted, so a restart of
        `ingress_proxy` does not cut this answer; an operation older than one minute when the worker
        reaches it fails with `OPERATION_INTERRUPTED` instead. The container gets 5 seconds to stop
        (10 for `mail_relay`). The request writes `admin.panel_container.restart` (`details`:
        `outcome`, `requestId`, `operationId`, `component`, `reason`) in the same transaction as the
        operation; a replayed key writes no second row. The end writes
        `admin.panel_container.restart.end` (actor `system`; `details`: `operationId`, `component`,
        `outcome`, `errorCode`). A failed restart reads "The container did not restart. Check
        Health, then try again."
      parameters:
        - in: path
          name: component
          required: true
          schema:
            type: string
            enum: [ingress_proxy, shared_database, phpmyadmin, sftp, mail_relay]
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestartInput"
      responses:
        "202":
          description: Accepted; follow the operation with GET /v1/admin/operations/{operationId}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [component, operationId]
                    properties:
                      component:
                        type: string
                        enum: [ingress_proxy, shared_database, phpmyadmin, sftp, mail_relay]
                      operationId:
                        type: string
        "400":
          description: >-
            No `Idempotency-Key`, `component` is not one of the five, or the reason is missing, blank,
            over 500 characters or holds U+0000 (`VALIDATION_ERROR`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Health shows the container as not in use or missing (`PANEL_CONTAINER_ABSENT`, "This
            container is not installed. There is nothing to restart."), a restart of it is already
            queued or running (`RESOURCE_LOCKED`), or the key was used for another request
            (`IDEMPOTENCY_CONFLICT`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: >-
            The container runtime is disabled (`NOT_SUPPORTED`, "The container runtime is disabled on
            this server.")
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/operations/{operationId}:
    get:
      tags: [Admin Health]
      operationId: getAdminOperation
      summary: Read any operation by id (server administrator; not audited)
      description: >-
        Any kind, including the server-wide ones with no site. `panel.container.restart` and
        `panel.container.apply` (a panel container moved to its pinned image) carry the container's
        name in `resourceId`; a failed apply reads "The container was not moved to its pinned image.
        Check Health, then try again." `host.job` carries the job in `resourceId`
        (`restart_hp_api`, `restart_hp_web`, `restart_hp_docker_executor`,
        `restart_hp_host_agent`, `panel_update`, `os_refresh`, `os_upgrade`). A host job that ran and
        ended with an error, including a panel update that rolled back, is `failed` with
        `HOST_JOB_FAILED` ("The job ended with an error. Read its log on the Logs page, then try
        again."). One that was older than a minute when the worker reached it, or whose run did not
        start within two minutes, is `failed` with `OPERATION_INTERRUPTED` ("The job did not start.
        Check Health, then try again."); one the host agent refused because a job was already
        running, or did not answer when asked to start it, is `failed` with the same sentence and
        `RESOURCE_LOCKED` or `HOST_AGENT_UNAVAILABLE`. The finer result (`updated`, `already_current`,
        `rolled_back`, `rollback_unhealthy`, `not_started`, ...) is in the job's end row in the audit
        log, and the last panel update's result is in `GET /v1/admin/updates`.
      parameters:
        - in: path
          name: operationId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The operation and its steps
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/OperationDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: No operation with this id (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/sites/{siteId}/terminal:
    post:
      tags: [Admin Terminal]
      operationId: openAdminTerminal
      summary: Open a text shell in a site's container (fresh authenticator code; audited as admin.terminal.open)
      description: >-
        The shell runs as user 33:33 (the web server's user, never root) in `/var/www/html`, with
        `TERM=dumb`; there is no terminal emulator, so full-screen programs do not work. Every open
        needs a six-digit code from the caller's authenticator; a used code is refused until the
        next one. A missing, wrong or used code, an account with no authenticator or a locked
        account writes `admin.terminal.denied` (organisation = the site's owner) and never reaches
        the executor. At most one session per site and four on the server. A session ends by itself
        after 60 seconds with no read, or 30 minutes after it opened (`expiresAt`). The open writes
        `admin.terminal.open` and the end writes one `admin.terminal.close` with the reason and the
        duration in seconds. What is typed and what comes back is never stored.
      parameters:
        - $ref: "#/components/parameters/SiteIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalOpenInput"
      responses:
        "201":
          description: The session is open
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/TerminalSessionDto"
        "400":
          description: >-
            The code is missing or not six digits (`VALIDATION_ERROR`, "Enter the six-digit code from
            your authenticator app."); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"
        "401":
          description: >-
            Not signed in, or the code is wrong or already used (`TOTP_INVALID`, "The code is wrong or
            was already used. Wait for the next code and try again."); a wrong or used code writes the
            denied audit
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: >-
            Not a server administrator (`PERMISSION_DENIED`), or the account has no authenticator
            (`ACCOUNT_SETUP_INCOMPLETE`); both write a denied audit
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found or not a managed site (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Refused (`RESOURCE_LOCKED`, `details[0].reason`): `site_changing` (the site is being
            deployed, under maintenance or has an operation running), `container_down` (the site is
            stopped or its container is gone), `site_busy` (a session is already open on this site) or
            `server_full` (four sessions are open on the server)
          $ref: "#/components/responses/ErrorResponse"
        "423":
          description: Too many wrong codes (`ACCOUNT_LOCKED`, "Too many wrong codes. Wait 15 minutes and try again.")
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: >-
            The runtime is disabled or the executor did not answer (`DOCKER_ENGINE_UNAVAILABLE`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/terminal/{sessionId}/write:
    post:
      tags: [Admin Terminal]
      operationId: writeAdminTerminal
      summary: Send input to the caller's own session (not audited)
      parameters:
        - $ref: "#/components/parameters/TerminalSessionIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalWriteInput"
      responses:
        "204":
          description: Written
        "400":
          description: Input empty or longer than 4096 bytes (`VALIDATION_ERROR`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Unknown session, or a session another administrator opened (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            The session has ended, or the executor no longer has it or did not finish the write
            (`RESOURCE_LOCKED`, `details[0].reason` `session_ended`, "This terminal session has
            ended. Open a new one.")
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: The executor did not answer (`DOCKER_ENGINE_UNAVAILABLE`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/terminal/{sessionId}/read:
    post:
      tags: [Admin Terminal]
      operationId: readAdminTerminal
      summary: Read output after a cursor; waits up to 20 seconds when nothing is new (not audited)
      description: >-
        Output is plain text as the shell printed it; the executor keeps the last 256 KiB and sets
        `dropped` when older output after the cursor was lost. A read keeps the session alive. Once
        the session is over `ended` carries the reason; a session the executor no longer knows
        answers with empty output and the reason stored by the panel.
      parameters:
        - $ref: "#/components/parameters/TerminalSessionIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalReadInput"
      responses:
        "200":
          description: Output since the cursor
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/TerminalReadDto"
        "400":
          description: The cursor is missing or not a whole number from 0 (`VALIDATION_ERROR`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Unknown session, or a session another administrator opened (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: The executor did not answer (`DOCKER_ENGINE_UNAVAILABLE`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/terminal/{sessionId}/close:
    post:
      tags: [Admin Terminal]
      operationId: closeAdminTerminal
      summary: End the session and stop its shell (no body; a second close also answers 204)
      description: >-
        Writes `admin.terminal.close` once per session, with the reason the executor gives
        (`closed`, or the earlier reason if the shell had already ended) or `executor_gone` when the
        executor no longer has the session. When the executor does not answer the session stays open
        and the panel closes it on a later pass.
      parameters:
        - $ref: "#/components/parameters/TerminalSessionIdParam"
      responses:
        "204":
          description: Closed, or already closed
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Unknown session, or a session another administrator opened (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: The executor did not answer (`DOCKER_ENGINE_UNAVAILABLE`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/host-services/{service}/restart:
    post:
      tags: [Admin Health]
      operationId: adminRestartHostService
      summary: Restart one of the panel's four services with a reason (server administrator; audited as admin.host_service.restart)
      description: >-
        Queues a `host.job` (`restart_hp_api`, `restart_hp_web`, `restart_hp_docker_executor` or
        `restart_hp_host_agent`) under the lock `host:job`, so one host job runs at a time on the
        server. About two seconds after this answer the host agent writes an empty trigger file; a
        root systemd path unit sees it and runs `systemctl restart` on that one service. The panel
        then follows the unit until it ends. Restarting `api` or `web` drops the panel for a few
        seconds; restarting `host_agent` may cut the agent's own answer, and the panel reads the end
        once the agent is back. A restart of `executor` is refused while a backup, a restore, a
        WordPress update or an import runs. The request writes `admin.host_service.restart`
        (`details`: `outcome`, `requestId`, `service`, `reason`, `operationId`) in the transaction
        that queues the job; a replayed key writes no second row. The end writes
        `admin.host_service.restart.end` (actor `system`; `details`: `operationId`, `outcome`,
        `result`, `exitStatus`).
      parameters:
        - in: path
          name: service
          required: true
          schema:
            type: string
            enum: [api, web, executor, host_agent]
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestartInput"
      responses:
        "202":
          description: Accepted; follow the operation with GET /v1/admin/operations/{operationId}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [service, operationId]
                    properties:
                      service:
                        type: string
                        enum: [api, web, executor, host_agent]
                      operationId:
                        type: string
        "400":
          description: >-
            `service` is not one of the four, no `Idempotency-Key`, or the reason is missing, blank,
            over 500 characters or holds U+0000 (`VALIDATION_ERROR`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Another host job is queued or running (`RESOURCE_LOCKED`, `details[0].reason`
            `host_job_running`), site work is running and the service is `executor`
            (`RESOURCE_LOCKED`, `site_work_running`), or the key was used for another request
            (`IDEMPOTENCY_CONFLICT`).
            A replay of this same request with its key answers its first operation with `202`, also
            when site work began after it.
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: The host agent is disabled (`NOT_SUPPORTED`, "The host agent is disabled on this server.")
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/firewall:
    get:
      tags: [Admin Firewall]
      operationId: getAdminFirewall
      summary: The stored firewall lists and what the server's firewall holds now (server administrator; not audited)
      description: >-
        The database holds the truth: the open ports of the safe list and the blocked addresses.
        The answer adds one read of the kernel's table `inet hp_dedicated_filter` through the host
        agent (`nft -j list table`), outside the queue of changes. `baseRules` says whether the base
        rules are in place: `current`, `outdated`, `absent`, `unmanaged` (the installer did not load
        the panel's firewall, so the panel does not change it), `unreadable` (the agent did not
        answer) or `disabled` (the agent is off). `inForce` on a port or a block is `null` unless the
        base rules are `current`. Blocks are newest first. To put the base rules in place, use
        `POST /v1/hosts/{hostId}/security` (`hostId` is in this answer); after it the panel sends the
        lists again. The lists are also sent when the API starts, retried every 10 seconds while the
        agent is away. There is no periodic pass.
      responses:
        "200":
          description: The firewall view
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/FirewallDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/firewall/ports/{name}/open:
    post:
      tags: [Admin Firewall]
      operationId: openAdminFirewallPort
      summary: Open one port of the safe list (server administrator; audited as admin.firewall.port_open)
      description: >-
        Changes run one at a time. Each one reads the kernel's table first: base rules that are
        `outdated`, `absent` or `unmanaged` refuse the change. When the read fails the change goes
        ahead, and the agent refuses the lists unless the base rules are `current`. The
        change is stored, then the whole lists are sent to the host; the answer shows the result. If
        the send fails, the change stays stored and `inForce` shows it is not active; it is sent with
        the next change, the next base-rules apply or the next start of the API. Opening a port that
        is already open changes nothing and writes no row. The row `admin.firewall.port_open` keeps
        `outcome`, `requestId`, `name` and `port` in `details`. No `Idempotency-Key` is needed; one
        sent is ignored.
      parameters:
        - $ref: "#/components/parameters/FirewallPortNameParam"
      responses:
        "200":
          description: The firewall view after the change
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/FirewallDto"
        "400":
          description: '`name` is not on the safe list (`VALIDATION_ERROR`, `details[0]`: field `name`, reason `unknown_port`)'
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            The base rules are not in place (`FIREWALL_BASE_RULES_NOT_CURRENT`, "The base firewall
            rules are not in place. Apply them first."; when the panel firewall is not installed,
            "The panel firewall is not installed on this server.")
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: The host agent is disabled (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: The API is stopping (`HOST_AGENT_UNAVAILABLE`, retryable)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/firewall/ports/{name}/close:
    post:
      tags: [Admin Firewall]
      operationId: closeAdminFirewallPort
      summary: Close one port of the safe list (server administrator; audited as admin.firewall.port_close)
      description: >-
        Same steps as the open. Closing a port that is already closed changes nothing and writes no
        row. Ports 22, 80, 443 and 3000 are not on the safe list and cannot be closed here.
      parameters:
        - $ref: "#/components/parameters/FirewallPortNameParam"
      responses:
        "200":
          description: The firewall view after the change
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/FirewallDto"
        "400":
          description: '`name` is not on the safe list (`VALIDATION_ERROR`, `details[0]`: field `name`, reason `unknown_port`)'
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: The base rules are not in place (`FIREWALL_BASE_RULES_NOT_CURRENT`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: The host agent is disabled (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: The API is stopping (`HOST_AGENT_UNAVAILABLE`, retryable)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/firewall/blocks:
    post:
      tags: [Admin Firewall]
      operationId: createAdminFirewallBlock
      summary: Block one address or range (server administrator; audited as admin.firewall.block)
      description: >-
        Same steps as a port change. A blocked address gets no answer from the server or the sites,
        and the server's answers to it are dropped too; it can still reach SSH (port 22). The
        address is stored in its short form (for example `192.0.2.0/24` or `2001:db8::/48`). An
        IPv4 range may not be wider than /16, an IPv6 range not wider than /32; at most 500 blocks per
        family. The web app sends the visitor's address in `X-HP-Client-Address`; a block that would
        cover it is refused. Without the header, or with a malformed one, that check is skipped:
        the header is advice, not a boundary. The row `admin.firewall.block` keeps `outcome`,
        `requestId`, `address`, `family` and `note` in `details`. No `Idempotency-Key` is needed; one
        sent is ignored.
      parameters:
        - in: header
          name: X-HP-Client-Address
          required: false
          description: The address of the person using the panel, as the web app received it
          schema:
            type: string
            example: 198.51.100.7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirewallBlockInput"
      responses:
        "201":
          description: Blocked; the firewall view after the change
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/FirewallDto"
        "400":
          description: >-
            Refused (`VALIDATION_ERROR`; the input is never echoed). `details[0].field` `address` with
            `reason` `invalid`, `ipv4_mapped`, `host_bits` (bits set after the prefix), `too_wide`,
            `reserved` (for example loopback or link-local), `own_address`, `overlaps` (covers or is
            covered by a stored block) or `limit` (500 in this family); or field `note` with reason
            `note_invalid` (over 200 characters or with control characters)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: The base rules are not in place (`FIREWALL_BASE_RULES_NOT_CURRENT`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: The host agent is disabled (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: The API is stopping (`HOST_AGENT_UNAVAILABLE`, retryable)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/firewall/blocks/{blockId}:
    delete:
      tags: [Admin Firewall]
      operationId: deleteAdminFirewallBlock
      summary: Remove one block (server administrator; audited as admin.firewall.unblock)
      description: >-
        Same steps as a port change. The row `admin.firewall.unblock` keeps `outcome`, `requestId`,
        `address` and `family` in `details`.
      parameters:
        - in: path
          name: blockId
          required: true
          schema:
            type: string
            pattern: "^fwb_[0-9a-f]{32}$"
      responses:
        "200":
          description: Removed; the firewall view after the change
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/FirewallDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: No block with this id, or an id of the wrong form (`NOT_FOUND`, "This block does not exist.")
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: The base rules are not in place (`FIREWALL_BASE_RULES_NOT_CURRENT`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: The host agent is disabled (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: The API is stopping (`HOST_AGENT_UNAVAILABLE`, retryable)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/updates:
    get:
      tags: [Admin Updates]
      operationId: getAdminUpdates
      summary: What can be updated (server administrator; not audited)
      description: >-
        Reads nothing over the network. `panel.installedVersion` is the running release's version.
        `panel.check` is the last check, kept in memory: after a start of the API it is
        `never_checked`. `panel.running` is a panel update still queued or running; `panel.last` is
        the end of the last one. `components` come from the panel-container row the drift pass
        writes every 15 seconds; `imageCurrent` is `null` when nothing was seen. `sites` lists the
        sites whose container runs another image than the one pinned for their PHP version, by name,
        at most 200; `sitesTotal` counts them all. No registry is asked: an image is behind only when
        a panel release changed its pin.
      responses:
        "200":
          description: The update view
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/UpdatesDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/updates/panel/check:
    post:
      tags: [Admin Updates]
      operationId: checkAdminPanelRelease
      summary: Ask the release source for the latest panel version (server administrator; audited as admin.update.check)
      description: >-
        One request to the project's public release source, bound to 10 seconds and 1 MiB. It never
        fails the call: an error, a timeout or a rate limit reads `failed`, no published release
        reads `no_release`. The result replaces `panel.check` until the API stops. The row
        `admin.update.check` keeps `outcome`, `state` and `latestVersion` in `details`.
      responses:
        "200":
          description: The update view with the new check
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/UpdatesDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/updates/panel/apply:
    post:
      tags: [Admin Updates]
      operationId: applyAdminPanelUpdate
      summary: Update the panel to the latest release (server administrator; audited as admin.update.panel)
      description: >-
        Queues the `host.job` `panel_update` under the lock `host:job`. No body: the starting version
        is read on the server. About two seconds later a root systemd unit runs `hp-update`, the same
        command an administrator runs over SSH; it restarts the four panel services, checks health
        and rolls back by itself when the check fails. The panel goes away for a while during the
        update. Refused while a backup, a restore, a WordPress update or an import runs. The request
        writes `admin.update.panel` (`details`: `outcome`, `requestId`, `fromVersion`,
        `operationId`); a replayed key writes no second row. The end writes `admin.update.panel.end`
        (actor `system`; `details`: `operationId`, `outcome`, `result`, `exitStatus`,
        `fromVersion`, `toVersion`). `result` is `updated` or `already_current` on exit 0,
        `rolled_back` on exit 6, `rollback_unhealthy` on exit 7, `failed` otherwise.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "202":
          description: Accepted; follow the operation with GET /v1/admin/operations/{operationId}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostJobAccepted"
        "400":
          description: No `Idempotency-Key` (`VALIDATION_ERROR`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Another host job is queued or running (`RESOURCE_LOCKED`, `host_job_running`), site work
            is running (`RESOURCE_LOCKED`, `site_work_running`), or the key was used for another
            request (`IDEMPOTENCY_CONFLICT`).
            A replay of this same request with its key answers its first operation with `202`, also
            when site work began after it.
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: The host agent is disabled (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/updates/components/{component}/apply:
    post:
      tags: [Admin Updates]
      operationId: applyAdminPanelComponent
      summary: Move one panel container to its pinned image (server administrator; audited as admin.update.component)
      description: >-
        For four containers this queues `panel.container.apply` under the lock
        `panel:container:<component>`. About two seconds later the executor creates the container
        again on the image pinned by this panel release, with the same settings and data; pulling
        the image may take up to 15 minutes. The end writes `admin.update.component.end` (actor
        `system`; `details`: `operationId`, `component`, `outcome`, `errorCode`). For `mail_relay`
        there is no operation: the answer has `operationId` `null` and the mail relay's own apply runs
        in the background. The request writes `admin.update.component` (`details`: `outcome`,
        `requestId`, `operationId`, `component`). A replayed key on an operation writes no second
        row; on `mail_relay` it writes one each time.
      parameters:
        - in: path
          name: component
          required: true
          schema:
            type: string
            enum: [ingress_proxy, shared_database, phpmyadmin, sftp, mail_relay]
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "202":
          description: Accepted; with an `operationId`, follow it with GET /v1/admin/operations/{operationId}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentApplyAccepted"
        "400":
          description: No `Idempotency-Key`, or `component` is not one of the five (`VALIDATION_ERROR`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Health shows the container as not in use or missing (`PANEL_CONTAINER_ABSENT`, "This
            container is not installed. There is nothing to update."), a restart or an apply of it is
            already queued or running (`RESOURCE_LOCKED`), or the key was used for another request
            (`IDEMPOTENCY_CONFLICT`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: The container runtime is disabled (`NOT_SUPPORTED`, "The container runtime is disabled on this server.")
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/sites/{siteId}/image-update:
    post:
      tags: [Admin Updates]
      operationId: adminUpdateSiteImage
      summary: Move one site to the image pinned for its PHP version (server administrator; audited as admin.update.site_image)
      description: >-
        Uses the same path as the owner's PHP version change, with the same version: it queues
        `service.deploy` under the site lock and the site's container is created again on the pinned
        image. The site does not answer for a short while. A replayed key answers the first
        operation without any check and writes no second row. The row `admin.update.site_image`
        keeps `outcome`, `requestId`, `operationId`, `siteId`, `organizationId`, `fromImage` and
        `toImage` in `details`; its organisation is the site's owner.
      parameters:
        - $ref: "#/components/parameters/SiteIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "202":
          description: Accepted; follow the operation with GET /v1/admin/operations/{operationId}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteImageUpdateAccepted"
        "400":
          description: >-
            No `Idempotency-Key`, the site already runs the pinned image (`VALIDATION_ERROR`,
            `details[0].reason` `already_current`), or the site is stopped (`stopped`, "Start the site
            first, then update its image.")
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found or not a managed site (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Another operation holds the site (`RESOURCE_LOCKED`), or the key was used for another
            request (`IDEMPOTENCY_CONFLICT`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: The container runtime is disabled (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/os-packages:
    get:
      tags: [Admin Updates]
      operationId: getAdminOsPackages
      summary: System packages with an update, read live (server administrator; not audited)
      description: >-
        The host agent runs `apt-get -s upgrade`, a simulation that changes nothing, on the package
        lists the server already has; `listsReadAt` is when those lists were last refreshed.
        `origin` is `security`, `distribution` or `other` (any other source). `canUpgrade` is false
        when the server has no `unattended-upgrade`. `rebootRequired` mirrors the system's own
        marker; restarting the server is done over SSH. `running` is a package job still queued or
        running.
      responses:
        "200":
          description: The package view
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/OsPackagesDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: The host agent is disabled (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: >-
            The agent did not answer or sent something malformed (`HOST_AGENT_UNAVAILABLE`, "The host
            agent did not answer. Check Health, then try again.")
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/os-packages/refresh:
    post:
      tags: [Admin Updates]
      operationId: refreshAdminOsPackages
      summary: Refresh the system package lists (server administrator; audited as admin.os_packages.refresh)
      description: >-
        Queues the `host.job` `os_refresh` under the lock `host:job`. A root systemd unit runs
        `apt-get update`. The request writes `admin.os_packages.refresh` (`details`: `outcome`,
        `requestId`, `operationId`); a replayed key writes no second row. The end writes
        `admin.os_packages.refresh.end`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "202":
          description: Accepted; follow the operation with GET /v1/admin/operations/{operationId}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostJobAccepted"
        "400":
          description: No `Idempotency-Key` (`VALIDATION_ERROR`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Another host job is queued or running (`RESOURCE_LOCKED`, `host_job_running`), or the key
            was used for another request (`IDEMPOTENCY_CONFLICT`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: The host agent is disabled (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/os-packages/upgrade:
    post:
      tags: [Admin Updates]
      operationId: upgradeAdminOsPackages
      summary: Install the system package updates the server allows (server administrator; audited as admin.os_packages.upgrade)
      description: >-
        Queues the `host.job` `os_upgrade` under the lock `host:job`. A root systemd unit runs
        `unattended-upgrade -v`, which installs only what the server's unattended-upgrades settings
        allow (on a default install, the distribution's security updates). Packages from other
        sources are updated over SSH. Refused while a backup, a restore, a WordPress update or an
        import runs. The request writes `admin.os_packages.upgrade` (`details`: `outcome`,
        `requestId`, `operationId`); a replayed key writes no second row. The end writes
        `admin.os_packages.upgrade.end`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "202":
          description: Accepted; follow the operation with GET /v1/admin/operations/{operationId}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostJobAccepted"
        "400":
          description: No `Idempotency-Key` (`VALIDATION_ERROR`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`); writes the denied audit
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Another host job is queued or running (`RESOURCE_LOCKED`, `host_job_running`), site work
            is running (`RESOURCE_LOCKED`, `site_work_running`), or the key was used for another
            request (`IDEMPOTENCY_CONFLICT`).
            A replay of this same request with its key answers its first operation with `202`, also
            when site work began after it.
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: The host agent is disabled (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/backups:
    get:
      tags: [Managed Sites]
      operationId: listSiteBackups
      summary: List backups for a site owned by the organization (`site.backups.manage`)
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
      responses:
        "200":
          description: Site backup status and recorded runs (newest first)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteBackups"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.backups.manage` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found or belongs to another organization (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Managed Sites]
      operationId: createSiteBackup
      summary: Enqueue an immediate asynchronous manual backup for the site (`site.backups.manage`, 202 Accepted)
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "202":
          description: Accepted; follow the returned operation URL
          content:
            application/json:
              schema:
                type: object
                required: [data, links]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteBackupAccepted"
                  links:
                    type: object
                    required: [operation]
                    properties:
                      operation:
                        type: string
        "400":
          description: Backup target not configured (`VALIDATION_ERROR`, message `not_configured`) or missing/invalid `Idempotency-Key`
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.backups.manage` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found or belongs to another organization (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Site deploying/maintenance (`RESOURCE_LOCKED`, message `not_ready`), locked by
            another operation (`RESOURCE_LOCKED`), reused `Idempotency-Key`
            (`IDEMPOTENCY_CONFLICT`), or hourly customer limit of 6 heavy backup actions per
            site reached (`QUOTA_EXCEEDED`, `details[].field: retryAt`, `Retry-After` header)
          $ref: "#/components/responses/QuotaConflictErrorResponse"
        "422":
          description: Backups runtime unavailable on the active backend (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/backups/{backupId}/restore:
    post:
      tags: [Managed Sites]
      operationId: restoreSiteBackup
      summary: Restore a WordPress site in place from a succeeded backup (`site.backups.manage`, 202 Accepted)
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
        - $ref: "#/components/parameters/BackupIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreBackupInput"
      responses:
        "202":
          description: Accepted; follow the returned operation URL
          content:
            application/json:
              schema:
                type: object
                required: [data, links]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteBackupAccepted"
                  links:
                    type: object
                    required: [operation]
                    properties:
                      operation:
                        type: string
        "400":
          description: >-
            Confirmation `confirmName` does not match site name (`VALIDATION_ERROR`),
            backup target not configured (`VALIDATION_ERROR`, message `not_configured`),
            or missing/invalid `Idempotency-Key`
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.backups.manage` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site or succeeded backup not found, or belongs to another organization (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Site deploying/maintenance (`RESOURCE_LOCKED`, message `not_ready`), locked by
            another operation (`RESOURCE_LOCKED`), reused `Idempotency-Key` for another
            target or payload (`IDEMPOTENCY_CONFLICT`), or hourly customer limit of 6 heavy
            backup actions per site reached (`QUOTA_EXCEEDED`, `details[].field: retryAt`,
            `Retry-After` header)
          $ref: "#/components/responses/QuotaConflictErrorResponse"
        "422":
          description: Backups runtime unavailable on the active backend (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/backups/{backupId}/download:
    post:
      tags: [Managed Sites]
      operationId: prepareSiteBackupDownload
      summary: Prepare a decrypted single-zip download archive for a succeeded backup (`site.backups.manage`, 202 Accepted)
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
        - $ref: "#/components/parameters/BackupIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "202":
          description: Accepted (or already preparing/ready); follow the returned operation URL
          content:
            application/json:
              schema:
                type: object
                required: [data, links]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteBackupAccepted"
                  links:
                    type: object
                    required: [operation]
                    properties:
                      operation:
                        type: string
        "400":
          description: Backup target not configured (`VALIDATION_ERROR`, message `not_configured`) or missing/invalid `Idempotency-Key`
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.backups.manage` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site or succeeded backup not found, or belongs to another organization (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Site deploying/maintenance (`RESOURCE_LOCKED`, message `not_ready`), locked by
            another operation (`RESOURCE_LOCKED`), reused `Idempotency-Key` for another
            target or payload (`IDEMPOTENCY_CONFLICT`), or hourly customer limit of 6 heavy
            backup actions per site reached (`QUOTA_EXCEEDED`, `details[].field: retryAt`,
            `Retry-After` header)
          $ref: "#/components/responses/QuotaConflictErrorResponse"
        "422":
          description: Backups runtime unavailable on the active backend (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"
    get:
      tags: [Managed Sites]
      operationId: readSiteBackupArchiveChunk
      summary: Read a base64 chunk of a prepared backup download zip archive (`site.backups.manage`)
      description: >-
        Streams chunks up to 512 KiB (524,288 raw bytes) from the prepared archive stored under
        the executor backup work directory. Prepared archives expire after 60 minutes.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
        - $ref: "#/components/parameters/BackupIdParam"
        - in: query
          name: offset
          required: false
          description: Zero-based byte offset to start reading from
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
            default: 0
        - in: query
          name: length
          required: false
          description: Maximum raw bytes to read (at most 524,288 bytes / 512 KiB before base64)
          schema:
            type: integer
            minimum: 1
            maximum: 524288
            default: 524288
      responses:
        "200":
          description: Base64-encoded backup archive chunk with resolved download filename
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/BackupArchiveChunk"
        "400":
          description: Invalid `offset` or `length` query parameter (`VALIDATION_ERROR`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.backups.manage` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: >-
            Site or succeeded backup not found, belongs to another organization (`NOT_FOUND`),
            or prepared archive missing/expired (`NOT_FOUND`, reason `archive_gone`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Prepared archive is still being created (`RESOURCE_LOCKED`, reason `archive_preparing`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Backups runtime unavailable on the active backend (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"
        "502":
          description: Executor IPC call timed out without confirming archive read (`OPERATION_AMBIGUOUS`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: Executor or backup archive read temporarily unavailable (`DOCKER_ENGINE_UNAVAILABLE`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/wordpress:
    get:
      tags: [Managed Sites]
      operationId: getSiteWordpress
      summary: WordPress tab state of a site (`site.read`)
      description: >-
        Returns the last stored check (`state`), the running `site.wordpress.inspect` or
        `site.wordpress.update` operation and the last finished update. A site that was never
        checked answers `{backupsConfigured: false|true, state: null, runningOperation: null, lastUpdate: null}`.
        The same `200` with an empty state (`state`, `runningOperation` and `lastUpdate` null) answers
        for a site that is not WordPress and on a server without the WordPress tools; only the three
        POST routes answer `422 NOT_SUPPORTED`. A suspended organization still reads its stored state;
        its three POST routes answer `403`.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
      responses:
        "200":
          description: WordPress tab state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteWordpressDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.read` permission (`PERMISSION_DENIED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found or belongs to another organization (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"

