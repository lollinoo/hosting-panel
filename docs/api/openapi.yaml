      operationId: appendServiceRevision
      summary: Append immutable revision N+1 (service.configuration.manage, then server administrator)
      description: >-
        Server administrators only (R207 addendum 4 A): the caller needs `service.configuration.manage` in the organization
        and then the server-administrator permission. A server administrator is not a member of a
        customer organization, so on an installed server nobody passes both checks and the route
        always refuses; it is not a feature of this release. A member of another organization, or a
        server administrator with no support visit or a closed one, gets 404 with no audit row; a member with the
