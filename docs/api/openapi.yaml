            - unknown
            - cancelled
        resourceId:
          type: string
        submittedAt:
          type: string
          format: date-time

    AsyncAcceptedLinks:
      type: object
      required: [self]
      properties:
        self:
          type: string

    AsyncAcceptedEnvelope:
      type: object
      required: [data, links]
      properties:
        data:
          $ref: "#/components/schemas/AsyncAcceptedData"
        links:
          $ref: "#/components/schemas/AsyncAcceptedLinks"

    OperationTimelineStep:
      type: object
      required: [id, key, label, status, message, startedAt, completedAt]
      properties:
        id:
          type: string
        key:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [pending, running, succeeded, failed, cancelled, skipped, unknown]
        message:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    RestartInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the restart is needed; trimmed first; kept in the audit row; a reason holding U+0000 is refused (`VALIDATION_ERROR`)

    TerminalOpenInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
          description: The current six-digit code from the caller's authenticator app

    TerminalWriteInput:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input:
          type: string
          minLength: 1
          description: Text sent to the shell as typed, at most 4096 UTF-8 bytes

    TerminalReadInput:
      type: object
      additionalProperties: false
      required: [cursor]
      properties:
        cursor:
          type: integer
          minimum: 0
          description: The `cursor` of the previous read; 0 for the first

    TerminalSessionDto:
      type: object
      additionalProperties: false
      required: [sessionId, siteId, containerName, openedAt, expiresAt]
      properties:
        sessionId:
          type: string
        siteId:
          type: string
        containerName:
          type: string
        openedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: 30 minutes after `openedAt`; the session ends then

    TerminalReadDto:
      type: object
      additionalProperties: false
      required: [output, cursor, dropped, ended]
      properties:
        output:
          type: string
        cursor:
          type: integer
          minimum: 0
          description: Pass it to the next read
        dropped:
          type: boolean
          description: Older output was dropped (the executor keeps the last 256 KiB)
        ended:
          type: object
          nullable: true
          additionalProperties: false
          required: [reason, at]
          properties:
            reason:
              type: string
              enum: [closed, shell_exited, idle, time_limit, container_gone, executor_gone, not_started]
            at:
              type: string
              format: date-time

    FirewallDto:
      type: object
      additionalProperties: false
      required: [baseRules, readAt, hostId, staticRules, ports, blocks]
      properties:
        baseRules:
          type: string
          enum: [current, outdated, absent, unmanaged, unreadable, disabled]
          description: >-
            `current` the base rules are in place; `outdated` an older version is; `absent` none
            are; `unmanaged` the server was installed without the panel's firewall
            (`--skip-firewall`): the panel changes nothing there and an apply fails; `unreadable` the
            host agent did not answer; `disabled` the agent is off
        readAt:
          type: string
          format: date-time
          nullable: true
          description: When the kernel's table was read; `null` when it was not
        hostId:
          type: string
          nullable: true
          description: The server's id, for `POST /v1/hosts/{hostId}/security`
        staticRules:
          type: array
          description: What the base rules always allow; not changeable here
          items:
            type: object
            additionalProperties: false
            required: [key, ports]
            properties:
              key:
                type: string
                enum: [ssh, web, panel, icmp, replies]
              ports:
                type: array
                items:
                  type: integer
        ports:
          type: array
          description: The six ports of the safe list, always all of them
          items:
            type: object
            additionalProperties: false
            required: [name, port, open, inForce]
            properties:
              name:
                type: string
                enum: [http_alt, https_alt, node_exporter, zabbix_agent, checkmk_agent, nrpe]
              port:
                type: integer
              open:
                type: boolean
                description: What the panel stored
              inForce:
                type: boolean
                nullable: true
                description: The kernel agrees with `open`; `null` unless `baseRules` is `current`
        blocks:
          type: array
          description: Newest first
          items:
            type: object
            additionalProperties: false
            required: [id, address, family, note, createdAt, inForce]
            properties:
              id:
                type: string
                pattern: "^fwb_[0-9a-f]{32}$"
              address:
                type: string
                description: Address or range in its short form
                example: 203.0.113.0/24
              family:
                type: string
                enum: [ipv4, ipv6]
              note:
                type: string
                nullable: true
                maxLength: 200
              createdAt:
                type: string
                format: date-time
              inForce:
                type: boolean
                nullable: true
                description: The kernel holds the block; `null` unless `baseRules` is `current`

    FirewallBlockInput:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        address:
          type: string
          maxLength: 64
          description: >-
            One IPv4 or IPv6 address, or a range with a prefix (IPv4 /16 to /32, IPv6 /32 to /128)
          example: 192.0.2.0/24
        note:
          type: string
          nullable: true
          maxLength: 200
          description: Why; no control characters. Empty is stored as `null`

    UpdatesDto:
      type: object
      additionalProperties: false
      required: [panel, components, sites, sitesTotal]
      properties:
        panel:
          type: object
          additionalProperties: false
          required: [installedVersion, check, running, last]
          properties:
            installedVersion:
              type: string
              nullable: true
              pattern: '^\d+\.\d+\.\d+$'
            check:
              type: object
              additionalProperties: false
              required: [state, latestVersion, checkedAt]
              properties:
                state:
                  type: string
                  enum: [never_checked, up_to_date, newer, no_release, failed]
                latestVersion:
                  type: string
                  nullable: true
                  pattern: '^\d+\.\d+\.\d+$'
                checkedAt:
                  type: string
                  format: date-time
                  nullable: true
            running:
              type: object
              nullable: true
              additionalProperties: false
              required: [operationId]
              properties:
                operationId:
                  type: string
            last:
              type: object
              nullable: true
              additionalProperties: false
              required: [operationId, result, endedAt]
              properties:
                operationId:
                  type: string
                result:
                  $ref: "#/components/schemas/HostJobResult"
                endedAt:
                  type: string
                  format: date-time
        components:
          type: array
          description: The five panel containers, in this order
          minItems: 5
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [component, expected, imageCurrent, runningOperationId]
            properties:
              component:
                type: string
                enum: [ingress_proxy, shared_database, phpmyadmin, sftp, mail_relay]
              expected:
                type: boolean
                nullable: true
                description: The panel needs this container now; `null` when nothing was seen
              imageCurrent:
                type: boolean
                nullable: true
                description: The container runs the image this release pins; `null` when nothing was seen
              runningOperationId:
                type: string
                nullable: true
                description: A `panel.container.apply` of this container still queued or running
        sites:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [siteId, siteName, organizationName, phpVersion, stopped]
            properties:
              siteId:
                type: string
              siteName:
                type: string
              organizationName:
                type: string
                nullable: true
                description: '`null` for sites held by the platform'
              phpVersion:
                type: string
                enum: ["8.3", "8.4", "8.5"]
              stopped:
                type: boolean
        sitesTotal:
          type: integer
          minimum: 0

    HostJobResult:
      type: string
      enum: [succeeded, updated, already_current, rolled_back, rollback_unhealthy, failed, not_started]

    OsPackagesDto:
      type: object
      additionalProperties: false
      required: [packages, rebootRequired, canUpgrade, listsReadAt, running]
      properties:
        packages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, installedVersion, newVersion, origin]
            properties:
              name:
                type: string
                minLength: 1
              installedVersion:
                type: string
                minLength: 1
              newVersion:
                type: string
                minLength: 1
              origin:
                type: string
                enum: [security, distribution, other]
        rebootRequired:
          type: boolean
        canUpgrade:
          type: boolean
        listsReadAt:
          type: string
          format: date-time
          nullable: true
        running:
          type: object
          nullable: true
          additionalProperties: false
          required: [operationId, job]
          properties:
            operationId:
              type: string
            job:
              type: string
              enum: [os_refresh, os_upgrade]

    HostJobAccepted:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [operationId]
          properties:
            operationId:
              type: string

    ComponentApplyAccepted:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [component, operationId]
          properties:
            component:
              type: string
              enum: [ingress_proxy, shared_database, phpmyadmin, sftp, mail_relay]
            operationId:
              type: string
              nullable: true
              description: '`null` for `mail_relay`'

    SiteImageUpdateAccepted:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [siteId, operationId]
          properties:
            siteId:
              type: string
            operationId:
              type: string

    OperationDto:
      type: object
      required:
        - id
        - organizationId
        - kind
        - status
        - resourceType
        - resourceId
        - requestedByUserId
        - errorCode
        - errorMessage
        - submittedAt
        - startedAt
        - completedAt
        - updatedAt
        - steps
      properties:
        id:
          type: string
        organizationId:
          type: string
        kind:
          type: string
          enum:
            - service.deploy
            - service.restart
            - service.stop
            - site.deploy
            - site.provision
            - site.delete
            - site.reassign
            - site.domains
            - site.files.archive
            - site.files.extract
            - site.backups.create
            - site.backups.prune
            - site.backups.restore
            - site.backups.download
            - site.wordpress.inspect
            - site.wordpress.update
            - site.wordpress.import
            - panel.backups.create
            - panel.container.restart
            - panel.container.apply
            - host.job
            - host.maintenance
            - host.security
            - host.allocate
            - site.tls.apply
        status:
          type: string
          enum:
            - queued
            - processing
            - accepted
            - reconciling
            - succeeded
            - failed
            - unknown
            - cancelled
        resourceType:
          type: string
          enum: [host, allocation, site, service, domain, quota]
        resourceId:
          type: string
        requestedByUserId:
          type: string
          nullable: true
        errorCode:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: "#/components/schemas/OperationTimelineStep"
