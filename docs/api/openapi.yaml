          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Last owner protected from removal
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/sites:
    get:
      tags: [Sites]
      operationId: listSites
      summary: List sites filtered by caller authorization (site.read)
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated site summaries
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SiteSummaryDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Sites]
      operationId: createSite
      summary: Create a site container on an allocated dedicated host (site.create, then server administrator)
      description: >-
        Server administrators only: a site with no known type is a generic service (ADR 0029), so the
        caller needs `site.create` in the organization and then the server-administrator permission, as
        for `createService`. `site.create` is also a support visit's permission, but a server administrator
        on an open support visit gets 403 `PERMISSION_DENIED`, with a denied audit row whose reason is
        `SUPPORT_ACCESS_PERMISSION_DENIED`, as for `createService`. A member of another organization, or a server
        administrator with no support visit or a closed one, gets 404 with no audit row; a server administrator
        whose visit ran out gets 403 `PERMISSION_DENIED`; a member with the permission who is not a server
        administrator gets 403 `PERMISSION_DENIED`. `initialDomain` is normalised and checked as the
        `domain` of `createManagedSite`: a name that is not a valid domain gets 400 `VALIDATION_ERROR`, one
        another site, an application or a server already uses gets 409 `DOMAIN_CONFLICT`, and one a manual
        certificate captures gets that route's 409 (`DOMAIN_CONFLICT` or `CERTIFICATE_IN_USE`).
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteInput"
      responses:
        "201":
          description: Site created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteDetailDto"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            The organization already has a site with this `slug` (`ALREADY_EXISTS`, `details[0].reason: slug_taken`);
            `initialDomain` is already another site's, an application's or a server's name or address
            (`DOMAIN_CONFLICT`) or a manual certificate captures it (`CERTIFICATE_IN_USE`); or the customer's site
            limit is reached (`QUOTA_EXCEEDED`, `details[0].reason: site_limit_reached`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/sites/{siteId}:
    get:
      tags: [Sites]
      operationId: getSite
      summary: Retrieve composite site aggregate with services and drift summary (site.read)
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
      responses:
        "200":
          description: Aggregated site detail
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteDetailDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Explicit deny (e.g. ABAC resource grant deny)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Anti-BOLA not found for unauthorized/mismatched orgs
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/sites/{siteId}/services:
    get:
      tags: [Services]
      operationId: listSiteServices
      summary: List services belonging to site (service.read)
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated service instances
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServiceInstanceDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Services]
      operationId: createService
      summary: Instantiate service with initial stack revision #1 (service.create, then server administrator)
      description: >-
        Server administrators only (R207 addendum 4 A): the caller needs `service.create` in the organization
        and then the server-administrator permission. A server administrator is not a member of a
        customer organization, so on an installed server nobody passes both checks and the route
        always refuses; it is not a feature of this release. A member of another organization, or a
        server administrator with no support visit or a closed one, gets 404 with no audit row; a member with the
        permission who is not a server administrator gets 403 `PERMISSION_DENIED`.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceInstanceInput"
      responses:
        "201":
          description: Service and immutable revision #1 created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [service, revision]
                    properties:
                      service:
                        $ref: "#/components/schemas/ServiceInstanceDto"
                      revision:
                        $ref: "#/components/schemas/StackRevisionDto"
        "400":
          description: >-
            `VALIDATION_ERROR`: plaintext secrets in the configuration (F1-012), or resource limits above
            the ceiling (memory above 64 GiB, CPU above 64000 milli).
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: >-
            `PERMISSION_DENIED`: a member who is not a server administrator, an administrator whose support visit
            ran out, or an administrator on an open visit (reason `SUPPORT_ACCESS_PERMISSION_DENIED`). `HOST_POLICY_DENIED`: forbidden Docker input attributes (AC-F1-04).
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: The caller does not reach the organization (a customer of another organization, or an administrator without an open support visit)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/services/{serviceId}/revisions:
    get:
      tags: [Services]
      operationId: listServiceRevisions
      summary: Retrieve immutable stack revision history (service.read)
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/ServiceIdParam"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated stack revisions
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StackRevisionDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Services]
      operationId: appendServiceRevision
      summary: Append immutable revision N+1 (service.configuration.manage, then server administrator)
      description: >-
        Server administrators only (R207 addendum 4 A): the caller needs `service.configuration.manage` in the organization
        and then the server-administrator permission. A server administrator is not a member of a
        customer organization, so on an installed server nobody passes both checks and the route
        always refuses; it is not a feature of this release. A member of another organization, or a
        server administrator with no support visit or a closed one, gets 404 with no audit row; a member with the
        permission who is not a server administrator gets 403 `PERMISSION_DENIED`.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/ServiceIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStackRevisionInput"
      responses:
        "201":
          description: New stack revision appended
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/StackRevisionDto"
        "400":
          description: >-
            `VALIDATION_ERROR`: plaintext secrets in the configuration (F1-012), or resource limits above
            the ceiling (memory above 64 GiB, CPU above 64000 milli).
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: >-
            `PERMISSION_DENIED`: a member who is not a server administrator, an administrator whose support visit
            ran out, or an administrator on an open visit (reason `SUPPORT_ACCESS_PERMISSION_DENIED`). `HOST_POLICY_DENIED`: forbidden Docker input attributes (AC-F1-04).
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: The caller does not reach the organization (a customer of another organization, or an administrator without an open support visit)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/services/{serviceId}/lifecycle:
    post:
      tags: [Services]
      operationId: executeServiceLifecycle
      summary: Enqueue service runtime lifecycle operation (deploy, restart, stop)
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/ServiceIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyRuntimeHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceLifecycleInput"
      responses:
        "202":
          description: Service lifecycle operation queued via transactional outbox (AC-F2-06)
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAcceptedEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Commercial suspension or permission denied
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Service locked by in-flight operation or idempotency conflict (RESOURCE_LOCKED / IDEMPOTENCY_CONFLICT)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Docker executor runtime disabled (NOT_SUPPORTED)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/operations:
    get:
      tags: [Operations]
      operationId: listOperations
      summary: List asynchronous operations for organization (operation.read)
      description: >-
        Newest first: by `submittedAt` descending, then by `id` descending. `meta.total` counts every
        operation of the organization, not the page. The cursor is the `id` of the last operation of
        the previous page; an unknown cursor gives an empty page. For a caller who may not read
        applications (`app.read`), the operations of applications (`resourceType` `stack`) are left
        out of the page and of `meta.total`, and a cursor naming one is an unknown cursor.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated operations
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OperationDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/operations/{opId}:
    get:
      tags: [Operations]
      operationId: getOperation
      summary: Retrieve specific operation timeline and progress (operation.read)
      description: >-
        For a caller who may not read applications (`app.read`), an operation of an application
        (`resourceType` `stack`) answers `404 NOT_FOUND` with the body of an unknown operation.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - in: path
          name: opId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Operation details and timeline steps
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/OperationDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites:
    get:
      tags: [Managed Sites]
      operationId: listManagedSites
      summary: List the organization's managed sites with their primary web address (site.read)
      description: >-
        Read-only. At most 200 sites, ordered by name then id; `primaryDomain` is null for a site without one.
        A member sees only the sites it may read, as on `GET /v1/organizations/{orgId}/sites`.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
      responses:
        "200":
          description: Managed sites
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 200
                    items:
                      $ref: "#/components/schemas/ManagedSiteDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Managed Sites]
      operationId: createManagedSite
      summary: Create a site (site.create); the admin password is stored as an encrypted site secret and deleted once the install succeeds
      description: >-
        The site type is the built-in WordPress unless `templateId` names one from the site types route; the
        site is created from that site type's default version. `HP_SITE_DOMAIN` and `HP_SITE_URL` in a
        template are fixed at creation. The PHP settings of the site type are applied to the site but never
        appear in a site response (the generic service revisions route returns the stored configuration,
        which is not secret).
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateManagedSiteInput"
      responses:
        "202":
          description: Accepted; follow the returned operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedSiteAccepted"
        "400":
          description: >-
            Invalid input, including a parameter the site type refuses (`VALIDATION_ERROR`,
            `details[].field: parameters.<key>`) or a PHP version it does not offer
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: >-
            Unknown organization, or an unknown, disabled or archived site type (`NOT_FOUND`,
            `details[0].reason: template_unavailable`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Conflict, or the customer's site limit is reached (`QUOTA_EXCEEDED`,
            `details[0].reason: site_limit_reached`)
          $ref: "#/components/responses/ErrorResponse"

