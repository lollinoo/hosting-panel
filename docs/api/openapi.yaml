            does not resolve, or the panel could not check it), `bot_token_required` or `group_not_available`
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: The caller is a member of the organization without the permission (`PERMISSION_DENIED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: The organization is not the caller's, or `:channel` is not `email`, `webhook` or `telegram` (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
    delete:
      tags: [Notifications]
      operationId: organizationDeleteNotificationChannel
      summary: Remove a channel with its stored secret, what it was told and the outcome of its messages (notification.manage)
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/NotificationChannelParam"
      responses:
        "200":
