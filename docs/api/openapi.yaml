        - $ref: "#/components/parameters/VersionIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateTlsVersionRequest"
      responses:
        "202":
          description: The domains of the site in the path, and every domain the change moves on any site. The change runs as one `site.tls.apply` operation; a request that changes nothing (or a replay) answers 202 without an operation and an empty `moved`
