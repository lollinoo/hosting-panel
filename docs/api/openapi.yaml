    post:
      tags: [TLS Certificates]
      operationId: customerActivateTlsVersion
      summary: Serve a version on domains
      description: >-
        Without `domainIds` every domain of the organization, on any site, that uses another version of the same
        certificate moves to this version (a renewal: a certificate shared by several sites rotates in one request);
        with `domainIds` exactly those domains are set, and they may belong to any site of the organization.
