  /v1/organizations/{orgId}/managed-sites/{siteId}/files:
    get:
      tags: [Managed Sites]
      operationId: listSiteFiles
      summary: List entries in a site folder (site.files.read)
      description: >-
        Paths are relative to the site's files (`""` is the root) and travel in the query
        or the body, never as URL path segments. Hidden `.htpanel-*` staging files and
        entries with invalid UTF-8 names are omitted. At most 5,000 entries are returned;
        `truncated` is `true` when more exist.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
        - in: query
          name: path
          required: false
          description: Relative `/`-separated folder path (`""` for root)
          schema:
            type: string
            maxLength: 1024
            default: ""
      responses:
        "200":
          description: Folder entries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteFileListDto"
        "400":
          description: >-
            Invalid path (`VALIDATION_ERROR`; schema validation puts `invalid_path` in
            `details[].message` and Zod's issue code in `details[].reason`) or target is not a
            directory from the files layer (`not_a_directory`, `invalid_path` in `details[].reason`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.files.read` permission or symlink resolves outside the site's files (`PERMISSION_DENIED`; reason `protected`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site, folder, or site files not found (`NOT_FOUND`; reason `not_found`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Site deploying, in maintenance, or missing a deployed service (`RESOURCE_LOCKED`; reason `not_ready`), or helper timed out (`OPERATION_INTERRUPTED`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Runtime execution disabled (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"
        "502":
          description: Executor IPC call timed out without a reply (`OPERATION_AMBIGUOUS`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: Files helper or executor unavailable (`DOCKER_ENGINE_UNAVAILABLE`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/files/content:
    get:
      tags: [Managed Sites]
      operationId: readSiteFileChunk
      summary: Read a base64 chunk of a site file (site.files.read)
      description: >-
        Paths are relative to the site's files and travel in the query or the body.
        A chunk is at most 512 KiB (524,288 bytes) before base64.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
        - in: query
          name: path
          required: true
          description: Relative `/`-separated file path (non-empty)
          schema:
            type: string
            minLength: 1
            maxLength: 1024
        - in: query
          name: offset
          required: false
          description: Zero-based byte offset to start reading from
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
            default: 0
        - in: query
          name: length
          required: false
          description: Maximum raw bytes to read (at most 524,288 bytes / 512 KiB before base64)
          schema:
            type: integer
            minimum: 1
            maximum: 524288
            default: 524288
      responses:
        "200":
          description: Base64-encoded file chunk
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteFileChunkDto"
        "400":
          description: >-
            Invalid path or query (`VALIDATION_ERROR`; schema validation puts `invalid_path` in
            `details[].message` and Zod's issue code in `details[].reason`), or directory
            target / offset past EOF from the files layer (`is_a_directory`, `upload_mismatch`,
            `invalid_path` in `details[].reason`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.files.read` permission or symlink resolves outside the site's files (`PERMISSION_DENIED`; reason `protected`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site, file, or site files not found (`NOT_FOUND`; reason `not_found`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Site not ready (`RESOURCE_LOCKED`; reason `not_ready`) or helper timed out (`OPERATION_INTERRUPTED`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Runtime execution disabled (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"
        "502":
          description: Executor IPC call timed out without a reply (`OPERATION_AMBIGUOUS`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: Files helper or executor unavailable (`DOCKER_ENGINE_UNAVAILABLE`)
          $ref: "#/components/responses/ErrorResponse"
    put:
      tags: [Managed Sites]
      operationId: writeSiteFileChunk
      summary: Upload a base64 chunk of a site file (site.files.write)
      description: >-
        Paths are relative to the site's files and travel in the query or the body.
        A chunk is at most 512 KiB (524,288 bytes) before base64. Uploads are addressed
        by `uploadId` and `offset` and are safe to resend: chunks write to a hidden
        staging file next to the target and `final: true` atomically renames it into
        place (audited once on the final chunk). Writing at `offset > 0` when the staging
        file is missing or shorter returns `VALIDATION_ERROR` (`upload_mismatch`).
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteFileWriteRequest"
      responses:
        "200":
          description: Bytes currently staged (or final file size when `final` is `true`)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteFileWriteResultDto"
        "400":
          description: >-
            Invalid path or invalid base64/oversized chunk (`VALIDATION_ERROR`; schema validation
            puts `invalid_path`, `invalid_base64`, or `too_large` in `details[].message` and
            Zod's issue code in `details[].reason`), or staging offset mismatch from the files
            layer (`upload_mismatch`, `invalid_path` in `details[].reason`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.files.write` permission or protected path (`PERMISSION_DENIED`; reason `protected`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site, parent folder, or site files not found (`NOT_FOUND`; reason `not_found`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Target already exists when `overwrite` is `false` or is a folder/link
            (`ALREADY_EXISTS`; reason `exists`), file exceeds 2 GiB or less than 1 GiB disk
            free (`QUOTA_EXCEEDED`; reasons `too_large`, `disk_full`), site not ready
            (`RESOURCE_LOCKED`; reason `not_ready`), or helper timed out (`OPERATION_INTERRUPTED`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Runtime execution disabled (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"
        "502":
          description: Executor IPC call timed out without a reply (`OPERATION_AMBIGUOUS`); uploads are addressed by `uploadId` and `offset` and are safe to resend
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: Files helper or executor unavailable (`DOCKER_ENGINE_UNAVAILABLE`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/files/folders:
    post:
      tags: [Managed Sites]
      operationId: createSiteFileFolder
      summary: Create a folder inside a site's files (site.files.write)
      description: >-
        Paths are relative to the site's files and travel in the query or the body.
        The parent directory must already exist (non-recursive).
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteFileFolderRequest"
      responses:
        "204":
          description: Folder created
        "400":
          description: >-
            Invalid path (`VALIDATION_ERROR`; schema validation puts `invalid_path` in
            `details[].message` and Zod's issue code in `details[].reason`) or parent is not a
            directory from the files layer (`not_a_directory`, `invalid_path` in `details[].reason`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.files.write` permission or protected path (`PERMISSION_DENIED`; reason `protected`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site, parent folder, or site files not found (`NOT_FOUND`; reason `not_found`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Entry already exists (`ALREADY_EXISTS`; reason `exists`), disk full
            (`QUOTA_EXCEEDED`; reason `disk_full`), site not ready (`RESOURCE_LOCKED`;
            reason `not_ready`), or helper timed out (`OPERATION_INTERRUPTED`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Runtime execution disabled (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"
        "502":
          description: Executor IPC call timed out without a reply (`OPERATION_AMBIGUOUS`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: Files helper or executor unavailable (`DOCKER_ENGINE_UNAVAILABLE`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/files/move:
    post:
      tags: [Managed Sites]
      operationId: moveSiteFile
      summary: Move or rename a file, folder, or link (site.files.write)
      description: >-
        Paths are relative to the site's files and travel in the query or the body.
        Cannot move a folder into itself or overwrite an existing target.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteFileMoveRequest"
      responses:
        "204":
          description: Entry moved or renamed
        "400":
          description: >-
            Invalid path or moving a folder into itself (`VALIDATION_ERROR`; schema validation puts
            `invalid_path` in `details[].message` and Zod's issue code in `details[].reason`), or
            refusal from the files layer (`invalid_path`, `not_a_directory` in `details[].reason`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.files.write` permission or protected path (`PERMISSION_DENIED`; reason `protected`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site, source entry, destination parent, or site files not found (`NOT_FOUND`; reason `not_found`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Destination already exists (`ALREADY_EXISTS`; reason `exists`), site not ready (`RESOURCE_LOCKED`; reason `not_ready`), or helper timed out (`OPERATION_INTERRUPTED`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Runtime execution disabled (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"
        "502":
          description: Executor IPC call timed out without a reply (`OPERATION_AMBIGUOUS`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: Files helper or executor unavailable (`DOCKER_ENGINE_UNAVAILABLE`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/files/delete:
    post:
      tags: [Managed Sites]
      operationId: deleteSiteFiles
      summary: Delete one or more files, folders, or links (site.files.write)
      description: >-
        Paths are relative to the site's files and travel in the query or the body.
        Accepts 1 to 100 paths per request. Symbolic links are unlinked without following
        their target.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteFileDeleteRequest"
      responses:
        "204":
          description: Entries deleted
        "400":
          description: >-
            Invalid path or empty/oversized batch (`VALIDATION_ERROR`; schema validation puts
            `invalid_path` in `details[].message` and Zod's issue code in `details[].reason`), or
            refusal from the files layer (`invalid_path` in `details[].reason`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.files.write` permission or protected path (`PERMISSION_DENIED`; reason `protected`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site, target entry, or site files not found (`NOT_FOUND`; reason `not_found`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Site not ready (`RESOURCE_LOCKED`; reason `not_ready`) or helper timed out (`OPERATION_INTERRUPTED`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Runtime execution disabled (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"
        "502":
          description: Executor IPC call timed out without a reply (`OPERATION_AMBIGUOUS`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: Files helper or executor unavailable (`DOCKER_ENGINE_UNAVAILABLE`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/files/archive:
    post:
      tags: [Managed Sites]
      operationId: archiveSiteFiles
      summary: Enqueue asynchronous creation of a zip archive (site.files.write)
      description: >-
        Paths are relative to the site's files and travel in the query or the body.
        Enqueues an asynchronous `site.files.archive` operation (`202 Accepted`) locked
        per site; poll `/v1/organizations/{orgId}/operations/{opId}` for completion.
        All source paths must share the same parent folder; links and `.htpanel-*` files
        are skipped. Bounded to 20,000 entries, 1 GiB uncompressed, and depth 32.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteFileArchiveRequest"
      responses:
        "202":
          description: Accepted; follow the returned operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedSiteAccepted"
        "400":
          description: >-
            Invalid path, non-`.zip` target, or missing/invalid `Idempotency-Key`
            (`VALIDATION_ERROR`; schema validation puts `invalid_path` or `not_a_zip` in
            `details[].message` and Zod's issue code in `details[].reason`; header errors put
            `MISSING_IDEMPOTENCY_KEY` or `INVALID_IDEMPOTENCY_KEY` in `details[].reason`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.files.write` permission or protected path (`PERMISSION_DENIED`; reason `protected`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Site not ready or locked by another operation (`RESOURCE_LOCKED`; reason `not_ready`),
            or reused `Idempotency-Key` for another request (`IDEMPOTENCY_CONFLICT`). Worker execution
            errors (`ALREADY_EXISTS`/`exists`, `QUOTA_EXCEEDED`/`archive_limit`/`disk_full`,
            `OPERATION_INTERRUPTED`) are recorded on the operation.
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Runtime execution disabled (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/files/extract:
    post:
      tags: [Managed Sites]
      operationId: extractSiteFileArchive
      summary: Enqueue asynchronous extraction of a zip archive (site.files.write)
      description: >-
        Paths are relative to the site's files and travel in the query or the body.
        Enqueues an asynchronous `site.files.extract` operation (`202 Accepted`) locked
        per site; poll `/v1/organizations/{orgId}/operations/{opId}` for completion.
        Creates `to` when missing (`""` extracts into the root), never overwrites
        existing files (`ALREADY_EXISTS`), refuses unsafe/symlink zip entries
        (`archive_unsafe`), and enforces zip bounds (20,000 entries, 1 GiB uncompressed,
        depth 32, ratio 200 over 1 MiB).
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteFileExtractRequest"
      responses:
        "202":
          description: Accepted; follow the returned operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedSiteAccepted"
        "400":
          description: >-
            Invalid path, non-`.zip` source, or missing/invalid `Idempotency-Key`
            (`VALIDATION_ERROR`; schema validation puts `invalid_path` or `not_a_zip` in
            `details[].message` and Zod's issue code in `details[].reason`; header errors put
            `MISSING_IDEMPOTENCY_KEY` or `INVALID_IDEMPOTENCY_KEY` in `details[].reason`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.files.write` permission or protected path (`PERMISSION_DENIED`; reason `protected`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Site not ready or locked by another operation (`RESOURCE_LOCKED`; reason `not_ready`),
            or reused `Idempotency-Key` for another request (`IDEMPOTENCY_CONFLICT`). Worker execution
            errors (`ALREADY_EXISTS`/`exists`, `QUOTA_EXCEEDED`/`archive_limit`/`disk_full`,
            `VALIDATION_ERROR`/`archive_unsafe`, `OPERATION_INTERRUPTED`) are recorded on the operation.
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Runtime execution disabled (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/sites:
    get:
      tags: [Admin Sites]
      operationId: adminListSites
      summary: List every managed site with owner, plus the customers a site can be assigned to (server administrator only)
      responses:
        "200":
