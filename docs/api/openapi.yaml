  /v1/organizations/{orgId}/app-stacks:
    post:
      tags: [App Stacks]
      operationId: createAppStack
      summary: Install an application from a published template, or save it as a draft (app.create; audited as app.stack.create)
      description: >-
        `deploy: true` queues the first deployment and answers 202; `deploy: false` saves a draft and answers 201 with
        `operationId: null`, so the secret parameters can be set first. `parameters` carries the public values only;
        a secret is set with `POST .../secrets`, never here. A required secret missing from a deploying request is
        refused (`VALIDATION_ERROR`, `details[0].field: parameters.<key>`, `details[0].reason: STACK_SECRET_MISSING`).
        Each web address in `domains` must be an entry point of the template (`details[0].reason: unknown_ingress`)
        and is audited as `app.stack.domain.assign`. A failure writes nothing. Returns 422 NOT_SUPPORTED (reason
        STACK_UNSUPPORTED_FEATURE) while the capability flag `applicationStacksAvailable` is false, or when the
        organization has no dedicated server.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppStackInput"
      responses:
        "201":
          description: The draft was saved; nothing is queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppStackAcceptedEnvelope"
        "202":
          description: Accepted; follow the returned operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppStackAcceptedEnvelope"
        "400":
          description: "Invalid body, a version that is not published (`details[0].reason: STACK_TEMPLATE_UNPUBLISHED`), or invalid parameters (`STACK_PARAMETER_INVALID`, `STACK_SECRET_MISSING`)"
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: "The name is taken (`ALREADY_EXISTS`, `details[0].reason: name_taken`), a web address is in use (`DOMAIN_CONFLICT`, `CERTIFICATE_IN_USE`), the application limit is reached (`QUOTA_EXCEEDED`, `details[0].reason: STACK_QUOTA_EXCEEDED`), or the Idempotency-Key was used for another request (`IDEMPOTENCY_CONFLICT`)"
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: "Applications are not available yet, or need a dedicated server (`NOT_SUPPORTED`, `details[0].reason: STACK_UNSUPPORTED_FEATURE`)"
          $ref: "#/components/responses/ErrorResponse"
    get:
      tags: [App Stacks]
      operationId: listAppStacks
      summary: List the organization's applications, newest first (app.read)
      description: >-
        Returns 422 NOT_SUPPORTED (reason STACK_UNSUPPORTED_FEATURE) while the capability flag
        `applicationStacksAvailable` is false. An unknown query parameter is refused (`VALIDATION_ERROR`).
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated applications
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppStackSummaryDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "422":
