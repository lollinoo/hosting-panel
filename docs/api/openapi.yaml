  /v1/organizations/{orgId}/app-stacks/{stackId}/tasks:
    get:
      tags: [App Stacks]
      operationId: listAppStackTasks
      summary: List the tasks of an application, with when each runs by itself and how its last run went (app.read)
      description: >-
        The tasks are the ones the template version of the installed revision declares, in the order of the template;
        the list is empty when that version declares none or nothing is installed. A task is a command the template
        declares for one component: no route takes or returns the command or its arguments. Returns 422 NOT_SUPPORTED
        (reason STACK_UNSUPPORTED_FEATURE) while the capability flag `applicationStacksAvailable` is false.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/AppStackIdParam"
      responses:
        "200":
          description: The tasks
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AppStackTasksDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: "Applications are not available yet (`NOT_SUPPORTED`, `details[0].reason: STACK_UNSUPPORTED_FEATURE`)"
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/app-stacks/{stackId}/tasks/{taskKey}/runs:
    get:
      tags: [App Stacks]
      operationId: listAppStackTaskRuns
      summary: The last 20 runs of a task of an application, newest first, with what each printed (app.read)
      description: >-
        What a run printed is its last lines (at most 200 lines and 16 KiB), with the secrets of the component masked.
        No exit code is returned. Returns 422 NOT_SUPPORTED (reason STACK_UNSUPPORTED_FEATURE) while the capability
        flag `applicationStacksAvailable` is false.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/AppStackIdParam"
        - $ref: "#/components/parameters/AppStackTaskKeyParam"
      responses:
        "200":
          description: The runs
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AppStackTaskRunsDto"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Nothing is installed yet (`RESOURCE_LOCKED`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: "Applications are not available yet (`NOT_SUPPORTED`, `details[0].reason: STACK_UNSUPPORTED_FEATURE`)"
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [App Stacks]
      operationId: runAppStackTask
      summary: Run a task of an application now (app.control; audited as app.task.run)
      description: >-
        Queues one run of the task named in the path; the body is empty and no command can be sent. The run is an
        operation of kind `stack.task`: it leaves the status of the application as it is, and it succeeds only when the
        command ends with code 0. One run of an application waits or runs at a time. A run that waits for its turn does
        not hold the application (a stop, an update or a delete is accepted meanwhile); it holds it from when it begins
        until it ends. A run that finds the application busy or stopped when its turn comes ends as `not_started`
        (problem `busy` or `component_not_running`). Returns 422 NOT_SUPPORTED (reason STACK_UNSUPPORTED_FEATURE)
        while the capability flag `applicationStacksAvailable` is false, and when the executor of this server has no
        task calls.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/AppStackIdParam"
        - $ref: "#/components/parameters/AppStackTaskKeyParam"
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppStackActionInput"
      responses:
        "202":
          description: Accepted; follow the returned operation or read the runs of the task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppStackTaskRunAcceptedEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: The application is being changed or another run of it is waiting or running (`RESOURCE_LOCKED`, retryable), it is stopped, failed or was never installed (`RESOURCE_LOCKED`, `details[0].reason` is its status), or the Idempotency-Key was used for another request (`IDEMPOTENCY_CONFLICT`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: "Applications are not available yet, or this server cannot run tasks (its executor has no task calls): `NOT_SUPPORTED`, `details[0].reason: STACK_UNSUPPORTED_FEATURE`; nothing is queued"
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/app-stacks/{stackId}/tasks/{taskKey}/schedule:
    put:
      tags: [App Stacks]
      operationId: setAppStackTaskSchedule
      summary: Choose when a task of an application runs by itself (app.control; audited as app.task.schedule)
      description: >-
        Never, every hour, every day at an hour, or every week on a day at an hour; whole hours in UTC, no cron
        expression. A time is queued at most once, tried again for 30 minutes while the application is busy or stopped
        and then skipped; a skipped time is not caught up. No Idempotency-Key. Returns 422 NOT_SUPPORTED (reason
        STACK_UNSUPPORTED_FEATURE) while the capability flag `applicationStacksAvailable` is false.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/AppStackIdParam"
        - $ref: "#/components/parameters/AppStackTaskKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppStackTaskSchedule"
      responses:
        "200":
          description: The tasks of the application
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AppStackTasksDto"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Nothing is installed yet (`RESOURCE_LOCKED`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: "Applications are not available yet (`NOT_SUPPORTED`, `details[0].reason: STACK_UNSUPPORTED_FEATURE`)"
          $ref: "#/components/responses/ErrorResponse"

