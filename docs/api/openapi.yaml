    get:
      tags: [TLS Certificates]
      operationId: customerListTlsCertificates
      summary: List the imported certificates of the site's organization
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
      responses:
        "200":
          description: Imported certificates, oldest first, with the domains they cover and the ones they serve
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TlsCertificateDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [TLS Certificates]
      operationId: customerImportTlsCertificate
      summary: "Import a certificate (PEM): validated, stored as a pending version"
      description: >-
        The key is validated (matches the certificate, not encrypted), the chain is checked against the trusted
        root list, and the certificate must cover at least one DNS name and stay valid for 24 hours. Nothing is served
        until a version is assigned to a domain. Errors: `CERTIFICATE_*` (422), `CERTIFICATE_UPLOAD_TOO_LARGE` (413),
        `ALREADY_EXISTS` (the leaf is already imported in the organization), `IDEMPOTENCY_CONFLICT` (same key, other
        body), `QUOTA_EXCEEDED` (100 certificates), `RATE_LIMITED` (10 versions per hour for customers).
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportTlsCertificateRequest"
      responses:
        "201":
          description: The new certificate with its version 1 (`pending`). A replay of the same Idempotency-Key and body answers the same certificate
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/TlsCertificateDto"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
