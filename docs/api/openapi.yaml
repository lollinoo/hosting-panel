openapi: 3.1.0
info:
  title: Hosting Control Panel API
  version: 0.3.0
  summary: Docker-Native Control Plane API (HCP-SPEC-003 Phase 2)
  description: >-
    Versioned `/v1` Docker-native control-plane REST API enforcing strict tenant
    organization isolation, default-deny RBAC/ABAC authorization, transactional
    host placement and quota reservations, immutable stack revisions, write-only
    AES-256-GCM encrypted secrets, transactional outbox lifecycle operations over
    signed Unix Domain Socket IPC (`docker-executor` and `host-agent`), `unknown`
    crash recovery, and observe-only drift reconciliation. Shared hosting remains
    gated (`false`); ACME TLS, site SFTP, and site backups are available when
    `runtimeBackend` is `linux-systemd`. While an account must change its
    temporary password (`mustChangePassword`), every route with a session
    answers 403 `PASSWORD_CHANGE_REQUIRED`, except `GET /v1/me`,
    `POST /v1/me/password` and `POST /v1/auth/revoke`; break-glass tokens are
    not refused.
servers:
  - url: http://127.0.0.1:4000
    description: Local embedded control-plane development server

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Liveness and database readiness probes
  - name: Auth
    description: Authentication, Dev OIDC token issuance, and token revocation
  - name: Account
    description: Self-service password, two-factor authentication and language
  - name: Admin Users
    description: Account administration by the server administrator
  - name: Identity
    description: Principal identity, assigned roles, and tenant memberships
  - name: Hosts
    description: Linux host nodes, telemetry, maintenance, security posture, operations, and allocations
  - name: Service Templates
    description: Approved service catalog templates
  - name: Admin Audit
    description: Platform-wide immutable audit trail
  - name: Organizations
    description: Tenant organizations, capabilities, quotas, and members
  - name: Secrets
    description: Write-only AES-256-GCM encrypted secrets metadata
  - name: Sites
    description: Composite application sites, domains, and aggregate drift status
  - name: Managed Sites
    description: WordPress sites created, controlled and deleted by customers (async, 202 + operation)
  - name: Admin Sites
    description: Server administrator view over all WordPress sites, creation for a customer and ownership moves
  - name: TLS Certificates
    description: Imported (PEM) certificates, their versions and which domains serve them; the administrator's inventory and alerts
  - name: Admin Backups
    description: Platform S3 backup target settings, connectivity tests, and per-site backup status (server administrator only)
  - name: Admin Health
    description: Panel health, open alerts, site and panel logs, and restarts of the panel's parts (server administrator only)
  - name: Admin Terminal
    description: Text shell in a site's container, behind a fresh authenticator code (server administrator only)
  - name: Admin Firewall
    description: Ports of the safe list and blocked addresses on the server's firewall (server administrator only)
  - name: Admin Updates
    description: Panel release, panel containers, site images and system packages (server administrator only)
  - name: Services
    description: Declarative service instances, immutable revisions, and async lifecycle
  - name: Operations
    description: Asynchronous operations and timeline progress

paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getHealthLive
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [status, service, spec, phase, timestamp]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: hosting-panel-api
                  spec:
                    type: string
                    enum: [HCP-SPEC-002, HCP-SPEC-003]
                  phase:
                    type: string
                    enum: [phase-1, phase-2]
                  runtimeBackend:
                    $ref: "#/components/schemas/RuntimeBackend"
                  timestamp:
                    type: string
                    format: date-time

  /health/ready:
    get:
      tags: [Health]
      operationId: getHealthReady
      summary: Readiness probe verifying PostgreSQL connectivity
      security: []
      responses:
        "200":
          description: Control-plane database is reachable
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [status, database, mode, timestamp]
                properties:
                  status:
                    type: string
                    const: ready
                  database:
                    type: string
                    const: up
                  mode:
                    type: string
                    enum: [pglite, postgres]
                  timestamp:
                    type: string
                    format: date-time
        "500":
          $ref: "#/components/responses/ErrorResponse"

  /v1/dev/auth/personas:
    get:
      tags: [Auth]
      operationId: getDevPersonas
      summary: List seeded personas for local development authentication
      security: []
      responses:
        "200":
          description: List of available personas
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DevPersonaDto"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/dev/auth/token:
    post:
      tags: [Auth]
      operationId: issueDevToken
      summary: Mint an RS256 Bearer JWT for a development persona
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                email:
                  type: string
                  format: email
                expiresInSeconds:
                  type: integer
                  minimum: 1
                  maximum: 86400
      responses:
        "200":
          description: Token successfully issued
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [accessToken, tokenType, expiresIn, expiresAt, issuer, audience, user]
                    properties:
                      accessToken:
                        type: string
                      tokenType:
                        type: string
                        const: Bearer
                      expiresIn:
                        type: integer
                      expiresAt:
                        type: string
                        format: date-time
                      issuer:
                        type: string
                      audience:
                        type: string
                      user:
                        type: object
                        required: [id, email, name]
                        properties:
                          id:
                            type: string
                          email:
                            type: string
                            format: email
                          name:
                            type: string
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/auth/revoke:
    post:
      tags: [Auth]
      operationId: revokeCurrentToken
      summary: Immediately revoke the caller's active JWT jti
      responses:
        "200":
          description: Token successfully revoked
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [revoked, revokedAt]
                    properties:
                      revoked:
                        type: boolean
                        const: true
                      revokedAt:
                        type: string
                        format: date-time
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Email and password login (TOTP code required for accounts with 2FA)
      description: >-
        Returns `totp_required` when the account has 2FA enabled and no `totpCode` was sent.
        5 wrong passwords lock the account for 15 minutes: the fifth still answers 401, later tries answer `ACCOUNT_LOCKED` (423).
        An address with no account is counted the same way, in memory, so six wrong sign-ins give the same answers for both.
        TOTP guesses have a separate counter. Sign-ins of one address run one at a time.
        Server administrators without enrolled 2FA get `ACCOUNT_SETUP_INCOMPLETE` (403).
        An address with no account never gets 429: its check runs only while fewer than 4 checks are in
        the password gate, otherwise it gets the same `INVALID_CREDENTIALS` (401) at once, with no audit row.
        A locked account gets 423 before the gate unless the caller sends `totpCode`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                totpCode:
                  type: string
                  pattern: "^\\d{6}$"
      responses:
        "200":
          description: Login result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - type: object
                        required: [status, accessToken, expiresAt, mustChangePassword]
                        properties:
                          status:
                            type: string
                            const: ok
                          accessToken:
                            type: string
                          expiresAt:
                            type: string
                            format: date-time
                          mustChangePassword:
                            type: boolean
                      - type: object
                        required: [status]
                        properties:
                          status:
                            type: string
                            const: totp_required
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "423":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          description: Real accounts hold every place of the password gate (two checks run and 16 wait); this sign-in of a known account is refused at once and counts no failed try (`RATE_LIMITED`, not retryable). An address with no account never gets 429. Try again in a minute.
          $ref: "#/components/responses/ErrorResponse"

  /v1/auth/password-reset/request:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Ask for a password-reset email (customer accounts only)
      description: >-
        Needs no session. Always `202` with an empty body, whatever the address: an unknown address,
        a disabled account, a server administrator, a mail relay that is not configured or a reached
        limit all get the same answer, and the mail work starts only after the answer. At most 3
        requests per account and 20 over all accounts per hour. The email holds a link to
        `https://<panel host name>/reset-password#<token>`; the token is valid for 30 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        "202":
          description: Accepted (the same for every address)
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /v1/auth/password-reset/confirm:
    post:
      tags: [Auth]
      operationId: confirmPasswordReset
      summary: Set a new password with the token from the email
      description: >-
        Needs no session. The token works once and for 30 minutes. A token that is unknown, used or
        expired gets `PASSWORD_RESET_INVALID` (400) without a password hash, even while the password
        gate is full; only a live token goes through the gate. A password the policy refuses gets
        `VALIDATION_ERROR` (400) and does not use the token up. On success every session of the
        account ends and two-factor authentication stays as it was. The count of wrong passwords goes
        back to zero and a lock is lifted, unless the count of two-factor attempts has reached five:
        that count adds wrong codes and, while the account is locked, every attempt that carries a
        code, whatever its password. Then the lock stays until it runs out (at most 15 minutes) and
        that count is not changed. So someone who knows only the email address can keep a customer
        with two-factor authentication locked out for up to 15 minutes after a reset.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 128
                newPassword:
                  type: string
                  maxLength: 1024
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          description: The token is live and two password checks run and 16 wait on the server; this one is refused at once and the token stays unused (`RATE_LIMITED`, not retryable). Try again in a minute.
          $ref: "#/components/responses/ErrorResponse"

  /v1/me/password:
    post:
      tags: [Account]
      operationId: changeMyPassword
      summary: Change own password (min 12 chars); revokes the other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 12
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "423":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          description: Two password checks run and 16 wait on the server; this one is refused at once and counts no failed try (`RATE_LIMITED`, not retryable). Try again in a minute.
          $ref: "#/components/responses/ErrorResponse"

  /v1/me/totp/setup:
    post:
      tags: [Account]
      operationId: setupMyTotp
      summary: Generate a TOTP secret (not active until enabled)
      responses:
        "200":
          description: Secret and otpauth URI
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [secretBase32, otpauthUri]
                    properties:
                      secretBase32:
                        type: string
                      otpauthUri:
                        type: string
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /v1/me/totp/enable:
    post:
      tags: [Account]
      operationId: enableMyTotp
      summary: Enable 2FA by confirming a code from the authenticator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "204":
          description: 2FA enabled
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "423":
          $ref: "#/components/responses/ErrorResponse"

  /v1/me/totp/disable:
    post:
      tags: [Account]
      operationId: disableMyTotp
      summary: Disable 2FA (customers only; server administrators must keep it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password:
                  type: string
                code:
                  type: string
      responses:
        "204":
          description: 2FA disabled
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "423":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          description: Two password checks run and 16 wait on the server; this one is refused at once and counts no failed try (`RATE_LIMITED`, not retryable). Try again in a minute.
          $ref: "#/components/responses/ErrorResponse"

  /v1/me/locale:
    patch:
      tags: [Account]
      operationId: setMyLocale
      summary: Set the UI language of the caller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale:
                  type: string
                  enum: [it, en]
      responses:
        "204":
          description: Locale updated
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/users:
    get:
      tags: [Admin Users]
      operationId: listAdminUsers
      summary: List all accounts (platform.users.manage)
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUserDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/customer-account:
    post:
      tags: [Admin Users]
      operationId: createCustomerAccount
      summary: Create the customer organization and its hosting admin (one customer per server)
      description: The temporary password is returned once; the user must change it at first login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationName, ownerName, ownerEmail]
              properties:
                organizationName:
                  type: string
                ownerName:
                  type: string
                ownerEmail:
                  type: string
                  format: email
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [organizationId, userId, temporaryPassword]
                    properties:
                      organizationId:
                        type: string
                      userId:
                        type: string
                      temporaryPassword:
                        type: string
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          description: Two password checks run and 16 wait on the server; this one is refused at once (`RATE_LIMITED`, not retryable). Try again in a minute.
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/administrators:
    post:
      tags: [Admin Users]
      operationId: createAdministrator
      summary: Create another server administrator (audited as admin.administrator.create)
      description: >-
        The temporary password and the TOTP enrolment data are returned once and stored nowhere in
        clear; the new administrator must change the password at first login. An email already in
        use gets `VALIDATION_ERROR` (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        "201":
          description: Administrator created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [userId, email, temporaryPassword, totpSecretBase32, otpauthUri]
                    properties:
                      userId:
                        type: string
                      email:
                        type: string
                        format: email
                      temporaryPassword:
                        type: string
                      totpSecretBase32:
                        type: string
                      otpauthUri:
                        type: string
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          description: Two password checks run and 16 wait on the server; this one is refused at once (`RATE_LIMITED`, not retryable). Try again in a minute.
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/users/{userId}:
    patch:
      tags: [Admin Users]
      operationId: updateAdminUserStatus
      summary: Enable or disable an account (disabling revokes its sessions)
      description: >-
        The target may be a customer or another server administrator; disabling yourself is refused.
        A change that would leave no active server administrator gets `LAST_ADMINISTRATOR_PROTECTED`
        (409).
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AdminUserDto"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/users/{userId}/reset-password:
    post:
      tags: [Admin Users]
      operationId: resetAdminUserPassword
      summary: Issue a new temporary password (returned once)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Temporary password
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [temporaryPassword]
                    properties:
                      temporaryPassword:
                        type: string
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          description: Two password checks run and 16 wait on the server; this one is refused at once (`RATE_LIMITED`, not retryable). Try again in a minute.
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/users/{userId}/reset-totp:
    post:
      tags: [Admin Users]
      operationId: resetAdminUserTotp
      summary: Remove a customer's 2FA (server administrators recover via the SSH CLI only)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 2FA reset
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Retrieve current authenticated principal details and memberships
      responses:
        "200":
          description: Principal context
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MeDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /v1/me/organizations:
    get:
      tags: [Identity]
      operationId: getMyOrganizations
      summary: List organizations where caller holds active membership
      parameters:
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated organization summaries
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationSummaryDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /v1/hosts:
    get:
      tags: [Hosts]
      operationId: listHosts
      summary: List managed physical/virtual Linux host nodes (host.read)
      parameters:
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated host nodes
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/HostDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /v1/hosts/{hostId}:
    get:
      tags: [Hosts]
      operationId: getHost
      summary: Retrieve specific host details (host.read)
      parameters:
        - $ref: "#/components/parameters/HostIdParam"
      responses:
        "200":
          description: Host details
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/HostDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/hosts/{hostId}/telemetry:
    get:
      tags: [Hosts]
      operationId: getHostTelemetry
      summary: Retrieve host telemetry snapshot and daemon heartbeats (host.metrics.read)
      parameters:
        - $ref: "#/components/parameters/HostIdParam"
      responses:
        "200":
          description: Host telemetry and daemon heartbeats
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [hostId, runtimeBackend, telemetry, daemons]
                    properties:
                      hostId:
                        type: string
                      runtimeBackend:
                        $ref: "#/components/schemas/RuntimeBackend"
                      telemetry:
