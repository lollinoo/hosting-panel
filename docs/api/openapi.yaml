  /v1/organizations/{orgId}/managed-sites/{siteId}/files/archive:
    post:
      tags: [Managed Sites]
      operationId: archiveSiteFiles
      summary: Enqueue asynchronous creation of a zip archive (site.files.write)
      description: >-
        Paths are relative to the site's files and travel in the query or the body.
        Enqueues an asynchronous `site.files.archive` operation (`202 Accepted`) locked
        per site; poll `/v1/organizations/{orgId}/operations/{opId}` for completion.
        All source paths must share the same parent folder; links and `.htpanel-*` files
        are skipped. Bounded to 20,000 entries, 1 GiB uncompressed, and depth 32.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteFileArchiveRequest"
      responses:
        "202":
          description: Accepted; follow the returned operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedSiteAccepted"
        "400":
          description: >-
            Invalid path, non-`.zip` target, or missing/invalid `Idempotency-Key`
            (`VALIDATION_ERROR`; schema validation puts `invalid_path` or `not_a_zip` in
            `details[].message` and Zod's issue code in `details[].reason`; header errors put
            `MISSING_IDEMPOTENCY_KEY` or `INVALID_IDEMPOTENCY_KEY` in `details[].reason`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.files.write` permission or protected path (`PERMISSION_DENIED`; reason `protected`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Site not ready or locked by another operation (`RESOURCE_LOCKED`; reason `not_ready`),
            or reused `Idempotency-Key` for another request (`IDEMPOTENCY_CONFLICT`). Worker execution
            errors (`ALREADY_EXISTS`/`exists`, `QUOTA_EXCEEDED`/`archive_limit`/`disk_full`,
            `OPERATION_INTERRUPTED`) are recorded on the operation.
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Runtime execution disabled (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/files/extract:
    post:
      tags: [Managed Sites]
      operationId: extractSiteFileArchive
      summary: Enqueue asynchronous extraction of a zip archive (site.files.write)
      description: >-
        Paths are relative to the site's files and travel in the query or the body.
        Enqueues an asynchronous `site.files.extract` operation (`202 Accepted`) locked
        per site; poll `/v1/organizations/{orgId}/operations/{opId}` for completion.
        Creates `to` when missing (`""` extracts into the root), never overwrites
        existing files (`ALREADY_EXISTS`), refuses unsafe/symlink zip entries
        (`archive_unsafe`), and enforces zip bounds (20,000 entries, 1 GiB uncompressed,
        depth 32, ratio 200 over 1 MiB).
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteFileExtractRequest"
      responses:
        "202":
          description: Accepted; follow the returned operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedSiteAccepted"
        "400":
          description: >-
            Invalid path, non-`.zip` source, or missing/invalid `Idempotency-Key`
            (`VALIDATION_ERROR`; schema validation puts `invalid_path` or `not_a_zip` in
            `details[].message` and Zod's issue code in `details[].reason`; header errors put
            `MISSING_IDEMPOTENCY_KEY` or `INVALID_IDEMPOTENCY_KEY` in `details[].reason`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.files.write` permission or protected path (`PERMISSION_DENIED`; reason `protected`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Site not ready or locked by another operation (`RESOURCE_LOCKED`; reason `not_ready`),
            or reused `Idempotency-Key` for another request (`IDEMPOTENCY_CONFLICT`). Worker execution
            errors (`ALREADY_EXISTS`/`exists`, `QUOTA_EXCEEDED`/`archive_limit`/`disk_full`,
            `VALIDATION_ERROR`/`archive_unsafe`, `OPERATION_INTERRUPTED`) are recorded on the operation.
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Runtime execution disabled (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/sftp:
    get:
      tags: [Managed Sites]
      operationId: getSiteSftp
      summary: Get site SFTP connection details and users (site.sftp.manage)
      description: >-
        Returns SFTP availability, host IP, published TCP port, Ed25519 host key
        fingerprint, and the site's SFTP users (`passwordChangedAt`, never hashes).
        `available` is `true` only when `runtimeBackend` is `linux-systemd`; when SFTP
        is not available on this server (`available: false`), `host`, `port`, and
        `hostKeyFingerprint` are all `null` and `users` is empty. If SFTP is available
        and executor status lookup fails, `port` and `hostKeyFingerprint` fall back to
        `null` without failing the request.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
      responses:
        "200":
          description: SFTP connection details and user list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteSftpDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.sftp.manage` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/sftp/users:
    post:
      tags: [Managed Sites]
      operationId: createSiteSftpUser
      summary: Create an SFTP user for a site (site.sftp.manage)
      description: >-
        Creates a site-confined password-only SFTP user (`username = s<sha256(siteId)[0..8]>_<name>`).
        Enforces at most 10 SFTP users per site (`SITE_SFTP_MAX_USERS`). Returns `temporaryPassword`
        once; only its `$6$` SHA-512 crypt hash is stored and synced to `hp_sftp`.
        Rolls back the database insert if executor application fails.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteSftpUserRequest"
      responses:
        "201":
          description: Created user and one-time temporary password
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteSftpUserCreatedDto"
        "400":
          description: Invalid `name` (`VALIDATION_ERROR`; `invalid_name`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.sftp.manage` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Username already exists (`ALREADY_EXISTS`), per-site 10-user quota reached
            (`QUOTA_EXCEEDED`), or site is being set up or deleted (`RESOURCE_LOCKED`; reason `not_ready`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: SFTP unavailable on the active runtime backend (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"
        "429":
          description: Twelve changes that restart the shared SFTP server were made for this organization in the last hour; refused before anything changes (`RATE_LIMITED`). Only the site's first account restarts the server. Try again later.
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: >-
            Executor or `hp_sftp` container unavailable, or the SFTP queue was busy for
            more than a few seconds; database write rolled back (`DOCKER_ENGINE_UNAVAILABLE`, retryable)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/sftp/users/{userId}/reset-password:
    post:
      tags: [Managed Sites]
      operationId: resetSiteSftpUserPassword
      summary: Reset an SFTP user's password (site.sftp.manage)
      description: >-
        Generates a new one-time `temporaryPassword`, updates the `$6$` hash in place,
        and pushes the updated desired state to `hp_sftp`. Restores the previous hash if
        executor application fails.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
        - $ref: "#/components/parameters/UserIdParam"
      responses:
        "200":
          description: New one-time temporary password
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteSftpPasswordResetDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.sftp.manage` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site or SFTP user not found (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Site is being set up or deleted (`RESOURCE_LOCKED`; reason `not_ready`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: SFTP unavailable on the active runtime backend (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"
        "429":
          description: Twelve changes that restart the shared SFTP server were made for this organization in the last hour; refused before anything changes (`RATE_LIMITED`). Try again later.
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: >-
            Executor or `hp_sftp` container unavailable, or the SFTP queue was busy for
            more than a few seconds; database hash restored (`DOCKER_ENGINE_UNAVAILABLE`, retryable)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/sftp/users/{userId}:
    delete:
      tags: [Managed Sites]
      operationId: deleteSiteSftpUser
      summary: Delete an SFTP user from a site (site.sftp.manage)
      description: >-
        Deletes the SFTP user row and applies the updated desired state to `hp_sftp`.
