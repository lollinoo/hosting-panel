  /v1/organizations/{orgId}/app-stacks/{stackId}/secrets:
    post:
      tags: [App Stacks]
      operationId: setAppStackSecret
      summary: Set or replace the value of a secret parameter of an application (app.update; audited as app.stack.secret.rotate)
      description: >-
        Write-only: the value is stored encrypted as a new version and is never returned, logged or audited; the
        answer says only that a value is set, its version and when. Nothing is queued: the next deploy uses it. A key
        that is not a secret of the application is refused (`VALIDATION_ERROR`, `details[0].field: parameterKey`,
        `details[0].reason: STACK_PARAMETER_INVALID`); a secret the template declares `customer: false` is answered
        exactly like an unknown key, so the answer does not reveal that it exists. A secret the application reads from
        a component's environment (`HCP-STACK/v2`) holds at most 4096 bytes of UTF-8; a longer value is refused
        (`VALIDATION_ERROR`, `details[0].field: value`, `details[0].reason: value_too_long`,
        `details[0].limit: environment`) and nothing is stored. A secret delivered as a file holds at most 24576 bytes
        of UTF-8, the bound of the store, refused the same way with `details[0].limit: store`. A value shorter than 6
        characters, the shortest the log reader masks, is refused (`VALIDATION_ERROR`, `details[0].field: value`,
        `details[0].reason: value_too_short`) and is not echoed; a shorter value stored before still starts the
        application, but the log read of a component that uses it answers 503. Returns 422 NOT_SUPPORTED (reason
        STACK_UNSUPPORTED_FEATURE) while the capability flag `applicationStacksAvailable` is false.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/AppStackIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAppStackSecretInput"
      responses:
        "200":
          description: The secret's state, without its value
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AppStackSecretStateDto"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: The application is being deleted (`RESOURCE_LOCKED`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: "Applications are not available yet (`NOT_SUPPORTED`, `details[0].reason: STACK_UNSUPPORTED_FEATURE`)"
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/app-stacks/{stackId}/backups:
    get:
      tags: [App Stacks]
      operationId: listAppStackBackups
      summary: List the backups of an application, newest first (app.read)
      description: >-
        Each backup says whether it is good and whether it can be restored, never where its copies are: a copy is
        known by its priority only. `unavailableReason` says why a new backup cannot be asked for now:
        `not_available` (this server makes no backups), `no_data` (the application keeps no data) or `no_destination`
        (the server has no usable backup destination); `null` when it can. Returns 422 NOT_SUPPORTED (reason
        STACK_UNSUPPORTED_FEATURE) while the capability flag `applicationStacksAvailable` is false.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/AppStackIdParam"
      responses:
        "200":
          description: The backups
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AppStackBackupsDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: "Applications are not available yet (`NOT_SUPPORTED`, `details[0].reason: STACK_UNSUPPORTED_FEATURE`)"
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [App Stacks]
      operationId: backupAppStack
      summary: Back up the data of an application (app.control; audited as app.stack.backup.create)
      description: >-
        Queued: follow the returned operation (kind `stack.backup`). The application is stopped while its data are
        copied to every backup destination of the server and started again afterwards, also when the copy fails; an
        application that was stopped stays stopped. Refused with 400 when the application keeps no data
        (`details[0].reason: no_data`) or the server has no usable destination (`no_destination`). A customer starts
        at most six backups and restores per application per hour: beyond that the answer is 409 `QUOTA_EXCEEDED`,
        with the time to retry from in `details[0].message` (`field: retryAt`) and in the `Retry-After` header.
        Returns 422 NOT_SUPPORTED (reason STACK_UNSUPPORTED_FEATURE) on a server that makes no backups, and while the
        capability flag `applicationStacksAvailable` is false.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/AppStackIdParam"
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppStackBackupInput"
      responses:
        "202":
          description: Accepted; follow the returned operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppStackAcceptedEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Another operation is running or the status does not allow it (`RESOURCE_LOCKED`), too many backups and restores in the last hour (`QUOTA_EXCEEDED`), or the Idempotency-Key was used for another request (`IDEMPOTENCY_CONFLICT`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: "Backups are not available on this server, or applications are not available yet (`NOT_SUPPORTED`, `details[0].reason: STACK_UNSUPPORTED_FEATURE`)"
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/app-stacks/{stackId}/backups/{backupId}/restore:
    post:
      tags: [App Stacks]
      operationId: restoreAppStackBackup
      summary: Restore a backup into the application it was made from (app.control; audited as app.stack.backup.restore)
      description: >-
        Queued: follow the returned operation (kind `stack.restore`). `confirmName` is the name of the application,
        typed again (`details[0].reason: confirmation_mismatch` otherwise). The application is stopped, the data it
        holds now are saved first as a safety backup (kind `pre_restore`), then the data of the chosen backup replace
        them and the application is started again if it was running. A backup without a good copy, or whose data no
        longer belong to the application, is refused with 400 (`details[0].reason: not_restorable`); an unknown
        backup, and one of another application, is a 404. The hourly limit of `POST .../backups` counts restores too.
        Returns 422 NOT_SUPPORTED (reason STACK_UNSUPPORTED_FEATURE) on a server that makes no backups, and while the
        capability flag `applicationStacksAvailable` is false.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/AppStackIdParam"
        - in: path
          name: backupId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreAppStackBackupInput"
      responses:
        "202":
          description: Accepted; follow the returned operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppStackAcceptedEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Another operation is running or the status does not allow it (`RESOURCE_LOCKED`), too many backups and restores in the last hour (`QUOTA_EXCEEDED`), or the Idempotency-Key was used for another request (`IDEMPOTENCY_CONFLICT`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: "Backups are not available on this server, or applications are not available yet (`NOT_SUPPORTED`, `details[0].reason: STACK_UNSUPPORTED_FEATURE`)"
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/app-stacks/{stackId}/domains:
    get:
      tags: [App Stacks]
      operationId: listAppStackDomains
      summary: List the web addresses of an application, by hostname (app.read)
      description: >-
        Returns 422 NOT_SUPPORTED (reason STACK_UNSUPPORTED_FEATURE) while the capability flag
        `applicationStacksAvailable` is false.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/AppStackIdParam"
      responses:
        "200":
          description: The web addresses
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppStackDomainDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: "Applications are not available yet (`NOT_SUPPORTED`, `details[0].reason: STACK_UNSUPPORTED_FEATURE`)"
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [App Stacks]
      operationId: addAppStackDomain
      summary: Point a web address at an entry point of an application (app.update; audited as app.stack.domain.assign)
      description: >-
        The component and port must be an entry point of the application (`VALIDATION_ERROR`,
        `details[0].reason: unknown_ingress`); at most 8 web addresses (`details[0].field: domains`,
        `details[0].reason: STACK_QUOTA_EXCEEDED`; an address being removed is not counted). A hostname already on this
        application adds nothing and writes no audit row; one being removed from it is refused (`DOMAIN_CONFLICT`)
        until its route is withdrawn. On a running application the route refresh is queued in the same request
        (ADR-0037); while a run of a task of the application executes (ADR-0042, at most its time limit) the address is
        saved all the same and nothing is queued: the application's `routesPending` stays true until the panel's first
        pass after the run publishes it. No Idempotency-Key. Returns 422 NOT_SUPPORTED (reason STACK_UNSUPPORTED_FEATURE) while the
        capability flag `applicationStacksAvailable` is false.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/AppStackIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAppStackDomainInput"
      responses:
        "201":
          description: The web addresses of the application
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppStackDomainDto"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: The hostname is used elsewhere (`DOMAIN_CONFLICT`, `CERTIFICATE_IN_USE`; the other owner is never named), or the application is being deleted (`RESOURCE_LOCKED`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: "Applications are not available yet (`NOT_SUPPORTED`, `details[0].reason: STACK_UNSUPPORTED_FEATURE`)"
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/app-stacks/{stackId}/domains/{domainId}:
    patch:
      tags: [App Stacks]
      operationId: updateAppStackDomain
      summary: Set the routing options of a web address of an application (app.update; audited as app.stack.domain.update)
      description: >-
        Replaces the four options of the address together (ADR-0037): the redirect to another address of the same
        application, the password protection, compression and the paths. An option sent empty is cleared. The password
        is write-only: send `protection.username` alone to keep the one already set (`VALIDATION_ERROR`,
        `details[0].reason: password_required` when none is set). A redirect goes to another address of this
        application that does not redirect itself and that no address redirects to (`redirect_target`,
        `redirect_chain`), and an address that redirects takes no password and no path. Each path points at an entry
        point of both the revision that runs and the desired one (`unknown_ingress`, `details[0].field:
        pathRoutes.<n>.componentKey`); an address being removed is no destination (`redirect_target`) and takes no
        change (409 `RESOURCE_LOCKED`, `details[0].field: domainId`, `details[0].reason: address_removing`). A change
        either reaches every route file of the application that may be
        published or is refused: on a running application the route refresh is queued in the same request; while a
        route file may be in place that the panel cannot rewrite now (an action in progress other than the panel's own
        route refresh, a failed or unknown application, or a stop the customer asked for that did not finish) the
        answer is 409 `RESOURCE_LOCKED` with `details[0].field: status` and `details[0].reason` the status
        (`stop_unfinished` after a stop that did not finish, whose status reads running or degraded), and nothing is
        written. While a run of a task of the application executes (ADR-0042, at most its time limit) the refresh
        cannot be queued: a change that must reach the published route file is refused with the same 409, retryable,
        `details[0].field: status` and `details[0].reason: task_running`, and nothing is written; it goes through once
        the run has ended. The audit row holds the user name and whether a password was sent, never the password. No
        Idempotency-Key. Returns 422 NOT_SUPPORTED (reason STACK_UNSUPPORTED_FEATURE) while the capability flag
        `applicationStacksAvailable` is false.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/AppStackIdParam"
        - $ref: "#/components/parameters/DomainIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppStackDomainInput"
      responses:
        "200":
          description: The web addresses of the application, and when the saved options reach the published address
          content:
            application/json:
              schema:
                type: object
                required: [data, applies]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppStackDomainDto"
                  applies:
                    type: string
                    enum: [shortly, at_start]
                    description: >-
                      `shortly`: the panel rewrites the application's route file in a few moments, without a restart.
                      `at_start`: nothing of the application is published now (not installed yet, or stopped); the
                      options are used when it is next started.
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            The application is being deleted, or a route file of it may be in place that the panel cannot rewrite now
            (`RESOURCE_LOCKED`, `details[0].reason` is the status, or `task_running` while a run of a task executes), or
            the address is being removed (`RESOURCE_LOCKED`, `details[0].reason: address_removing`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: "Applications are not available yet (`NOT_SUPPORTED`, `details[0].reason: STACK_UNSUPPORTED_FEATURE`)"
          $ref: "#/components/responses/ErrorResponse"
    delete:
      tags: [App Stacks]
      operationId: removeAppStackDomain
      summary: Remove a web address from an application (app.update; audited as app.stack.domain.remove)
      description: >-
        Its route is withdrawn: on a running application the route refresh is queued in the same request (ADR-0037).
        Removing frees the hostname, so it is accepted only when that refresh withdraws it now, or when nothing of the
        application is published and no action is open (never installed, or stopped). With nothing published the
        address goes at once; otherwise it stays in the list with `removing: true`, keeping its hostname, until a route
        file of the application without it is published (that refresh, a later one the panel retries after one that
        failed, or a stop that withdraws the routes). Removing it again is refused (409 `RESOURCE_LOCKED`,
        `details[0].field: domainId`, `details[0].reason: address_removing`). Otherwise (any action in
        progress, the panel's own route refresh and a first install included, a failed or unknown application, or a
        stop the customer asked for that did not finish) the answer is 409 `RESOURCE_LOCKED` with `details[0].field:
        status` and `details[0].reason` the status (`stop_unfinished` after a stop that did not finish), and the
        address is kept. While a run of a task of the application executes (ADR-0042, at most its time limit) the
        refresh cannot be queued: a removal that has to withdraw a published route is refused with the same 409,
        retryable, `details[0].reason: task_running`, and the address is kept until the run has ended. No
        Idempotency-Key.
        Returns 422 NOT_SUPPORTED (reason STACK_UNSUPPORTED_FEATURE) while the capability flag
        `applicationStacksAvailable` is false.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/AppStackIdParam"
        - $ref: "#/components/parameters/DomainIdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppStackActionInput"
      responses:
        "200":
          description: The web addresses of the application, the one being removed included until its route is withdrawn
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppStackDomainDto"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            A route file of the application may be in place that the panel cannot rewrite now (`RESOURCE_LOCKED`,
            `details[0].reason` is the status, or `task_running` while a run of a task executes); the address is kept. Or
            the address is already being removed (`RESOURCE_LOCKED`, `details[0].reason: address_removing`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: "Applications are not available yet (`NOT_SUPPORTED`, `details[0].reason: STACK_UNSUPPORTED_FEATURE`)"
          $ref: "#/components/responses/ErrorResponse"

