        `available` is false and `slots` null. A suspended organization still reads this state.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
      responses:
        "200":
          description: WordPress import state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteWordpressImportDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.read` permission (`PERMISSION_DENIED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found or belongs to another organization (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"

    post:
      tags: [Managed Sites]
      operationId: startSiteWordpressImport
      summary: Enqueue a `site.wordpress.import` of the two uploaded files (`site.update`, 202 Accepted)
      description: >-
        Replaces the site's files and database with the uploaded ones. Both slots must be complete.
        When backups are configured a `pre_update` copy of the site is taken first; its row carries
        the import's operation id. Counts toward the hourly limit of 6 heavy actions per site (a server
        administrator's actions are not counted). A replay with the same `Idempotency-Key` answers the
        same operation.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteWordpressImportStartRequest"
      responses:
        "202":
          description: Accepted; follow the returned operation URL
          content:
            application/json:
              schema:
                type: object
                required: [data, links]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteWordpressAcceptedDto"
                  links:
                    type: object
                    required: [operation]
                    properties:
                      operation:
                        type: string
        "400":
          description: Invalid body or missing/invalid `Idempotency-Key` (`VALIDATION_ERROR`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.update` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found or belongs to another organization (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Site deploying/maintenance (`RESOURCE_LOCKED`, reason `not_ready`) or an import of this
            site is running (`RESOURCE_LOCKED`, reason `import_running`), a slot is not complete (`RESOURCE_LOCKED`, reason `files_incomplete`), an earlier
            import was left unfinished (`RESOURCE_LOCKED`, reason `earlier_import_unfinished`; restore a
            copy from Backups first), locked by another operation (`RESOURCE_LOCKED`), reused
            `Idempotency-Key` (`IDEMPOTENCY_CONFLICT`), or hourly limit of 6 heavy actions per site
            reached (`QUOTA_EXCEEDED`, reason `too_many_requests`, `details[].field: retryAt`, `Retry-After` header)
          $ref: "#/components/responses/QuotaConflictErrorResponse"
        "422":
          description: >-
            WordPress tools unavailable on the active backend (`NOT_SUPPORTED`, reason
            `wordpress_unavailable`) or the site is not a WordPress site (`NOT_SUPPORTED`, reason `not_wordpress`)
          $ref: "#/components/responses/ErrorResponse"
        "502":
          description: The files call ended without a confirmed outcome (`OPERATION_AMBIGUOUS`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: File operations temporarily unavailable (`DOCKER_ENGINE_UNAVAILABLE`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/wordpress/import/files:
    delete:
      tags: [Managed Sites]
      operationId: discardSiteWordpressImportFiles
      summary: Discard both uploaded import files (`site.update`, 204 No Content)
      description: >-
        Empties both slots. The work left by an unfinished earlier import is kept, so
        `earlierImportUnfinished` stays true; the answer is still `204`.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
      responses:
        "204":
          description: Both slots are empty
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.update` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found or belongs to another organization (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Site deploying/maintenance (`RESOURCE_LOCKED`, reason `not_ready`) or an import of this
            site is running (`RESOURCE_LOCKED`, reason `import_running`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: >-
            WordPress tools unavailable on the active backend (`NOT_SUPPORTED`, reason
            `wordpress_unavailable`) or the site is not a WordPress site (`NOT_SUPPORTED`, reason `not_wordpress`)
          $ref: "#/components/responses/ErrorResponse"
        "502":
          description: The files call ended without a confirmed outcome (`OPERATION_AMBIGUOUS`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: File operations temporarily unavailable (`DOCKER_ENGINE_UNAVAILABLE`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/wordpress/import/files/{slot}:
    put:
      tags: [Managed Sites]
      operationId: uploadSiteWordpressImportChunk
      summary: Upload one chunk of an import file into a slot (`site.update`)
      description: >-
        Chunks are addressed by `uploadId` and `offset` and are safe to resend; resume a `partial`
        slot at `offset = size` with its `uploadId`. The chunk with `final: true` completes the slot.
        The archive must be a zip; the dump must be SQL text or gzip.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
        - name: slot
          in: path
          required: true
          description: "`archive` (the site files, a zip) or `dump` (the database export, `.sql` or `.sql.gz`)"
          schema:
            type: string
            enum: [archive, dump]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteWordpressImportChunkRequest"
      responses:
        "200":
          description: Bytes of the slot received so far
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteFileWriteResultDto"
        "400":
          description: >-
            Invalid slot or body (`VALIDATION_ERROR`), the chunk does not match the upload
            (`VALIDATION_ERROR`, reason `upload_mismatch`), the archive is not a zip (`VALIDATION_ERROR`,
            reason `not_a_zip`) or the dump is not SQL (`VALIDATION_ERROR`, reason `dump_not_sql`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.update` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found or belongs to another organization (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Site deploying/maintenance (`RESOURCE_LOCKED`, reason `not_ready`) or an import of this
            site is running (`RESOURCE_LOCKED`, reason `import_running`), the file is too large (`QUOTA_EXCEEDED`, reason `too_large`) or the site's
            storage is full (`QUOTA_EXCEEDED`, reason `disk_full`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: >-
            WordPress tools unavailable on the active backend (`NOT_SUPPORTED`, reason
            `wordpress_unavailable`) or the site is not a WordPress site (`NOT_SUPPORTED`, reason `not_wordpress`)
          $ref: "#/components/responses/ErrorResponse"
        "502":
          description: The files call ended without a confirmed outcome (`OPERATION_AMBIGUOUS`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: File operations temporarily unavailable (`DOCKER_ENGINE_UNAVAILABLE`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/managed-sites/{siteId}/wordpress/import/files/{slot}/pick:
    post:
      tags: [Managed Sites]
      operationId: pickSiteWordpressImportFile
      summary: Use a file already in the site's files (for example uploaded by SFTP) as a slot (`site.update`)
      description: >-
        Moves the file at `path` into the slot, which becomes `complete`. The same zip and SQL checks
        as an upload apply.
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/SiteIdParam"
        - name: slot
          in: path
          required: true
          description: "`archive` (the site files, a zip) or `dump` (the database export, `.sql` or `.sql.gz`)"
          schema:
            type: string
            enum: [archive, dump]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteWordpressImportPickRequest"
      responses:
        "200":
          description: The filled slot
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteWordpressImportSlotDto"
        "400":
          description: >-
            Invalid slot, body or path (`VALIDATION_ERROR`, reason `invalid_path` for a path outside the
            site's files), the path is a folder (`VALIDATION_ERROR`, reason `is_a_directory`), the archive
            is not a zip (`VALIDATION_ERROR`, reason `not_a_zip`) or the dump is not SQL (`VALIDATION_ERROR`,
            reason `dump_not_sql`)
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.update` permission or suspended organization (`PERMISSION_DENIED` / `ORGANIZATION_SUSPENDED`), or the file is protected (`PERMISSION_DENIED`, reason `protected`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: >-
            Site not found or belongs to another organization (`NOT_FOUND`), or no file at `path`
            (`NOT_FOUND`, reason `not_found`)
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            Site deploying/maintenance (`RESOURCE_LOCKED`, reason `not_ready`) or an import of this
            site is running (`RESOURCE_LOCKED`, reason `import_running`), the file is too large (`QUOTA_EXCEEDED`, reason `too_large`) or the site's
            storage is full (`QUOTA_EXCEEDED`, reason `disk_full`)
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: >-
            WordPress tools unavailable on the active backend (`NOT_SUPPORTED`, reason
            `wordpress_unavailable`) or the site is not a WordPress site (`NOT_SUPPORTED`, reason `not_wordpress`)
          $ref: "#/components/responses/ErrorResponse"
        "502":
          description: The files call ended without a confirmed outcome (`OPERATION_AMBIGUOUS`)
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: File operations temporarily unavailable (`DOCKER_ENGINE_UNAVAILABLE`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/notifications:
    get:
      tags: [Notifications]
      operationId: adminGetNotifications
      summary: Notification channels of the server and the outcome of the last messages (server administrator only; never returns the address of a webhook, its signing key or a bot token)
      description: >-
        The channels tell every kind of alert of the server when an alert opens and when it closes (ADR-0040).
        `deliveries` holds the last twenty messages of the last thirty days, newest first.
      responses:
        "200":
          description: Notification settings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/NotificationSettingsDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`)
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/notifications/channels/{channel}:
    put:
      tags: [Notifications]
      operationId: adminSaveNotificationChannel
      summary: Create or change the channel of one kind (server administrator only)
      description: >-
        The body depends on `:channel`. A secret left out keeps the stored one: `url` and `signingKey` of a webhook
        (`signingKey: null` removes the key), `botToken` of Telegram; the first save needs `url` or `botToken`.
        A new webhook address is checked before it is stored. Turning a channel off forgets what it was told and
        cancels the messages that wait; nothing is sent. Writes an audit row without the address, the key or the token.
      parameters:
        - $ref: "#/components/parameters/NotificationChannelParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerNotificationChannelInput"
      responses:
        "200":
          description: Notification settings after the save
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/NotificationSettingsDto"
        "400":
          description: >-
            The body does not fit the channel, or (`VALIDATION_ERROR`, `details[0].message`) `address_required`,
            `address_not_allowed` (the address resolves to one the panel never calls), `address_unreachable` (the name
            does not resolve, or the panel could not check it), `bot_token_required` or `group_not_available`
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: "`:channel` is not `email`, `webhook` or `telegram` (`NOT_FOUND`)"
          $ref: "#/components/responses/ErrorResponse"
    delete:
      tags: [Notifications]
      operationId: adminDeleteNotificationChannel
      summary: Remove a channel with its stored secret, what it was told and the outcome of its messages (server administrator only)
      parameters:
        - $ref: "#/components/parameters/NotificationChannelParam"
      responses:
        "200":
          description: Notification settings after the removal
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/NotificationSettingsDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: "`:channel` is not `email`, `webhook` or `telegram`, or the channel is not saved (`NOT_FOUND`)"
          $ref: "#/components/responses/ErrorResponse"

  /v1/admin/notifications/channels/{channel}/test:
    post:
      tags: [Notifications]
      operationId: adminTestNotificationChannel
      summary: Send a test message now on the channel as it is saved, also when it is off, and say whether it went (server administrator only)
      description: >-
        A mail channel sends one message to each of its addresses; the answer reports the first that did not go.
        The outcome is kept with the other messages; a test is never tried again.
      parameters:
        - $ref: "#/components/parameters/NotificationChannelParam"
      responses:
        "200":
          description: Outcome of the test message
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/NotificationTestResult"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Not a server administrator (`PERMISSION_DENIED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: "`:channel` is not `email`, `webhook` or `telegram`, or the channel is not saved (`NOT_FOUND`)"
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: The mail channel has nobody to write to (`NOT_SUPPORTED`)
          $ref: "#/components/responses/ErrorResponse"
        "429":
          description: A test message was sent on this channel less than thirty seconds ago (`RATE_LIMITED`, retryable)
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/notifications:
    get:
      tags: [Notifications]
      operationId: organizationGetNotifications
      summary: Notification channels of a customer and the outcome of the last messages (notification.read; never returns the address of a webhook, its signing key or a bot token)
      description: >-
