          uniqueItems: true
          items:
            type: string
          description: The domains to set, of any site of the organization; absent = every domain of the organization on another version of this certificate
        evictAcme:
          type: boolean
          enum: [true]
        confirmHostname:
          type: string

    TlsCertificateVersionDto:
      type: object
      required: [id, versionNumber, status, subject, issuer, sanDns, wildcard, notBefore, notAfter, serialNumber, fingerprintSha256, keyType, keyBits, createdAt, activatedAt, problem]
      properties:
        id:
          type: string
        versionNumber:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [pending, applying, active, inactive, failed]
        subject:
          type: string
        issuer:
          type: string
