    AddSiteDomainInput:
      type: object
      required: [hostname]
      properties:
        hostname:
          type: string
        includeWww:
          type: boolean
          default: false
        tlsVersionId:
          type: string
          pattern: "^ctv_[0-9a-f]{32}$"
          description: >-
            Create the domain directly on this imported certificate version of the same organization (a new
            address under a wildcard that is already loaded). The domain and a `site.tls.apply` operation are
            created together; the request then needs an `Idempotency-Key` header. Every new name (including the
            `www` pair) must be covered by the version.

    CertificateAlertDto:
      type: object
      required: [kind, siteId, siteName, hostname, expiresAt, problem]
      properties:
        kind:
          type: string
          enum: [expiring, not_issued, panel_expiring]
        siteId:
          type: string
          nullable: true
        siteName:
          type: string
          nullable: true
        hostname:
          type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
        problem:
          type: string
          enum: [rate_limited, port_80_blocked, not_pointing, caa_blocked, dns_provider, other]
          nullable: true

    SiteDomainDto:
      type: object
      required: [id, hostname, isPrimary, routed, challenge, dns, certificate, tls]
      properties:
        id:
          type: string
        hostname:
          type: string
        isPrimary:
          type: boolean
        routed:
          type: boolean
        challenge:
          type: string
          enum: [http-01, dns-01]
        dns:
          type: object
          required: [status, checkedAt, nextCheckAt, observedA, observedAaaa]
          properties:
            status:
              type: string
              enum: [unchecked, ok, not_found, points_elsewhere, ipv6_conflict, lookup_failed]
            checkedAt:
              type: string
              format: date-time
              nullable: true
            nextCheckAt:
              type: string
              format: date-time
            observedA:
              type: array
              items:
                type: string
            observedAaaa:
              type: array
              items:
                type: string
        certificate:
          type: object
          required: [status, problem, expiresAt, retryAt, trusted]
          properties:
            status:
              type: string
              enum: [none, requested, active, failed]
            problem:
              type: string
              enum: [rate_limited, port_80_blocked, not_pointing, caa_blocked, dns_provider, other]
              nullable: true
            expiresAt:
              type: string
              format: date-time
              nullable: true
            retryAt:
              type: string
              format: date-time
              nullable: true
            trusted:
              type: boolean
        tls:
          $ref: "#/components/schemas/SiteDomainTlsDto"

    SiteDomainTlsDto:
      type: object
      required: [mode, certificateId, versionId, state, problem]
      properties:
        mode:
          type: string
          enum: [acme, manual]
          description: "`acme` is the automatic Let's Encrypt certificate; `manual` is an imported one"
        certificateId:
          type: string
          nullable: true
          description: The imported certificate; null in `acme` mode
        versionId:
          type: string
          nullable: true
          description: >-
            The certificate version assigned to the domain; null in `acme` mode. While `state` is `applying`
            this is the version being applied, not yet the one served.
        state:
          type: string
          enum: [applying, active, failed]
          nullable: true
          description: Whether the imported certificate is being put in place, is served, or could not be applied; null in `acme` mode
        problem:
          type: string
          nullable: true
          description: >-
            The `last_error_code` of the assigned version, in any state (for example an `active` domain can show
            a problem that was recorded on the version); null when the version has none. It belongs to the version,
            so every domain using that version shows the same value; null in `acme` mode

    ImportTlsCertificateRequest:
      type: object
      additionalProperties: false
      required: [name, format, leafPem, privateKeyPem]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        format:
          type: string
          enum: [pem]
        leafPem:
          type: string
          maxLength: 524288
          description: Exactly one `CERTIFICATE` block
        chainPem:
          type: string
          maxLength: 524288
          default: ""
          description: Up to 20 intermediate `CERTIFICATE` blocks; may be empty when the leaf chains to a trusted root directly
        privateKeyPem:
          type: string
          maxLength: 524288
          description: One unencrypted `PRIVATE KEY`, `RSA PRIVATE KEY` or `EC PRIVATE KEY` block. Never returned by any route
      description: >-
        The three PEM texts together may not exceed 512 KiB (UTF-8), the whole body 1 MiB
        (`CERTIFICATE_UPLOAD_TOO_LARGE`, 413).

    CreateTlsCertificateVersionRequest:
      type: object
      additionalProperties: false
      required: [format, leafPem, privateKeyPem]
      properties:
        format:
          type: string
          enum: [pem]
        leafPem:
          type: string
          maxLength: 524288
        chainPem:
          type: string
          maxLength: 524288
          default: ""
        privateKeyPem:
          type: string
          maxLength: 524288

    SetDomainTlsRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode:
              type: string
              enum: [acme]
        - type: object
          additionalProperties: false
          required: [mode, versionId]
          properties:
            mode:
              type: string
              enum: [manual]
            versionId:
              type: string
              pattern: "^ctv_[0-9a-f]{32}$"

    AdminSetDomainTlsRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode:
              type: string
              enum: [acme]
            challenge:
              type: string
              enum: [http-01, dns-01]
              description: How the automatic certificate is obtained once the domain returns to ACME
        - type: object
          additionalProperties: false
          required: [mode, versionId]
          properties:
            mode:
              type: string
              enum: [manual]
            versionId:
              type: string
              pattern: "^ctv_[0-9a-f]{32}$"
            evictAcme:
              type: boolean
              enum: [true]
              description: >-
                Allow the cold removal of a Let's Encrypt entry that ties with this certificate (the proxy is
                stopped for a moment, `acme.json` is backed up). Goes with `confirmHostname`; at most one run per
                15 minutes per server
            confirmHostname:
              type: string
              description: The exact hostname of the domain, typed by the administrator

    ActivateTlsVersionRequest:
      type: object
      additionalProperties: false
      properties:
        domainIds:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: string
          description: The domains to set, of any site of the organization; absent = every domain of the organization on another version of this certificate

    TlsMovedDomain:
      type: object
      required: [domainId, siteId, hostname]
      properties:
        domainId:
