      tags: [Admin Sites]
      operationId: adminCloseSupportAccess
      summary: Leave the current support visit
      description: >-
        Server administrators only. Ends every visit of the caller; one admin.support_access.close
        audit row per visit that was still active. Answers 204 also when no visit was open.
