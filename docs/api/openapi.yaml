        scheduleHourUtc:
          type: integer
          minimum: 0
          maximum: 23
          default: 2
        retentionDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 14

    BackupTestResult:
      type: object
      required: [outcome, problem]
      properties:
        outcome:
          type: string
          enum: [ok, failed]
