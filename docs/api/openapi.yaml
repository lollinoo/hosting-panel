                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteWordpressDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          description: Missing `site.read` permission (`PERMISSION_DENIED`)
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Site not found or belongs to another organization (`NOT_FOUND`)
          $ref: "#/components/responses/ErrorResponse"

