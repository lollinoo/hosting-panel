openapi: 3.1.0
info:
  title: Hosting Control Panel API
  version: 0.1.0
  summary: Multi-tenant Coolify v4 SaaS Control-Plane API (HCP-SPEC-001)
  description: >-
    Versioned `/v1` control-plane REST and SSE API enforcing strict organization
    isolation, default-deny RBAC/ABAC authorization, transactional outbox
    mutations (`202 Accepted`), reconciliation with post-deploy health probes,
    and complete provider credential redaction.
servers:
  - url: http://127.0.0.1:4000
    description: Local embedded control-plane development server

security:
  - bearerAuth: []

tags:
  - name: Health
  - name: Auth
  - name: Identity
  - name: Organizations
  - name: Servers
  - name: Applications
  - name: Databases
  - name: Domains
  - name: Operations
  - name: Admin

paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getHealthLive
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [status, service, timestamp]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: hosting-panel-api
                  timestamp:
                    type: string
                    format: date-time

  /health/ready:
    get:
      tags: [Health]
      operationId: getHealthReady
      summary: Readiness probe verifying PostgreSQL connectivity
      security: []
      responses:
        "200":
          description: Control-plane database is reachable
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [status, database, mode, timestamp]
                properties:
                  status:
                    type: string
                    const: ready
                  database:
                    type: string
                    const: up
                  mode:
                    type: string
                    enum: [pglite, postgres]
                  timestamp:
                    type: string
                    format: date-time
        "500":
          $ref: "#/components/responses/ErrorResponse"

  /v1/auth/revoke:
    post:
      tags: [Auth]
      operationId: revokeCurrentToken
      summary: Immediately revoke the caller's active JWT jti (AC-024)
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Token jti added to revocation set
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [revoked, revokedAt]
                    properties:
                      revoked:
                        type: boolean
                        const: true
                      revokedAt:
                        type: string
                        format: date-time
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /v1/dev/auth/personas:
    get:
      tags: [Auth]
      operationId: listDevPersonas
      summary: List seeded demo personas when Dev OIDC is enabled
      security: []
      responses:
        "200":
          description: Seeded demo personas with organizations and roles
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DevPersonaDto"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/dev/auth/token:
    post:
      tags: [Auth]
      operationId: issueDevToken
      summary: Mint a signed RS256 OIDC JWT for a seeded demo persona
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevIssueTokenInput"
      responses:
        "200":
          description: Signed RS256 Bearer token for local POC testing
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/DevIssuedTokenDto"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Return authenticated principal profile, memberships, and impersonation context
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Current principal identity and effective permissions
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MeDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /v1/me/organizations:
    get:
      tags: [Identity]
      operationId: listMyOrganizations
      summary: List organizations where the caller holds an active membership
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated organization summaries
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationSummaryDto"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}:
    get:
      tags: [Organizations]
      operationId: getOrganization
      summary: Inspect organization details and resource counts
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Organization detail
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/OrganizationDetailDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/capabilities:
    get:
      tags: [Organizations]
      operationId: getOrganizationCapabilities
      summary: Evaluate caller effective permissions and provider capability matrix
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Evaluated organization capabilities
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/OrganizationCapabilitiesDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/members:
    get:
      tags: [Organizations]
      operationId: listOrganizationMembers
      summary: List active organization members and assigned roles
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated organization members
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemberDto"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/invitations:
    post:
      tags: [Organizations]
      operationId: createOrganizationInvitation
      summary: Invite a user to join the organization with preset roles
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationInput"
      responses:
        "201":
          description: Invitation created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MemberDto"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/members/{memberId}:
    delete:
      tags: [Organizations]
      operationId: removeOrganizationMember
      summary: Remove an organization member (enforces AC-022 last-owner protection)
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/MemberIdParam"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Member removed
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [deleted, membershipId]
                    properties:
                      deleted:
                        type: boolean
                        const: true
                      membershipId:
                        type: string
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/quotas:
    get:
      tags: [Organizations]
      operationId: getOrganizationQuotas
      summary: Read plan quota usage and limits
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Quota allocation summary
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/QuotaAllocationDto"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/servers:
    get:
      tags: [Servers]
      operationId: listOrganizationServers
      summary: List allocated servers with live Sentinel staleness metadata
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated server allocations
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServerDto"
                  page:
                    $ref: "#/components/schemas/CursorPage"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimitErrorResponse"

  /v1/organizations/{orgId}/servers/{serverId}:
    get:
      tags: [Servers]
      operationId: getOrganizationServer
      summary: Inspect single server allocation and Sentinel heartbeat status (AC-011)
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/ServerIdParam"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Server detail with freshness metadata
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ServerDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimitErrorResponse"

  /v1/organizations/{orgId}/servers/{serverId}/metrics:
    get:
      tags: [Servers]
      operationId: getOrganizationServerMetrics
      summary: Read server resource utilization metrics
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/ServerIdParam"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Server CPU, memory, disk, and uptime metrics
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ServerMetricsDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/applications:
    get:
      tags: [Applications]
      operationId: listOrganizationApplications
      summary: List authorized applications within the organization
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated application summaries
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApplicationSummaryDto"
                  page:
                    $ref: "#/components/schemas/CursorPage"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/applications/{appId}:
    get:
      tags: [Applications]
      operationId: getOrganizationApplication
      summary: Inspect application detail, allowed actions, and recent deployments
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/AppIdParam"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Application detail
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ApplicationDetailDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/applications/{appId}/deployments:
    get:
      tags: [Applications]
      operationId: listApplicationDeployments
      summary: List deployment history for an application
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/AppIdParam"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated deployment records
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeploymentRecordDto"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/applications/{appId}/deploy:
    post:
      tags: [Applications]
      operationId: deployApplication
      summary: Enqueue an asynchronous application deployment via transactional outbox
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/AppIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerOperationInput"
      responses:
        "202":
          $ref: "#/components/responses/AsyncAcceptedResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/applications/{appId}/restart:
    post:
      tags: [Applications]
      operationId: restartApplication
      summary: Enqueue an asynchronous application restart via transactional outbox
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/AppIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerOperationInput"
      responses:
        "202":
          $ref: "#/components/responses/AsyncAcceptedResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/databases:
    get:
      tags: [Databases]
      operationId: listOrganizationDatabases
      summary: List managed databases and per-engine backup capabilities
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated database summaries
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DatabaseSummaryDto"
                  page:
                    $ref: "#/components/schemas/CursorPage"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/databases/{dbId}:
    get:
      tags: [Databases]
      operationId: getOrganizationDatabase
      summary: Inspect managed database detail and restore capability (AC-012)
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/DbIdParam"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Database detail
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/DatabaseDetailDto"
                  meta:
                    $ref: "#/components/schemas/ReadMeta"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/databases/{dbId}/restores:
    post:
      tags: [Databases]
      operationId: triggerDatabaseRestore
      summary: Request database restore (returns 422 NOT_SUPPORTED for unsupported engines/API)
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/DbIdParam"
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                backupId:
                  type: string
      responses:
        "202":
          $ref: "#/components/responses/AsyncAcceptedResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/domains:
    get:
      tags: [Domains]
      operationId: listOrganizationDomains
      summary: List custom domains and attached TLS certificate observations
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated domains
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DomainDto"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Domains]
      operationId: createOrganizationDomain
      summary: Register a canonicalized lowercase FQDN (enforces AC-014 cross-org uniqueness)
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDomainInput"
      responses:
        "201":
          description: Domain registered
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/DomainDto"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /v1/organizations/{orgId}/domains/{domainId}/recheck:
    post:
      tags: [Domains]
      operationId: recheckOrganizationDomain
      summary: Enqueue asynchronous DNS and TLS certificate verification
      parameters:
        - $ref: "#/components/parameters/OrgIdParam"
        - $ref: "#/components/parameters/DomainIdParam"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "202":
