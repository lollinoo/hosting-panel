        when `stackId` is itself a database (`details[0].reason: database_as_application`), when the other application
        is not a database (`not_a_database`) or is a database with more than one component or port
        (`database_not_linkable`), and past 4 databases for an application or 8 applications for a database
        (`details[0].field: links`, `details[0].reason: STACK_QUOTA_EXCEEDED`). No Idempotency-Key. Returns 422
